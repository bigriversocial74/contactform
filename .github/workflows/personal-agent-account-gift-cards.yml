name: Personal Agent Account Gift Cards Validation

on:
  pull_request:
    paths:
      - 'agent.php'
      - 'api/user-agent/chat.php'
      - 'includes/personal-gifting-agent.php'
      - 'includes/personal-agent/gift-result-cards.php'
      - 'assets/js/personal-agent-gift-results.js'
      - 'assets/css/personal-agent-gift-results.css'
      - 'scripts/validate_personal_agent_account_gift_cards.php'
      - '.github/workflows/personal-agent-account-gift-cards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, json
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PHP syntax
        run: |
          php -l agent.php
          php -l api/user-agent/chat.php
          php -l includes/personal-gifting-agent.php
          php -l includes/personal-agent/gift-result-cards.php
          php -l scripts/validate_personal_agent_account_gift_cards.php

      - name: JavaScript syntax
        run: node --check assets/js/personal-agent-gift-results.js

      - name: Account gift-card contract
        run: php scripts/validate_personal_agent_account_gift_cards.php

      - name: Marketplace card regression
        run: php scripts/validate_personal_agent_marketplace_result_cards.php

      - name: Permission-safe context regression
        run: php scripts/validate_personal_agent_account_marketplace_context.php

      - name: Personal Agent runtime regression
        run: php scripts/validate_personal_agent_runtime.php
