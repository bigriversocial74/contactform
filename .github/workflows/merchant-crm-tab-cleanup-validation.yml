name: Merchant CRM Tab Cleanup Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-crm.php'
      - 'includes/merchant-crm-view.php'
      - 'assets/js/merchant-crm-tabs.js'
      - 'assets/js/merchant-crm-retention-playbooks.js'
      - 'assets/js/crm-media-segments.js'
      - 'scripts/validate_merchant_crm_tab_cleanup.php'
      - '.github/workflows/merchant-crm-tab-cleanup-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-crm.php
          php -l includes/merchant-crm-view.php
          php -l scripts/validate_merchant_crm_tab_cleanup.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-crm-tabs.js
          node --check assets/js/merchant-crm-retention-playbooks.js
          node --check assets/js/crm-media-segments.js

      - name: Merchant CRM tab cleanup contract
        run: php scripts/validate_merchant_crm_tab_cleanup.php
