name: Public Pricing and Header Consistency

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'index.php'
      - 'pricing.php'
      - 'includes/pricing-packages.php'
      - 'includes/pricing-cards.php'
      - 'includes/footer.php'
      - 'includes/header-components/public-header.php'
      - 'assets/css/pricing-local-business-v1.css'
      - 'assets/css/public-logged-out-header-unified.css'
      - 'assets/js/homepage-parallax-exact-v2.js'
      - 'scripts/validate_public_site_local_business_v1.php'
      - '.github/workflows/public-pricing-header-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PHP syntax
        run: |
          php -l index.php
          php -l pricing.php
          php -l includes/pricing-packages.php
          php -l includes/pricing-cards.php
          php -l includes/footer.php
          php -l includes/header-components/public-header.php
          php -l scripts/validate_public_site_local_business_v1.php

      - name: Homepage JavaScript syntax
        run: node --check assets/js/homepage-parallax-exact-v2.js

      - name: Public pricing and navigation contract
        run: php scripts/validate_public_site_local_business_v1.php

      - name: Build focused deploy package
        if: matrix.php == '8.2'
        run: |
          zip -r microgifter-pricing-header-deploy.zip \
            index.php \
            pricing.php \
            includes/pricing-packages.php \
            includes/pricing-cards.php \
            includes/footer.php \
            includes/header-components/public-header.php \
            assets/css/pricing-local-business-v1.css \
            scripts/validate_public_site_local_business_v1.php

      - name: Upload focused deploy package
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: microgifter-pricing-header-deploy
          path: microgifter-pricing-header-deploy.zip
          if-no-files-found: error
