name: Quest Regression Comment

on:
  pull_request:
    paths:
      - '.github/workflows/quest-regression-comment.yml'
      - 'scripts/validate_*quest*.php'
      - 'loyalty-quest.php'
      - 'my-quests.php'
      - 'api/public/loyalty-quest/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Capture validator output
        shell: bash
        run: |
          set +e
          {
            echo '## Quest regression diagnostics'
            for item in \
              participant:scripts/validate_participant_quest_experience_v1.php \
              public:scripts/validate_public_loyalty_quest_marketplace_v1.php \
              campaign:scripts/validate_loyalty_quest_campaign_type_v1.php \
              merchant:scripts/validate_merchant_quest_management_v1.php
            do
              name="${item%%:*}"
              script="${item#*:}"
              echo
              echo "### ${name}"
              echo '```json'
              php "$script" 2>&1
              echo '```'
            done
          } > /tmp/quest-diagnostics.md
          exit 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/quest-diagnostics.md', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
