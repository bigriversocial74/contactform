name: Temporary MCP Lock Refresh

on:
  push:
    branches: [feature/mcp-phase1-protocol-registry-v1-20260720]
    paths:
      - 'services/mcp/package.json'
      - 'services/mcp/package-lock.json'
      - '.github/workflows/mcp-lock-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mcp-phase1-protocol-registry-v1-20260720
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - name: Refresh exact package lock
        working-directory: services/mcp
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock if changed
        run: |
          if git diff --quiet -- services/mcp/package-lock.json; then
            echo 'Package lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mcp/package-lock.json
          git commit -m 'Refresh MCP protocol package lock'
          git push origin HEAD:feature/mcp-phase1-protocol-registry-v1-20260720
