name: Merchant Stamp Ledger Cleanup Validation

on:
  pull_request:
    paths:
      - 'merchant-stamps.php'
      - 'includes/merchant-stamps-view.php'
      - 'includes/merchant-workspace.php'
      - 'assets/css/merchant-stamps-ledger.css'
      - 'assets/js/merchant-stamps.js'
      - 'scripts/validate_merchant_stamp_ledger_cleanup.php'
      - 'scripts/validate_inbox_sidebar_crm_quest_nav_cleanup.php'
      - '.github/workflows/merchant-stamp-ledger-cleanup-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: PHP syntax
        run: |
          php -l merchant-stamps.php
          php -l includes/merchant-stamps-view.php
          php -l includes/merchant-workspace.php
          php -l scripts/validate_merchant_stamp_ledger_cleanup.php
          php -l scripts/validate_inbox_sidebar_crm_quest_nav_cleanup.php

      - name: JavaScript syntax
        run: node --check assets/js/merchant-stamps.js

      - name: Stamp ledger cleanup contract
        run: php scripts/validate_merchant_stamp_ledger_cleanup.php

      - name: Global merchant sidebar contract
        run: php scripts/validate_inbox_sidebar_crm_quest_nav_cleanup.php
