name: Homepage Redesign Foundation Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'index.php'
      - 'merchant-landing.php'
      - 'scripts/validate_homepage_redesign_foundation.php'
      - '.github/workflows/homepage-redesign-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l index.php
          php -l merchant-landing.php
          php -l scripts/validate_homepage_redesign_foundation.php

      - name: Homepage foundation contract
        run: php scripts/validate_homepage_redesign_foundation.php
