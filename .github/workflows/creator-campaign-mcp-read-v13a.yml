name: Creator Campaign MCP Read v13A

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'api/internal/_mcp_creator_campaign_bridge.php'
      - 'api/internal/mcp-bridge.php'
      - 'services/mcp/src/bridge/canonicalBridge.ts'
      - 'services/mcp/src/tools/creatorCampaigns.ts'
      - 'services/mcp/src/tools/registry.ts'
      - 'services/mcp/tests/creatorCampaigns.test.mjs'
      - 'database/20260722_creator_campaign_mcp_read_scopes_v13a_single_install.sql'
      - 'scripts/validate_creator_campaign_mcp_v13a.php'
      - 'tests/phpunit/CreatorCampaignMcpReadV13aContractTest.php'
      - 'docs/creator-campaigns/CREATOR_CAMPAIGN_PHASE13A_MCP_READ_TOOLS.md'
      - '.github/workflows/creator-campaign-mcp-read-v13a.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-mcp-read-v13a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2', '8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: services/mcp/package-lock.json}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefix services/mcp
      - name: PHP syntax
        run: |
          php -l api/internal/_mcp_creator_campaign_bridge.php
          php -l api/internal/mcp-bridge.php
          php -l scripts/validate_creator_campaign_mcp_v13a.php
          php -l tests/phpunit/CreatorCampaignMcpReadV13aContractTest.php
      - name: MCP TypeScript and Node contracts
        run: npm test --prefix services/mcp
      - name: Phase 13A score
        run: php scripts/validate_creator_campaign_mcp_v13a.php
      - name: Phase 13A PHPUnit
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignMcpReadV13aContractTest.php
      - name: Phase 12 compatibility
        run: php scripts/validate_creator_campaign_crm_v12.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignCrmV12ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php

  scope-sql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Apply Phase 13A scopes
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_read_scopes_v13a_single_install.sql
      - name: Verify read-only scope contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog WHERE scope_key LIKE 'creator_campaign%:read' AND operation_class='read' AND active=1 AND grantable=1;")" = "11"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog WHERE scope_key LIKE 'creator_campaign%' AND operation_class<>'read';")" = "0"
      - name: Verify SQL idempotency
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_read_scopes_v13a_single_install.sql
