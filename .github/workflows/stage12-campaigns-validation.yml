name: Stage 12 Campaigns Validation

on:
  pull_request:
    paths:
      - 'database/stage_12_campaigns_reward_templates.sql'
      - 'database/stage_12b_campaign_events_agent_context.sql'
      - 'database/watch_video_reward_v1_4.sql'
      - 'database/listen_music_reward_v1_5.sql'
      - 'database/campaign_type_enum_foundation_20260709.sql'
      - 'campaign.php'
      - 'wallet.php'
      - 'watch-reward.php'
      - 'listen-reward.php'
      - 'check-in-reward.php'
      - 'instant-win.php'
      - 'stamp-card.php'
      - 'rsvp-event.php'
      - 'merchant-wallet-redemptions.php'
      - 'merchant-campaigns.php'
      - 'merchant-reward-templates.php'
      - 'includes/merchant-campaigns-view.php'
      - 'includes/merchant-reward-templates-view.php'
      - 'includes/campaign-types.php'
      - 'api/account/wallet-*.php'
      - 'api/merchant/reward-templates.php'
      - 'api/merchant/campaigns.php'
      - 'api/merchant/campaign-activity.php'
      - 'api/merchant/campaign-contacts.php'
      - 'api/merchant/campaign-detail.php'
      - 'api/merchant/campaign-public-tools.php'
      - 'api/merchant/campaign-landing-page-qa.php'
      - 'api/merchant/customer-refund-campaigns.php'
      - 'api/merchant/customer-refund-send.php'
      - 'api/merchant/customer-refund-qa.php'
      - 'api/merchant/watch-video-upload.php'
      - 'api/merchant/listen-audio-upload.php'
      - 'api/merchant/campaign-media-image-upload.php'
      - 'api/merchant/campaign-winner.php'
      - 'api/merchant/wallet-redeem.php'
      - 'api/merchant/locations.php'
      - 'api/public/campaigns/*.php'
      - 'api/public/offers/*.php'
      - 'api/public/wallet/*.php'
      - 'assets/css/listen-watch-media-flow-v1.css'
      - 'assets/js/stage12-*.js'
      - 'assets/js/public-campaign.js'
      - 'assets/js/public-watch-video-reward.js'
      - 'assets/js/public-listen-music-reward.js'
      - 'assets/js/public-check-in-reward.js'
      - 'assets/js/public-instant-win.js'
      - 'assets/js/public-stamp-card.js'
      - 'assets/js/public-rsvp-event.js'
      - 'scripts/validate_stage12*.php'
      - 'scripts/validate_campaign_types_*.php'
      - 'scripts/validate_campaign_type_enum_foundation.php'
      - 'scripts/validate_customer_refund_*.php'
      - 'scripts/validate_watch_video_reward_*.php'
      - 'scripts/validate_listen_music_reward_*.php'
      - '.github/workflows/stage12-campaigns-validation.yml'
  push:
    branches:
      - main
      - 'stage12-*'
      - 'stage12b-*'
      - 'stage12c-*'
    paths:
      - 'database/stage_12_campaigns_reward_templates.sql'
      - 'database/stage_12b_campaign_events_agent_context.sql'
      - 'database/watch_video_reward_v1_4.sql'
      - 'database/listen_music_reward_v1_5.sql'
      - 'database/campaign_type_enum_foundation_20260709.sql'
      - 'campaign.php'
      - 'wallet.php'
      - 'watch-reward.php'
      - 'listen-reward.php'
      - 'check-in-reward.php'
      - 'instant-win.php'
      - 'stamp-card.php'
      - 'rsvp-event.php'
      - 'merchant-wallet-redemptions.php'
      - 'merchant-campaigns.php'
      - 'merchant-reward-templates.php'
      - 'includes/merchant-campaigns-view.php'
      - 'includes/merchant-reward-templates-view.php'
      - 'includes/campaign-types.php'
      - 'api/account/wallet-*.php'
      - 'api/merchant/*.php'
      - 'api/public/campaigns/*.php'
      - 'api/public/offers/*.php'
      - 'api/public/wallet/*.php'
      - 'assets/css/listen-watch-media-flow-v1.css'
      - 'assets/js/stage12-*.js'
      - 'assets/js/public-campaign.js'
      - 'assets/js/public-watch-video-reward.js'
      - 'assets/js/public-listen-music-reward.js'
      - 'assets/js/public-check-in-reward.js'
      - 'assets/js/public-instant-win.js'
      - 'assets/js/public-stamp-card.js'
      - 'assets/js/public-rsvp-event.js'
      - 'scripts/validate_stage12*.php'
      - 'scripts/validate_campaign_types_*.php'
      - 'scripts/validate_campaign_type_enum_foundation.php'
      - 'scripts/validate_customer_refund_*.php'
      - 'scripts/validate_watch_video_reward_*.php'
      - 'scripts/validate_listen_music_reward_*.php'
      - '.github/workflows/stage12-campaigns-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage12-campaigns-validation:
    name: Stage 12 campaigns validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l campaign.php
          php -l wallet.php
          php -l watch-reward.php
          php -l listen-reward.php
          php -l check-in-reward.php
          php -l instant-win.php
          php -l stamp-card.php
          php -l rsvp-event.php
          php -l merchant-wallet-redemptions.php
          php -l merchant-campaigns.php
          php -l merchant-reward-templates.php
          php -l includes/campaign-types.php
          php -l includes/merchant-campaigns-view.php
          php -l includes/merchant-reward-templates-view.php
          php -l api/account/wallet-items.php
          php -l api/account/wallet-claim.php
          php -l api/merchant/reward-templates.php
          php -l api/merchant/campaigns.php
          php -l api/merchant/campaign-activity.php
          php -l api/merchant/campaign-contacts.php
          php -l api/merchant/campaign-detail.php
          php -l api/merchant/campaign-public-tools.php
          php -l api/merchant/campaign-landing-page-qa.php
          php -l api/merchant/customer-refund-campaigns.php
          php -l api/merchant/customer-refund-send.php
          php -l api/merchant/customer-refund-qa.php
          php -l api/merchant/watch-video-upload.php
          php -l api/merchant/listen-audio-upload.php
          php -l api/merchant/campaign-media-image-upload.php
          php -l api/merchant/campaign-winner.php
          php -l api/merchant/wallet-redeem.php
          php -l api/merchant/locations.php
          php -l api/public/campaigns/detail.php
          php -l api/public/campaigns/signup.php
          php -l api/public/campaigns/qr-pickup.php
          php -l api/public/campaigns/contest-entry.php
          php -l api/public/campaigns/survey-feedback.php
          php -l api/public/campaigns/check-in.php
          php -l api/public/campaigns/instant-win.php
          php -l api/public/campaigns/stamp-card.php
          php -l api/public/campaigns/rsvp-event.php
          php -l api/public/campaigns/watch-progress.php
          php -l api/public/campaigns/listen-progress.php
          php -l api/public/offers/search.php
          php -l api/public/wallet/add.php
          php -l scripts/validate_stage12_campaigns_reward_templates.php
          php -l scripts/validate_stage12b_runtime_fixes.php
          php -l scripts/validate_stage12c_wallet_campaign_pages.php
          php -l scripts/validate_campaign_types_public_landing_page_qa_v1_2.php
          php -l scripts/validate_campaign_type_enum_foundation.php
          php -l scripts/validate_customer_refund_v1_crm_make_good.php
          php -l scripts/validate_customer_refund_v1_1_qa_send_history.php
          php -l scripts/validate_customer_refund_v1_2_multiple_vouchers.php
          php -l scripts/validate_customer_refund_v1_3_status_language.php
          php -l scripts/validate_watch_video_reward_v1_4.php
          php -l scripts/validate_listen_music_reward_v1_5.php
      - name: Validate Stage 12 campaigns foundation
        shell: bash
        run: php scripts/validate_stage12_campaigns_reward_templates.php
      - name: Validate Stage 12B runtime fixes
        shell: bash
        run: php scripts/validate_stage12b_runtime_fixes.php
      - name: Validate Stage 12C wallet campaign pages
        shell: bash
        run: php scripts/validate_stage12c_wallet_campaign_pages.php
      - name: Validate Campaign Types public landing QA
        shell: bash
        run: php scripts/validate_campaign_types_public_landing_page_qa_v1_2.php
      - name: Validate Campaign Type enum foundation
        shell: bash
        run: php scripts/validate_campaign_type_enum_foundation.php
      - name: Validate Customer Refund make-good
        shell: bash
        run: php scripts/validate_customer_refund_v1_crm_make_good.php
      - name: Validate Customer Refund QA history
        shell: bash
        run: php scripts/validate_customer_refund_v1_1_qa_send_history.php
      - name: Validate Customer Refund multiple vouchers
        shell: bash
        run: php scripts/validate_customer_refund_v1_2_multiple_vouchers.php
      - name: Validate Customer Refund status language
        shell: bash
        run: php scripts/validate_customer_refund_v1_3_status_language.php
      - name: Validate Watch Video Reward v1.4
        shell: bash
        run: php scripts/validate_watch_video_reward_v1_4.php
      - name: Validate Listen Music Reward v1.5
        shell: bash
        run: php scripts/validate_listen_music_reward_v1_5.php
