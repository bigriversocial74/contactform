name: Apply Public Donations Phase 5 Validation Fixes

on:
  push:
    branches:
      - feature/public-donations-recall-controls-v1
    paths:
      - '.github/workflows/apply-public-donations-phase5-validation-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-donations-recall-controls-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply exact guarded fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('assets/js/public-donations-recall.js')
          text = js.read_text()
          old = "summary.appendChild(node('span', '', ((preview.reward_template && preview.reward_template.title) || 'Reward') + ' · batch ' + ((preview.batch && preview.batch.id) || ''));"
          new = "summary.appendChild(node('span', '', ((preview.reward_template && preview.reward_template.title) || 'Reward') + ' · batch ' + ((preview.batch && preview.batch.id) || '')));"
          if new not in text:
              matches = text.count(old)
              if matches != 1:
                  raise SystemExit(f'JavaScript fix expected one match, found {matches}')
              js.write_text(text.replace(old, new, 1))

          validator = Path('scripts/validate_public_donations_recall_v1.php')
          text = validator.read_text()
          old = "    \"return 'recallable'\","
          new = "    \"? 'recallable' : 'unavailable'\","
          if new not in text:
              matches = text.count(old)
              if matches != 1:
                  raise SystemExit(f'validator fix expected one match, found {matches}')
              validator.write_text(text.replace(old, new, 1))
          PY
      - name: Validate fixed files
        run: |
          node --check assets/js/public-donations-recall.js
          php -l scripts/validate_public_donations_recall_v1.php
          php scripts/validate_public_donations_recall_v1.php
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'Validation fixes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/public-donations-recall.js scripts/validate_public_donations_recall_v1.php
          git commit -m 'Fix Phase 5 JavaScript and focused contract'
          git push origin HEAD:feature/public-donations-recall-controls-v1
