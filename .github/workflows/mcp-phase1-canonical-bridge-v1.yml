name: MCP Phase 1 Canonical Bridge v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'api/internal/_mcp_bridge.php'
      - 'api/internal/mcp-bridge.php'
      - 'includes/profiles/_product_discovery.php'
      - 'services/mcp/**'
      - 'config/mcp_phase1_canonical_bridge_release.php'
      - 'docs/MICROGIFTER_MCP_PHASE1_CANONICAL_BRIDGE_RUNBOOK.md'
      - 'scripts/validate_mcp_phase1_canonical_bridge.php'
      - 'tests/phpunit/McpPhase1CanonicalBridgeV1ContractTest.php'
      - '.github/workflows/mcp-phase1-canonical-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and test canonical bridge
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/mcp-canonical-bridge-typescript.log
      - name: Upload TypeScript log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-canonical-bridge-typescript-log
          path: /tmp/mcp-canonical-bridge-typescript.log
          if-no-files-found: error

  php-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: php-contracts (${{ matrix.php }})
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_CLAIM_CODE_PEPPER: ci-mcp-canonical-bridge-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l api/internal/_mcp_bridge.php
          php -l api/internal/mcp-bridge.php
          php -l includes/profiles/_product_discovery.php
          php -l config/mcp_phase1_canonical_bridge_release.php
          php -l scripts/validate_mcp_phase1_canonical_bridge.php
          php -l tests/phpunit/McpPhase1CanonicalBridgeV1ContractTest.php
      - name: MCP canonical bridge executable contract
        run: php scripts/validate_mcp_phase1_canonical_bridge.php
      - name: MCP canonical bridge PHPUnit contract
        run: |
          vendor/bin/phpunit \
            tests/phpunit/McpPhase1CanonicalBridgeV1ContractTest.php \
            tests/phpunit/McpPhase1ProtocolV1ContractTest.php \
            tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Task Agent Phase 4 and Approval Center regressions
        run: |
          vendor/bin/phpunit \
            tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php \
            tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php \
            tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php
      - name: Repository production-quality audit
        run: composer audit-repository-quality
