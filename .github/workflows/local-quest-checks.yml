name: Local Quest Checks

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'examples/local-quest-rewards/**'
      - 'docs/local-quest-*.md'
      - 'docs/public-api-third-party-wallet-claim.md'
      - 'scripts/validate_local_quest_*.php'
      - '.github/workflows/local-quest-checks.yml'
  push:
    branches:
      - main
      - integration-from-repair-20260628
      - 'lq-*'
      - 'saf-*'
      - 'feature/local-quest-*'
    paths:
      - 'examples/local-quest-rewards/**'
      - 'docs/local-quest-*.md'
      - 'docs/public-api-third-party-wallet-claim.md'
      - 'scripts/validate_local_quest_*.php'
      - '.github/workflows/local-quest-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-quest-validation:
    name: Local Quest validation (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file"
          done < <(find examples/local-quest-rewards scripts -name '*.php' -type f | sort)

      - name: Foundation contract
        run: php scripts/validate_local_quest_rewards_demo.php

      - name: Demo v2 contract
        run: php scripts/validate_local_quest_demo_v2.php

      - name: Signed QR contract
        run: php scripts/validate_local_quest_signed_qr_enforcement.php

      - name: Replay storage contract
        run: php scripts/validate_local_quest_replay_storage.php

      - name: Replay admin contract
        run: php scripts/validate_local_quest_replay_admin.php

      - name: Production foundation contract
        run: php scripts/validate_local_quest_production_foundation_v1.php

      - name: Assert SQL-only runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -f examples/local-quest-rewards/scripts/migrate-json-to-sql.php
          test ! -f examples/local-quest-rewards/data/README.md
          if find examples/local-quest-rewards -maxdepth 2 -name '*.php' -type f -print0 | xargs -0 grep -nE 'lqr_state_path|file_put_contents\(lqr_state_path'; then
            echo 'JSON runtime reference found in Quest PHP files.' >&2
            exit 1
          fi
          if grep -RInE --include='*.php' 'file_put_contents\([^)]*webhook-events\.log|href=[^>]*webhook-events\.log' examples/local-quest-rewards; then
            echo 'Public file-backed webhook logging returned to Local Quest.' >&2
            exit 1
          fi
