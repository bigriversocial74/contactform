name: One-time Quest Public Cover Routing

on:
  push:
    branches:
      - feature/quest-media-promotional-assets-v1-20260711-r2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quest-media-promotional-assets-v1-20260711-r2
          fetch-depth: 0
      - name: Patch public cover URL and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('api/merchant/loyalty-quest-creative.php')
          text=path.read_text()
          old="""        $asset = $coverAssetId !== '' ? mg_lqc_asset($pdo,$merchantId,$coverAssetId) : null;
        if ($asset) $coverUrl = (string)$asset['url'];
        $publicUrl = mg_lqc_public_url($campaign);
"""
          new="""        $asset = $coverAssetId !== '' ? mg_lqc_asset($pdo,$merchantId,$coverAssetId) : null;
        $publicRef = (string)($campaign['public_slug'] ?: $campaign['public_id']);
        if ($asset) $coverUrl = mg_lqc_base_url() . '/api/public/loyalty-quest/media.php?campaign=' . rawurlencode($publicRef) . '&asset=' . rawurlencode((string)$asset['public_id']);
        $publicUrl = mg_lqc_public_url($campaign);
"""
          if old in text:text=text.replace(old,new,1)
          elif "api/public/loyalty-quest/media.php?campaign=" not in text:raise SystemExit('GET cover marker missing')
          old2="""    $asset = $coverAssetId !== '' ? mg_lqc_asset($pdo,$merchantId,$coverAssetId) : null;
    $coverUrl = $asset ? (string)$asset['url'] : $externalUrl;
    $rules = $campaign['rules'];
"""
          new2="""    $asset = $coverAssetId !== '' ? mg_lqc_asset($pdo,$merchantId,$coverAssetId) : null;
    $publicRef = (string)($campaign['public_slug'] ?: $campaign['public_id']);
    $coverUrl = $asset ? mg_lqc_base_url() . '/api/public/loyalty-quest/media.php?campaign=' . rawurlencode($publicRef) . '&asset=' . rawurlencode((string)$asset['public_id']) : $externalUrl;
    $rules = $campaign['rules'];
"""
          if old2 in text:text=text.replace(old2,new2,1)
          elif text.count("api/public/loyalty-quest/media.php?campaign=")<2:raise SystemExit('POST cover marker missing')
          path.write_text(text)
          Path('.github/workflows/patch-quest-public-cover-once.yml').unlink()
          PY
          php -l api/merchant/loyalty-quest-creative.php
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/merchant/loyalty-quest-creative.php .github/workflows/patch-quest-public-cover-once.yml
          git commit -m "Route quest covers through campaign media authority"
          git push origin HEAD:feature/quest-media-promotional-assets-v1-20260711-r2
