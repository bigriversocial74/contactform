name: Merchant CRM Contacts Only Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-crm.php'
      - 'includes/merchant-crm-view.php'
      - 'assets/css/merchant-crm-contacts-only.css'
      - 'scripts/validate_merchant_crm_contacts_only.php'
      - 'tests/phpunit/MerchantCrmContactsOnlyContractTest.php'
      - '.github/workflows/merchant-crm-contacts-only-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-crm.php
          php -l includes/merchant-crm-view.php
          php -l scripts/validate_merchant_crm_contacts_only.php
          php -l tests/phpunit/MerchantCrmContactsOnlyContractTest.php

      - name: Contacts-only contract
        run: php scripts/validate_merchant_crm_contacts_only.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantCrmContactsOnlyContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi