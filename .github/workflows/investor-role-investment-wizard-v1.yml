name: Investor Role and Investment Wizard v1

on:
  pull_request:
    paths:
      - 'database/20260723_investor_role_investment_wizard_v1_single_install.sql'
      - 'includes/investment/investment-service.php'
      - 'api/investment/**'
      - 'api/admin/investor-access.php'
      - 'api/admin/investment-wizard.php'
      - 'investor-access.php'
      - 'investor-portal.php'
      - 'admin/investor-access-requests.php'
      - 'admin/investment-wizard.php'
      - 'assets/css/investment-system-v1.css'
      - 'assets/js/investor-access-v1.js'
      - 'assets/js/admin-investor-access-v1.js'
      - 'assets/js/investment-wizard-v1.js'
      - 'assets/js/investor-portal-v1.js'
      - 'scripts/validate_investor_role_investment_wizard_v1.php'
      - 'docs/investment/investment-wizard-v1.md'
      - 'includes/account-sidebar.php'
      - '.github/workflows/investor-role-investment-wizard-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: |
          php -l includes/investment/investment-service.php
          php -l api/investment/access-request.php
          php -l api/investment/portal.php
          php -l api/admin/investor-access.php
          php -l api/admin/investment-wizard.php
          php -l investor-access.php
          php -l investor-portal.php
          php -l admin/investor-access-requests.php
          php -l admin/investment-wizard.php
          php -l scripts/validate_investor_role_investment_wizard_v1.php
          php -l includes/account-sidebar.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/investor-access-v1.js
          node --check assets/js/admin-investor-access-v1.js
          node --check assets/js/investment-wizard-v1.js
          node --check assets/js/investor-portal-v1.js
      - name: Investment system contract
        run: php scripts/validate_investor_role_investment_wizard_v1.php
      - name: SQL single-install contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS investor_access_requests" database/20260723_investor_role_investment_wizard_v1_single_install.sql
          grep -q "CREATE TABLE IF NOT EXISTS investment_scenarios" database/20260723_investor_role_investment_wizard_v1_single_install.sql
          grep -q "CREATE TABLE IF NOT EXISTS investment_round_versions" database/20260723_investor_role_investment_wizard_v1_single_install.sql
          grep -q "CREATE TABLE IF NOT EXISTS investment_ai_analyses" database/20260723_investor_role_investment_wizard_v1_single_install.sql
