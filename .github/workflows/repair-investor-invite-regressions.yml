name: Repair Investor Invite Regressions

on:
  push:
    branches:
      - feature/investor-invite-onboarding-v1-20260729

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/investor-invite-onboarding-v1-20260729
          fetch-depth: 0

      - name: Repair migration classification and retained contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('config/migrations.php')
          text = migration.read_text(encoding='utf-8')
          ordered = "        '20260729_investor_invite_onboarding_v1.sql',\n"
          manual_anchor = "        '20260724_investor_module_audit_hardening_v1.sql' => 'Manual additive Investor Module audit migration; apply only after Investor Phases 1-5.',\n"
          manual_entry = "        '20260729_investor_invite_onboarding_v1.sql' => 'Manual additive Investor Invite and Onboarding migration; apply only after Investor Phases 1-5 and Investor Center v6.',\n"
          if ordered in text:
              text = text.replace(ordered, '', 1)
          if manual_entry not in text:
              if manual_anchor not in text:
                  raise SystemExit('Investor manual migration anchor not found.')
              text = text.replace(manual_anchor, manual_anchor + manual_entry, 1)
          migration.write_text(text, encoding='utf-8')

          public_validator = Path('scripts/validate_public_site_local_business_v1.php')
          text = public_validator.read_text(encoding='utf-8')
          old = """    'sign-in and registration contracts remain intact' => str_contains($signin, '/api/auth/login.php')
        && str_contains($signin, 'data-success-redirect=\"/agent.php\"')
        && str_contains($signup, '/api/auth/register.php')
        && str_contains($signup, 'name=\"selected_plan\"'),"""
          new = """    'sign-in and registration contracts remain intact' => str_contains($signin, '/api/auth/login.php')
        && str_contains($signin, 'data-success-redirect=\"<?= mg_e($returnPath) ?>\"')
        && str_contains($signin, "mg_safe_return_path($requestedReturn) : '/agent.php'")
        && str_contains($signup, '/api/auth/register.php')
        && str_contains($signup, 'name=\"selected_plan\"')
        && str_contains($signup, 'data-success-redirect=\"<?= mg_e($returnPath) ?>\"')
        && str_contains($signup, 'mg_safe_return_path($requestedReturn)'),"""
          if old not in text:
              raise SystemExit('Public-site sign-in contract block not found.')
          public_validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          invite_validator = Path('scripts/validate_investor_invite_onboarding_v1.php')
          text = invite_validator.read_text(encoding='utf-8')
          read_anchor = "$workflow = $read('.github/workflows/investor-invite-onboarding-v1.yml');\n"
          manifest_line = "$migrationManifest = require $root . '/config/migrations.php';\n"
          if manifest_line not in text:
              if read_anchor not in text:
                  raise SystemExit('Invite validator manifest insertion anchor not found.')
              text = text.replace(read_anchor, read_anchor + manifest_line, 1)
          old_check = """        && str_contains($sql, 'CREATE TABLE IF NOT EXISTS investor_invitation_events')
        && str_contains($sql, '20260729_investor_invite_onboarding_v1'),"""
          new_check = """        && str_contains($sql, 'CREATE TABLE IF NOT EXISTS investor_invitation_events')
        && str_contains($sql, '20260729_investor_invite_onboarding_v1')
        && is_array($migrationManifest)
        && !in_array('20260729_investor_invite_onboarding_v1.sql', $migrationManifest['ordered_files'] ?? [], true)
        && array_key_exists('20260729_investor_invite_onboarding_v1.sql', $migrationManifest['manual_only'] ?? []),"""
          if old_check not in text:
              raise SystemExit('Invite validator migration check block not found.')
          invite_validator.write_text(text.replace(old_check, new_check, 1), encoding='utf-8')
          PY

          php -l config/migrations.php
          php -l scripts/validate_public_site_local_business_v1.php
          php -l scripts/validate_investor_invite_onboarding_v1.php
          php scripts/validate_migration_manifest.php
          php scripts/validate_public_site_local_business_v1.php
          php scripts/validate_investor_invite_onboarding_v1.php

          if git diff --quiet -- config/migrations.php scripts/validate_public_site_local_business_v1.php scripts/validate_investor_invite_onboarding_v1.php; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/migrations.php scripts/validate_public_site_local_business_v1.php scripts/validate_investor_invite_onboarding_v1.php
          git commit -m "Repair Investor Invite migration and retained contracts"
          git push origin HEAD:feature/investor-invite-onboarding-v1-20260729
