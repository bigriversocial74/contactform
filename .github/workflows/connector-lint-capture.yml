name: Connector PHP Lint Capture

on:
  push:
    branches:
      - feature/homeserver-cloud-connector-v2-20260724
    paths:
      - 'api/homeserver/**'
      - 'scripts/validate_homeserver_pairing_sync_v1.php'
      - '.github/workflows/connector-lint-capture.yml'

permissions:
  contents: write

concurrency:
  group: connector-php-lint-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-cloud-connector-v2-20260724
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, pdo, sodium
          coverage: none

      - name: Capture exact lint output
        shell: bash
        run: |
          mkdir -p .diagnostics
          : > .diagnostics/homeserver-php-lint.txt
          set +e
          for file in api/homeserver/*.php scripts/validate_homeserver_pairing_sync_v1.php config/migrations.php; do
            echo "### ${file}" >> .diagnostics/homeserver-php-lint.txt
            php -l "$file" >> .diagnostics/homeserver-php-lint.txt 2>&1
            echo >> .diagnostics/homeserver-php-lint.txt
          done
          set -e

      - name: Commit lint diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/homeserver-php-lint.txt
          if git diff --cached --quiet; then
            echo "Lint diagnostic is unchanged."
            exit 0
          fi
          git commit -m "Capture connector PHP lint diagnostic"
          git push origin HEAD:feature/homeserver-cloud-connector-v2-20260724
