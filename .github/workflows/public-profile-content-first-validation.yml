name: Public Profile Content First Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'profile.php'
      - 'api/public/profile.php'
      - 'assets/css/public-profile-content-first.css'
      - 'assets/js/public-profile-investment.js'
      - 'scripts/validate_public_profile_content_first.php'
      - 'tests/phpunit/PublicProfileContentFirstContractTest.php'
      - '.github/workflows/public-profile-content-first-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l profile.php
          php -l api/public/profile.php
          php -l scripts/validate_public_profile_content_first.php
          php -l tests/phpunit/PublicProfileContentFirstContractTest.php

      - name: JavaScript syntax
        run: node --check assets/js/public-profile-investment.js

      - name: Content-first profile contract
        run: php scripts/validate_public_profile_content_first.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/PublicProfileContentFirstContractTest.php tests/phpunit/PublicProfileUiFoundationTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi