name: Quest Media and Promotional Assets Validation

on:
  pull_request:
    paths:
      - 'merchant-loyalty-quest-creative.php'
      - 'includes/merchant-loyalty-quest-creative-view.php'
      - 'includes/merchant-workspace.php'
      - 'includes/merchant-view.php'
      - 'assets/css/loyalty-quest-creative-studio.css'
      - 'assets/js/loyalty-quest-creative-studio.js'
      - 'assets/js/loyalty-quest-embed.js'
      - 'api/merchant/loyalty-quest-creative.php'
      - 'api/merchant/loyalty-quest-qr.php'
      - 'api/merchant/campaign-media-image-upload.php'
      - 'api/public/loyalty-quest/embed.php'
      - 'includes/design-studio-renderer.php'
      - 'scripts/validate_quest_media_promotional_assets_v1.php'
      - '.github/workflows/quest-media-promotional-assets-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Quest Media and Promotional Assets (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l merchant-loyalty-quest-creative.php
          php -l includes/merchant-loyalty-quest-creative-view.php
          php -l includes/merchant-workspace.php
          php -l includes/merchant-view.php
          php -l api/merchant/loyalty-quest-creative.php
          php -l api/merchant/loyalty-quest-qr.php
          php -l api/merchant/campaign-media-image-upload.php
          php -l api/public/loyalty-quest/embed.php
          php -l includes/design-studio-renderer.php
          php -l scripts/validate_quest_media_promotional_assets_v1.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/loyalty-quest-creative-studio.js
          node --check assets/js/loyalty-quest-embed.js
      - name: Quest Media 10/10 contract
        run: php scripts/validate_quest_media_promotional_assets_v1.php
      - name: Loyalty Quest campaign regression
        run: php scripts/validate_loyalty_quest_campaign_type_v1.php
      - name: Participant quest regression
        run: php scripts/validate_participant_quest_experience_v1.php
      - name: Public marketplace regression
        run: php scripts/validate_public_loyalty_quest_marketplace_v1.php
