name: Task Agent Phase 3.1 Discovery Shortlist v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'agent.php'
      - 'api/agents/runtime.php'
      - 'includes/multi-agent-runtime.php'
      - 'includes/task-agent-ai-synthesis.php'
      - 'includes/task-agent-shortlist.php'
      - 'includes/task-agent-shortlist-router.php'
      - 'assets/js/multi-agent-runtime.js'
      - 'assets/js/task-agent-shortlist-runtime.js'
      - 'assets/css/task-agent-shortlist-v1.css'
      - 'database/20260720_task_agent_phase3_shortlist_v1.sql'
      - 'tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php'
      - 'tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php'
      - 'tests/phpunit/TaskAgentContextUpcomingEventsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentMemoryPermissionSafeRetrievalV1ContractTest.php'
      - 'tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php'
      - '.github/workflows/task-agent-phase3-1-discovery-shortlist-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l agent.php
          php -l api/agents/runtime.php
          php -l includes/multi-agent-runtime.php
          php -l includes/task-agent-ai-synthesis.php
          php -l includes/task-agent-shortlist.php
          php -l includes/task-agent-shortlist-router.php
          php -l tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php
          php -l tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
          php -l tests/phpunit/TaskAgentContextUpcomingEventsV1ContractTest.php
          php -l tests/phpunit/TaskAgentMemoryPermissionSafeRetrievalV1ContractTest.php
          php -l tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
          php -l tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/multi-agent-runtime.js
          node --check assets/js/task-agent-shortlist-runtime.js
      - name: Phase 3.1 contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php
      - name: Existing agent regressions
        run: |
          vendor/bin/phpunit tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/TaskAgentContextUpcomingEventsV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/TaskAgentMemoryPermissionSafeRetrievalV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
