name: Creator Campaign Merchant Builder v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-campaign-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy: {fail-fast: false, matrix: {php: ['8.2','8.3']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/definitions.php
          php -l includes/creator-campaigns/bootstrap.php
          php -l includes/creator-campaigns/builder-service.php
          find includes/creator-campaigns -maxdepth 1 -type f -name 'builder-*.php' -print0 | xargs -0 -n1 php -l
          php -l includes/creator-campaigns/status-service.php
          php -l api/merchant/creator-campaigns.php
          php -l merchant-creator-campaigns.php
          php -l merchant-creator-campaign-builder.php
          php -l includes/merchant-creator-campaigns-view.php
          php -l includes/merchant-creator-campaign-builder-view.php
          php -l includes/merchant-navigation.php
          php -l includes/merchant-view.php
          php -l scripts/validate_creator_campaign_merchant_builder_v2.php
          php -l scripts/validate_creator_campaign_merchant_builder_v2_mysql.php
          php -l tests/phpunit/CreatorCampaignMerchantBuilderV2ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-creator-campaigns.js
          node --check assets/js/merchant-creator-campaign-builder.js
      - name: Scored Phase 2 validation
        run: php scripts/validate_creator_campaign_merchant_builder_v2.php
      - name: PHPUnit contract
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignMerchantBuilderV2ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php

  mysql-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: creator-campaign-builder-v2-validation
      MG_PAYMENT_PROVIDER: stripe
      MG_PAYMENT_MODE: test
      MG_STRIPE_TEST_STUB: '1'
      MG_STRIPE_STUB_ACCOUNT_ACTIVE: '1'
      MG_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_creator_campaign_builder
      MG_STRIPE_SECRET_KEY_TEST: sk_test_creator_campaign_builder
      MG_STRIPE_WEBHOOK_SECRET_TEST: whsec_creator_campaign_builder
      MG_MEDIA_STORAGE_DRIVER: persistent_local
      MG_MEDIA_STORAGE_ROOT: /tmp/microgifter-creator-campaign-builder-storage
      MG_MEDIA_PUBLIC_ENDPOINT: /api/public/media.php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0
            sleep 1
          done
          exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Verify Phase 2 schema contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='microgifter' AND table_name='creator_campaign_application_questions';")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='microgifter' AND table_name='creator_campaigns' AND column_name IN ('campaign_focus','campaign_manager_user_id','featured_reward_template_id','creator_product_access','creator_landing_url','maximum_approved_creators','maximum_applications','automatic_acceptance','existing_creator_preference','builder_step','builder_completed_steps_json','builder_validation_json','builder_version');")" = "13"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='microgifter' AND table_name='creator_campaigns' AND column_name='commission_basis';")" = "0"
          mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT column_type FROM information_schema.columns WHERE table_schema='microgifter' AND table_name='creator_campaigns' AND column_name='access_mode';" | grep -q "approved_creators"
      - name: Execute clean-database builder lifecycle
        run: php scripts/validate_creator_campaign_merchant_builder_v2_mysql.php
