name: HomeServer Cloud Connector v2

on:
  pull_request:
    paths:
      - 'api/homeserver/**'
      - 'api/admin/homeserver-releases.php'
      - 'admin/homeserver-releases.php'
      - 'includes/homeserver-releases.php'
      - 'account-homeserver.php'
      - 'account.php'
      - 'includes/account/homeserver-view.php'
      - 'assets/js/homeserver-account.js'
      - 'assets/js/homeserver-status-indicator.js'
      - 'assets/js/admin-homeserver-releases.js'
      - 'assets/css/homeserver-account.css'
      - 'assets/css/homeserver-status-indicator.css'
      - 'assets/css/admin-homeserver-releases.css'
      - 'database/20260724_homeserver_cloud_pairing_sync_v1.sql'
      - 'database/20260727_homeserver_release_distribution_v1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_homeserver_pairing_sync_v1.php'
      - 'scripts/preflight.sh'
      - 'tests/phpunit/HomeServerReleaseDistributionContractTest.php'
      - 'composer.json'
      - '.github/workflows/homeserver-cloud-connector-v2.yml'
  push:
    branches:
      - 'feature/homeserver-cloud-connector-v2-20260724'
      - 'feature/homeserver-release-downloads-v1-20260727'
    paths:
      - 'api/homeserver/**'
      - 'api/admin/homeserver-releases.php'
      - 'admin/homeserver-releases.php'
      - 'includes/homeserver-releases.php'
      - 'account-homeserver.php'
      - 'account.php'
      - 'includes/account/homeserver-view.php'
      - 'assets/js/homeserver-account.js'
      - 'assets/js/homeserver-status-indicator.js'
      - 'assets/js/admin-homeserver-releases.js'
      - 'assets/css/homeserver-account.css'
      - 'assets/css/homeserver-status-indicator.css'
      - 'assets/css/admin-homeserver-releases.css'
      - 'database/20260724_homeserver_cloud_pairing_sync_v1.sql'
      - 'database/20260727_homeserver_release_distribution_v1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_homeserver_pairing_sync_v1.php'
      - 'scripts/preflight.sh'
      - 'tests/phpunit/HomeServerReleaseDistributionContractTest.php'
      - 'composer.json'
      - '.github/workflows/homeserver-cloud-connector-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeserver-cloud-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, pdo, sodium
          coverage: none

      - name: Validate Composer metadata and dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          composer install --no-interaction --prefer-dist --no-progress

      - name: Lint HomeServer PHP surface
        shell: bash
        run: |
          set +e
          {
            find api/homeserver -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            php -l api/admin/homeserver-releases.php
            php -l admin/homeserver-releases.php
            php -l includes/homeserver-releases.php
            php -l account-homeserver.php
            php -l account.php
            php -l includes/account/homeserver-view.php
            php -l config/migrations.php
            php -l scripts/validate_homeserver_pairing_sync_v1.php
            php -l tests/phpunit/HomeServerReleaseDistributionContractTest.php
          } > homeserver-php-lint.log 2>&1
          lint_code=$?
          cat homeserver-php-lint.log
          exit "$lint_code"

      - name: Upload HomeServer PHP lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeserver-php-lint
          path: homeserver-php-lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate HomeServer JavaScript
        run: |
          node --check assets/js/homeserver-account.js
          node --check assets/js/homeserver-status-indicator.js
          node --check assets/js/admin-homeserver-releases.js

      - name: Validate HomeServer protocol
        run: php scripts/validate_homeserver_pairing_sync_v1.php

      - name: Validate canonical migration manifest
        run: php scripts/validate_migration_manifest.php

      - name: Build canonical full upgrade SQL
        run: |
          mkdir -p build
          php scripts/build_full_upgrade_sql.php build/microgifter_full_upgrade.sql
          test -s build/microgifter_full_upgrade.sql
          grep -q 'CREATE TABLE IF NOT EXISTS homeserver_devices' build/microgifter_full_upgrade.sql
          grep -q 'CREATE TABLE IF NOT EXISTS homeserver_releases' build/microgifter_full_upgrade.sql

      - name: Run scoped branch preflight
        shell: bash
        run: |
          set +e
          bash scripts/preflight.sh "${{ github.event.pull_request.base.sha || 'origin/integration-from-repair-20260628' }}" > homeserver-preflight.log 2>&1
          preflight_code=$?
          cat homeserver-preflight.log
          exit "$preflight_code"

      - name: Upload HomeServer preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeserver-preflight
          path: homeserver-preflight.log
          if-no-files-found: error
          retention-days: 7
