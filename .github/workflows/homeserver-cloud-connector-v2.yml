name: HomeServer Cloud Connector v2

on:
  pull_request:
    paths:
      - 'api/homeserver/**'
      - 'database/20260724_homeserver_cloud_pairing_sync_v1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_homeserver_pairing_sync_v1.php'
      - 'scripts/preflight.sh'
      - 'composer.json'
      - '.github/workflows/homeserver-cloud-connector-v2.yml'
  push:
    branches:
      - 'feature/homeserver-cloud-connector-v2-20260724'
    paths:
      - 'api/homeserver/**'
      - 'database/20260724_homeserver_cloud_pairing_sync_v1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_homeserver_pairing_sync_v1.php'
      - 'scripts/preflight.sh'
      - 'composer.json'
      - '.github/workflows/homeserver-cloud-connector-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: homeserver-cloud-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, pdo, sodium
          coverage: none

      - name: Validate Composer metadata and dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          composer install --no-interaction --prefer-dist --no-progress

      - name: Lint HomeServer PHP surface
        id: connector_lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            find api/homeserver -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            php -l config/migrations.php
            php -l scripts/validate_homeserver_pairing_sync_v1.php
          } > homeserver-php-lint.log 2>&1
          lint_code=$?
          cat homeserver-php-lint.log
          exit "$lint_code"

      - name: Upload HomeServer PHP lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeserver-php-lint
          path: homeserver-php-lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish connector lint failure
        if: github.event_name == 'pull_request' && steps.connector_lint.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tail -c 6000 homeserver-php-lint.log > homeserver-php-lint-tail.log
          {
            echo '## HomeServer connector PHP lint failure'
            echo
            echo '```text'
            cat homeserver-php-lint-tail.log
            echo '```'
          } > homeserver-php-lint-comment.md
          jq -Rs '{body: .}' homeserver-php-lint-comment.md > homeserver-php-lint-comment.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @homeserver-php-lint-comment.json

      - name: Enforce HomeServer PHP lint
        if: steps.connector_lint.outcome == 'failure'
        run: exit 1

      - name: Validate HomeServer protocol
        run: php scripts/validate_homeserver_pairing_sync_v1.php

      - name: Validate canonical migration manifest
        run: php scripts/validate_migration_manifest.php

      - name: Build canonical full upgrade SQL
        run: |
          mkdir -p build
          php scripts/build_full_upgrade_sql.php build/microgifter_full_upgrade.sql
          test -s build/microgifter_full_upgrade.sql
          grep -q 'CREATE TABLE IF NOT EXISTS homeserver_devices' build/microgifter_full_upgrade.sql

      - name: Run scoped branch preflight
        run: bash scripts/preflight.sh "${{ github.event.pull_request.base.sha || 'origin/integration-from-repair-20260628' }}"
