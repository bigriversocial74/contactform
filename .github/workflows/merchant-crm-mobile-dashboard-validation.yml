name: Merchant CRM Mobile Dashboard

on:
  pull_request:
    paths:
      - 'merchant-crm.php'
      - 'includes/merchant-crm-view.php'
      - 'assets/css/merchant-crm-mobile-dashboard.css'
      - 'assets/css/merchant-crm-mobile-dashboard-contract.css'
      - 'assets/js/merchant-crm-mobile-dashboard.js'
      - 'assets/js/merchant-crm-directory.js'
      - 'assets/js/merchant-crm-identity-duplicates.js'
      - 'scripts/validate_merchant_crm_mobile_dashboard.php'
      - '.github/workflows/merchant-crm-mobile-dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l merchant-crm.php
          php -l includes/merchant-crm-view.php
          php -l scripts/validate_merchant_crm_mobile_dashboard.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-crm-mobile-dashboard.js
          node --check assets/js/merchant-crm-directory.js
          node --check assets/js/merchant-crm-identity-duplicates.js
      - name: Contract validation
        run: php scripts/validate_merchant_crm_mobile_dashboard.php
