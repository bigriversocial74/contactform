name: Public Campaign Compact Layout v2 Validation

on:
  pull_request:
    paths:
      - 'instant-win.php'
      - 'check-in-reward.php'
      - 'survey-feedback.php'
      - 'rsvp-event.php'
      - 'contest.php'
      - 'qr-reward.php'
      - 'agent-offer.php'
      - 'birthday-vip.php'
      - 'referral-reward.php'
      - 'newsletter-signup.php'
      - 'includes/public-campaign-page.php'
      - 'includes/campaign-landing-foundation.php'
      - 'assets/css/public-campaign-compact-layout-v2.css'
      - 'scripts/validate_public_campaign_compact_layout_v2.php'
      - '.github/workflows/public-campaign-compact-layout-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l instant-win.php
          php -l check-in-reward.php
          php -l survey-feedback.php
          php -l rsvp-event.php
          php -l contest.php
          php -l qr-reward.php
          php -l agent-offer.php
          php -l birthday-vip.php
          php -l referral-reward.php
          php -l newsletter-signup.php
          php -l scripts/validate_public_campaign_compact_layout_v2.php
      - name: Compact layout contract
        run: php scripts/validate_public_campaign_compact_layout_v2.php
