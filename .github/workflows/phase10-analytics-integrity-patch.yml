name: Phase 10 analytics integrity patch
on:
  push:
    branches: [feature/creator-campaign-analytics-performance-v10-20260722]
    paths: ['.github/workflows/phase10-analytics-integrity-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-campaign-analytics-performance-v10-20260722
      - name: Harden participant and attribution scope
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('includes/creator-campaigns/analytics-query.php')
          source = path.read_text()

          if "$scope['participant_id'] !== null && $participantColumn !== null" not in source:
              pattern = re.compile(
                  r"    if \(\$scope\['participant_id'\] !== null\) \{\n"
                  r"\s+if \(\$participantColumn === null\) \{\n"
                  r"\s+\$where\[\] = '1=0';\n"
                  r"\s+\} else \{\n"
                  r"\s+\$where\[\] = \$participantColumn \. '=\?';\n"
                  r"\s+\$params\[\] = \(int\) \$scope\['participant_id'\];\n"
                  r"\s+\}\n"
                  r"\s+\}\n",
                  re.MULTILINE,
              )
              replacement = (
                  "    if ($scope['participant_id'] !== null && $participantColumn !== null) {\n"
                  "        $where[] = $participantColumn . '=?';\n"
                  "        $params[] = (int) $scope['participant_id'];\n"
                  "    }\n"
              )
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit('Participant scope block was not found exactly once.')

          source = source.replace(
              '$where = ["a.status IN (\'attributed\',\'overridden\')"];',
              '$where = ["a.status IN (\'attributed\',\'overridden\')", "e.status=\'accepted\'"];',
              1,
          )
          source = source.replace(
              '$attributionWhere = ["a.status IN (\'attributed\',\'overridden\')"];',
              '$attributionWhere = ["a.status IN (\'attributed\',\'overridden\')", "e.status=\'accepted\'"];',
          )
          source = source.replace(
              'FROM creator_campaign_attributions a INNER JOIN creator_campaign_tracking_sources s ON s.id=a.source_id INNER JOIN creator_campaigns cc ON cc.id=a.campaign_id',
              'FROM creator_campaign_attributions a INNER JOIN creator_campaign_tracking_events e ON e.id=a.conversion_event_id INNER JOIN creator_campaign_tracking_sources s ON s.id=a.source_id INNER JOIN creator_campaigns cc ON cc.id=a.campaign_id',
              1,
          )
          source = source.replace(
              'FROM creator_campaign_attributions a INNER JOIN creator_campaigns cc ON cc.id=a.campaign_id',
              'FROM creator_campaign_attributions a INNER JOIN creator_campaign_tracking_events e ON e.id=a.conversion_event_id INNER JOIN creator_campaigns cc ON cc.id=a.campaign_id',
              1,
          )

          required = [
              "$scope['participant_id'] !== null && $participantColumn !== null",
              '"e.status=\'accepted\'"',
              'INNER JOIN creator_campaign_tracking_events e ON e.id=a.conversion_event_id',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Integrity patch incomplete: ' + ', '.join(missing))
          path.write_text(source)
          PY
      - name: Validate patched query
        run: php -l includes/creator-campaigns/analytics-query.php
      - name: Commit analytics integrity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/creator-campaigns/analytics-query.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden Phase 10 analytics integrity"
          git push origin HEAD:feature/creator-campaign-analytics-performance-v10-20260722
