name: Merchant Navigation Groups v1

on:
  pull_request:
    paths:
      - 'includes/merchant-navigation.php'
      - 'scripts/validate_merchant_navigation_groups_v1.php'
      - '.github/workflows/merchant-navigation-groups-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Merchant Navigation Groups (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/merchant-navigation.php
          php -l scripts/validate_merchant_navigation_groups_v1.php
      - name: Merchant navigation grouping contract
        run: php scripts/validate_merchant_navigation_groups_v1.php
