name: Homepage CRM Integrations v1

on:
  pull_request:
    paths:
      - 'index.php'
      - 'includes/landing/homepage-crm-integrations.php'
      - 'assets/css/homepage-crm-integrations-v1.css'
      - 'scripts/validate_homepage_crm_integrations_v1.php'
      - '.github/workflows/homepage-crm-integrations-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l index.php
          php -l includes/landing/homepage-crm-integrations.php
          php -l scripts/validate_homepage_crm_integrations_v1.php
      - name: Homepage CRM integrations contract
        run: php scripts/validate_homepage_crm_integrations_v1.php
