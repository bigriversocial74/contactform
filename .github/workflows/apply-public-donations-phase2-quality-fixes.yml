name: Apply Public Donations Phase 2 Quality Fixes

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'scripts/apply_public_donations_phase2_quality_fixes.php'
      - '.github/workflows/apply-public-donations-phase2-quality-fixes.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-donations-phase2-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-fixes:
    if: ${{ github.event.pull_request.head.ref == 'feature/public-donations-campaign-foundation-v1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-donations-campaign-foundation-v1
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply quality fixes
        run: php scripts/apply_public_donations_phase2_quality_fixes.php
      - name: Validate fixed source
        run: |
          php -l profile.php
          php -l includes/public-campaign-page.php
          php -l scripts/validate_public_donations_campaign_foundation_v1.php
          php -l tests/phpunit/PublicDonationsCampaignFoundationContractTest.php
          php scripts/validate_public_donations_campaign_foundation_v1.php
      - name: Stage validated artifact
        run: |
          mkdir -p /tmp/phase2-quality/includes /tmp/phase2-quality/scripts /tmp/phase2-quality/tests/phpunit /tmp/phase2-quality/.github/workflows
          cp profile.php /tmp/phase2-quality/profile.php
          cp includes/public-campaign-page.php /tmp/phase2-quality/includes/public-campaign-page.php
          cp scripts/validate_public_donations_campaign_foundation_v1.php /tmp/phase2-quality/scripts/validate_public_donations_campaign_foundation_v1.php
          cp tests/phpunit/PublicDonationsCampaignFoundationContractTest.php /tmp/phase2-quality/tests/phpunit/PublicDonationsCampaignFoundationContractTest.php
          cp .github/workflows/public-donations-campaign-foundation-v1.yml /tmp/phase2-quality/.github/workflows/public-donations-campaign-foundation-v1.yml
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-quality-files
          path: /tmp/phase2-quality
          if-no-files-found: error
          retention-days: 1
