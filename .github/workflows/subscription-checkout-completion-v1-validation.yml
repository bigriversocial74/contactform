name: Subscription Checkout Completion v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'account-subscriptions.php'
      - 'api/subscriptions/confirm-checkout.php'
      - 'api/subscriptions/history.php'
      - 'api/subscriptions/_stripe_webhook.php'
      - 'assets/js/subscription-checkout-completion-v1.js'
      - 'assets/css/subscription-checkout-completion-v1.css'
      - 'scripts/validate_subscription_checkout_completion_v1.php'
      - 'tests/phpunit/SubscriptionCheckoutCompletionV1ContractTest.php'
      - '.github/workflows/subscription-checkout-completion-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax — account page
        run: php -l account-subscriptions.php

      - name: Syntax — checkout confirmation
        run: php -l api/subscriptions/confirm-checkout.php

      - name: Syntax — billing history
        run: php -l api/subscriptions/history.php

      - name: Syntax — Stripe subscription webhook
        run: php -l api/subscriptions/_stripe_webhook.php

      - name: Syntax — validator
        run: php -l scripts/validate_subscription_checkout_completion_v1.php

      - name: Syntax — PHPUnit contract
        run: php -l tests/phpunit/SubscriptionCheckoutCompletionV1ContractTest.php

      - name: JavaScript syntax
        run: node --check assets/js/subscription-checkout-completion-v1.js

      - name: Subscription checkout completion contract
        run: php scripts/validate_subscription_checkout_completion_v1.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/SubscriptionCheckoutCompletionV1ContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi
