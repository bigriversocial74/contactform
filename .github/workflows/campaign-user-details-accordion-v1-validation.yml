name: Campaign User Details Accordion v1

on:
  pull_request:
    paths:
      - '.github/workflows/campaign-user-details-accordion-v1-validation.yml'
      - 'assets/css/campaign-landing-foundation.css'
      - 'assets/js/public-campaign.js'
      - 'assets/js/public-stamp-card.js'
      - 'check-in-reward.php'
      - 'includes/campaign-media-landing.php'
      - 'includes/campaign-user-details.php'
      - 'includes/public-campaign-page.php'
      - 'instant-win.php'
      - 'rsvp-event.php'
      - 'scripts/validate_campaign_user_details_accordion_v1.php'
      - 'stamp-card.php'
      - 'survey-feedback.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/campaign-user-details.php
          php -l includes/public-campaign-page.php
          php -l includes/campaign-media-landing.php
          php -l instant-win.php
          php -l stamp-card.php
          php -l survey-feedback.php
          php -l check-in-reward.php
          php -l rsvp-event.php
          php -l scripts/validate_campaign_user_details_accordion_v1.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/public-campaign.js
          node --check assets/js/public-stamp-card.js
      - name: Campaign accordion contract
        run: php scripts/validate_campaign_user_details_accordion_v1.php
