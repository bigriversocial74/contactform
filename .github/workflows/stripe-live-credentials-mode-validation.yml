name: Stripe Live Credentials Mode Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'admin-payments.php'
      - 'includes/admin-payment-credential-fields.php'
      - 'api/admin/payment-settings.php'
      - 'api/payments/_provider_credentials.php'
      - 'api/payments/_readiness.php'
      - 'assets/js/admin-payments.js'
      - 'assets/js/admin-payments-persistence.js'
      - 'assets/css/admin-payments-persistence.css'
      - 'tests/phpunit/StripeLiveCredentialModeContractTest.php'
      - 'scripts/validate_stripe_live_credentials_mode.php'
      - '.github/workflows/stripe-live-credentials-mode-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l admin-payments.php
          php -l includes/admin-payment-credential-fields.php
          php -l api/admin/payment-settings.php
          php -l api/payments/_provider_credentials.php
          php -l api/payments/_readiness.php
          php -l tests/phpunit/StripeLiveCredentialModeContractTest.php
          php -l scripts/validate_stripe_live_credentials_mode.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/admin-payments.js
          node --check assets/js/admin-payments-persistence.js

      - name: Stripe live credential mode contract
        run: php scripts/validate_stripe_live_credentials_mode.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/StripeLiveCredentialModeContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi
