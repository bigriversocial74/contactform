name: Merchant Canvas Production Containment v1 Validation

on:
  pull_request:
    paths:
      - 'merchant-canvas.php'
      - 'includes/footer.php'
      - 'assets/js/merchant-canvas-containment.js'
      - 'assets/css/merchant-canvas-containment.css'
      - 'api/merchant-canvas/auto-chat.php'
      - 'api/merchant-canvas/campaign-trigger.php'
      - 'api/merchant-canvas/campaign-trigger-automation.php'
      - 'api/merchant-canvas/send-reward.php'
      - 'scripts/validate_merchant_canvas_production_containment_v1.php'
      - '.github/workflows/merchant-canvas-production-containment-v1-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-canvas.php
          php -l includes/footer.php
          php -l api/merchant-canvas/auto-chat.php
          php -l api/merchant-canvas/campaign-trigger.php
          php -l api/merchant-canvas/campaign-trigger-automation.php
          php -l api/merchant-canvas/send-reward.php
          php -l scripts/validate_merchant_canvas_production_containment_v1.php

      - name: Containment validation
        run: php scripts/validate_merchant_canvas_production_containment_v1.php
