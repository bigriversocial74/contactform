name: Creator Affiliate Operations v16

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'api/merchant/creator-affiliate-operations.php'
      - 'assets/css/creator-affiliate-*.css'
      - 'assets/js/merchant-creator-affiliate-operations.js'
      - 'assets/js/creator-campaign-earnings.js'
      - 'assets/js/creator-campaign-payouts.js'
      - 'creator-campaign-earnings.php'
      - 'creator-campaign-payouts.php'
      - 'database/20260730_creator_affiliate_operations_experience_v16.sql'
      - 'docs/creator-campaigns/CREATOR_AFFILIATE_OPERATIONS_EXPERIENCE_V16.md'
      - 'docs/creator-campaigns/CREATOR_AFFILIATE_RECONCILIATION_RUNNER_V16.md'
      - 'includes/creator-campaigns/operations-service.php'
      - 'includes/creator-campaigns/operations-policy-query.php'
      - 'includes/creator-campaigns/operations-readiness-query.php'
      - 'includes/creator-campaigns/operations-monitor.php'
      - 'includes/creator-campaigns/payout-service.php'
      - 'includes/creator-campaigns/payout-query.php'
      - 'includes/creator-campaigns/compensation-query.php'
      - 'includes/creator-campaigns/bootstrap.php'
      - 'includes/merchant-creator-affiliate-operations-view.php'
      - 'includes/merchant-creator-campaign-payouts-view.php'
      - 'includes/creator-campaign-earnings-view.php'
      - 'includes/creator-campaign-payouts-view.php'
      - 'includes/merchant-navigation.php'
      - 'merchant-creator-affiliate-operations.php'
      - 'scripts/run_creator_affiliate_reconciliation_v16.php'
      - 'scripts/validate_creator_affiliate_operations_v16.php'
      - 'scripts/validate_creator_affiliate_operations_v16_mysql.php'
      - 'scripts/validate_merchant_navigation_groups_v1.php'
      - 'tests/phpunit/CreatorAffiliateOperationsV16ContractTest.php'
      - '.github/workflows/creator-affiliate-operations-v16.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-affiliate-operations-v16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2','8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/operations-service.php
          php -l includes/creator-campaigns/operations-policy-query.php
          php -l includes/creator-campaigns/operations-readiness-query.php
          php -l includes/creator-campaigns/operations-monitor.php
          php -l includes/creator-campaigns/payout-service.php
          php -l includes/creator-campaigns/payout-query.php
          php -l includes/creator-campaigns/compensation-query.php
          php -l includes/creator-campaigns/bootstrap.php
          php -l api/merchant/creator-affiliate-operations.php
          php -l merchant-creator-affiliate-operations.php
          php -l includes/merchant-creator-affiliate-operations-view.php
          php -l includes/merchant-creator-campaign-payouts-view.php
          php -l creator-campaign-earnings.php
          php -l creator-campaign-payouts.php
          php -l includes/creator-campaign-earnings-view.php
          php -l includes/creator-campaign-payouts-view.php
          php -l includes/merchant-navigation.php
          php -l scripts/run_creator_affiliate_reconciliation_v16.php
          php -l scripts/validate_creator_affiliate_operations_v16.php
          php -l scripts/validate_creator_affiliate_operations_v16_mysql.php
          php -l scripts/validate_merchant_navigation_groups_v1.php
          php -l tests/phpunit/CreatorAffiliateOperationsV16ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-creator-affiliate-operations.js
          node --check assets/js/creator-campaign-earnings.js
          node --check assets/js/creator-campaign-payouts.js
      - name: Creator affiliate operations score
        run: php scripts/validate_creator_affiliate_operations_v16.php
      - name: Merchant navigation contract
        run: php scripts/validate_merchant_navigation_groups_v1.php
      - name: Retained compensation, budget, and payout contracts
        run: |
          php scripts/validate_creator_campaign_compensation_v6.php
          php scripts/validate_creator_campaign_budgets_v7.php
          php scripts/validate_creator_campaign_payouts_v8.php
          php scripts/validate_creator_campaign_affiliate_commerce_bridge_v1.php
      - name: Creator affiliate operations PHPUnit
        run: vendor/bin/phpunit tests/phpunit --filter CreatorAffiliateOperationsV16ContractTest
      - name: Retained Creator Campaign finance PHPUnit
        run: vendor/bin/phpunit tests/phpunit --filter 'CreatorCampaign(Compensation|Budget|Payout|AffiliateCommerce)'
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Repository production quality
        run: composer audit-repository-quality

  mysql-lifecycle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Apply Creator Campaign finance and operations chain
        run: |
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_compensation_earnings_v6_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_budget_controls_v7_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_payouts_disputes_v8_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_messaging_notifications_v9_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_crm_lifecycle_v12_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_read_scopes_v13a_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_draft_scopes_v13b_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_canonical_actions_v13c_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_production_pilot_v14_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260723_creator_campaign_pilot_launch_onboarding_v15_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260723_creator_campaign_phases_1_15_production_audit_repair_v1.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260730_creator_affiliate_operations_experience_v16.sql
      - name: Verify operations schema and boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('creator_campaign_payout_policies','creator_campaign_reconciliation_cases');")" = "2"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260730_creator_affiliate_operations_experience_v16';")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='creator_campaign_payout_policies' AND index_name='uq_cc_payout_policy_workspace_currency' AND non_unique=0;")" = "2"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='creator_campaign_reconciliation_cases' AND index_name='uq_cc_reconciliation_fingerprint' AND non_unique=0;")" = "2"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND constraint_name IN ('fk_cc_payout_policy_workspace','fk_cc_reconciliation_workspace');")" = "2"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.check_constraints WHERE constraint_schema=DATABASE() AND constraint_name='chk_cc_payout_policy_manual' AND check_clause LIKE '%manual_approval_required%1%';")" = "1"
      - name: Verify v16 MySQL runtime queries
        run: php scripts/validate_creator_affiliate_operations_v16_mysql.php
      - name: Run unattended reconciliation monitor
        run: php scripts/run_creator_affiliate_reconciliation_v16.php
      - name: Verify v16 re-import idempotency
        run: |
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260730_creator_affiliate_operations_experience_v16.sql
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260730_creator_affiliate_operations_experience_v16';")" = "1"
