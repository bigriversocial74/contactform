name: Homepage SaaS v1

on:
  pull_request:
    paths:
      - 'index.php'
      - 'assets/css/homepage-saas-*.css'
      - 'assets/images/home/microgifter-home-*.svg'
      - 'tests/phpunit/HomepageSaasV1ContractTest.php'
      - '.github/workflows/homepage-saas-v1.yml'
  push:
    branches:
      - 'feature/homepage-saas-redesign-v1-20260728'
    paths:
      - 'index.php'
      - 'assets/css/homepage-saas-*.css'
      - 'assets/images/home/microgifter-home-*.svg'
      - 'tests/phpunit/HomepageSaasV1ContractTest.php'
      - '.github/workflows/homepage-saas-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-saas-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: PHP ${{ matrix.php }} and homepage contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint homepage PHP
        run: |
          php -l index.php
          php -l tests/phpunit/HomepageSaasV1ContractTest.php

      - name: Run homepage contract test
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/phpunit/HomepageSaasV1ContractTest.php

      - name: Validate artwork and stylesheet bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          for asset in [
              root / 'assets/images/home/microgifter-home-desktop-dashboard.svg',
              root / 'assets/images/home/microgifter-home-phone.svg',
          ]:
              ET.parse(asset)

          bundle = (root / 'assets/css/homepage-saas-v1.css').read_text()
          for filename in [
              'homepage-saas-core-v1.css',
              'homepage-saas-visuals-v1.css',
              'homepage-saas-sections-v1.css',
              'homepage-saas-responsive-v1.css',
              'homepage-saas-blue-v1.css',
          ]:
              assert filename in bundle, filename
              assert (root / 'assets/css' / filename).is_file(), filename
          PY

      - name: Build homepage deploy ZIP
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          package='build/homepage-deploy'
          rm -rf "$package"
          mkdir -p "$package/assets/css" "$package/assets/images/home"
          cp index.php "$package/index.php"
          cp assets/css/homepage-saas-v1.css "$package/assets/css/"
          cp assets/css/homepage-saas-core-v1.css "$package/assets/css/"
          cp assets/css/homepage-saas-visuals-v1.css "$package/assets/css/"
          cp assets/css/homepage-saas-sections-v1.css "$package/assets/css/"
          cp assets/css/homepage-saas-responsive-v1.css "$package/assets/css/"
          cp assets/css/homepage-saas-blue-v1.css "$package/assets/css/"
          cp assets/images/home/microgifter-home-desktop-dashboard.svg "$package/assets/images/home/"
          cp assets/images/home/microgifter-home-phone.svg "$package/assets/images/home/"
          cat > "$package/DEPLOY-README.txt" <<EOF
          Microgifter Homepage SaaS Redesign v1.1
          Source branch: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          Source commit: $GITHUB_SHA
          Pull request: #1369

          Extract this ZIP into the Microgifter web root while preserving paths.
          Overwrite only the files included in this package.
          Do not replace config.php, api/config.local.php, storage/, uploads/, or other production-local data.
          SQL required: No.
          The universal header and footer are reused and are not included in this package.
          EOF
          (
            cd "$package"
            zip -qr ../microgifter-homepage-pr1369-deploy.zip .
          )
          unzip -l build/microgifter-homepage-pr1369-deploy.zip
          sha256sum build/microgifter-homepage-pr1369-deploy.zip

      - name: Upload homepage deploy ZIP
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microgifter-homepage-pr1369-deploy
          path: build/microgifter-homepage-pr1369-deploy.zip
          if-no-files-found: error
          retention-days: 30
