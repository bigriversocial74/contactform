name: MCP Automation Grants Phase 4A
on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'includes/mcp-automations.php'
      - 'includes/mcp-automations/**'
      - 'account-agent-automations.php'
      - 'config/mcp_automation_grants_phase4a_release.php'
      - 'database/20260720_microgifter_mcp_automation_foundation_v1.sql'
      - 'scripts/validate_mcp_automation_grants_phase4a.php'
      - 'tests/phpunit/McpAutomationGrantsPhase4aV1ContractTest.php'
      - 'tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php'
      - 'tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php'
      - 'tests/phpunit/McpNativeDraftStatusPhase3cV1ContractTest.php'
      - '.github/workflows/mcp-automation-grants-phase4a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase4a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: phase4a-ci-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax and Phase 4A contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/mcp-automations.php
          find includes/mcp-automations -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l account-agent-automations.php
          php -l config/mcp_automation_grants_phase4a_release.php
          php -l scripts/validate_mcp_automation_grants_phase4a.php
          php -l tests/phpunit/McpAutomationGrantsPhase4aV1ContractTest.php
          php scripts/validate_mcp_automation_grants_phase4a.php
          vendor/bin/phpunit tests/phpunit/McpAutomationGrantsPhase4aV1ContractTest.php
      - name: Existing MCP schema and regressions
        shell: bash
        run: |
          set -euo pipefail
          php scripts/run_migrations.php
          vendor/bin/phpunit tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/McpNativeDraftStatusPhase3cV1ContractTest.php
      - run: composer audit-repository-quality
