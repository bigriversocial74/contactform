name: Campaign Feed Progress Cards v1 Validation

on:
  pull_request:
    paths:
      - 'api/public/_campaign_feed_v1.php'
      - 'api/public/campaign-feed.php'
      - 'assets/js/feed-campaign-progress-cards-v1.js'
      - 'assets/css/feed-campaign-progress-cards-v1.css'
      - 'feed.php'
      - 'newfeed.php'
      - 'scripts/validate_campaign_feed_progress_cards_v1.php'
      - '.github/workflows/campaign-feed-progress-cards-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l api/public/_campaign_feed_v1.php
          php -l api/public/campaign-feed.php
          php -l feed.php
          php -l newfeed.php
          php -l scripts/validate_campaign_feed_progress_cards_v1.php
      - name: JavaScript syntax
        run: node --check assets/js/feed-campaign-progress-cards-v1.js
      - name: Campaign feed contract
        run: php scripts/validate_campaign_feed_progress_cards_v1.php
