name: Hosted Games Program Integration

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'admin/hosted-games.php'
      - 'merchant-games.php'
      - 'includes/merchant-hosted-games-view.php'
      - 'includes/hosted-game-program-integration.php'
      - 'api/admin/hosted-game-integration.php'
      - 'api/merchant/hosted-game-integration.php'
      - 'assets/js/admin-hosted-games-program-only.js'
      - 'assets/js/merchant-hosted-games-program-only.js'
      - 'scripts/validate_hosted_games_program_integration.php'
      - '.github/workflows/hosted-games-program-integration.yml'
  push:
    branches:
      - 'deploy/contactform-*'
    paths:
      - 'admin/hosted-games.php'
      - 'merchant-games.php'
      - 'includes/merchant-hosted-games-view.php'
      - 'includes/hosted-game-program-integration.php'
      - 'api/admin/hosted-game-integration.php'
      - 'api/merchant/hosted-game-integration.php'
      - 'assets/js/admin-hosted-games-program-only.js'
      - 'assets/js/merchant-hosted-games-program-only.js'
      - 'scripts/validate_hosted_games_program_integration.php'
      - '.github/workflows/hosted-games-program-integration.yml'

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l admin/hosted-games.php
          php -l merchant-games.php
          php -l includes/merchant-hosted-games-view.php
          php -l includes/hosted-game-program-integration.php
          php -l api/admin/hosted-game-integration.php
          php -l api/merchant/hosted-game-integration.php
          php -l scripts/validate_hosted_games_program_integration.php
      - name: Contract validation
        run: php scripts/validate_hosted_games_program_integration.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin-hosted-games-program-only.js
          node --check assets/js/merchant-hosted-games-program-only.js
