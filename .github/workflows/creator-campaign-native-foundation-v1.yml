name: Creator Campaign Native Foundation v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-campaign-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns.php
          find includes/creator-campaigns -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l scripts/validate_creator_campaign_native_foundation_v1.php
          php -l tests/phpunit/CreatorCampaignNativeFoundationV1ContractTest.php
      - name: Scored foundation validation
        run: php scripts/validate_creator_campaign_native_foundation_v1.php
      - name: PHPUnit contract
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignNativeFoundationV1ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php

  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_RUNTIME_PROFILE: local
      MG_CLAIM_CODE_PEPPER: creator-campaign-foundation-validation
      MG_PAYMENT_PROVIDER: stripe
      MG_PAYMENT_MODE: test
      MG_STRIPE_TEST_STUB: '1'
      MG_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_creator_campaign
      MG_STRIPE_SECRET_KEY_TEST: sk_test_creator_campaign
      MG_STRIPE_WEBHOOK_SECRET_TEST: whsec_creator_campaign
      MG_MEDIA_STORAGE_DRIVER: persistent_local
      MG_MEDIA_STORAGE_ROOT: /tmp/microgifter-creator-campaign-storage
      MG_MEDIA_PUBLIC_ENDPOINT: /api/public/media.php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0
            sleep 1
          done
          exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Verify creator campaign schema
        shell: bash
        run: |
          set -euo pipefail
          TABLE_COUNT="$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "
            SELECT COUNT(*)
            FROM information_schema.tables
            WHERE table_schema='microgifter'
              AND table_name IN ('creator_campaigns','creator_campaign_products','creator_campaign_eligibility_rules','creator_campaign_status_events');
          ")"
          test "${TABLE_COUNT}" = "4"
          PERMISSION_COUNT="$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "
            SELECT COUNT(*)
            FROM permissions
            WHERE slug IN ('merchant.creator_campaigns.view','merchant.creator_campaigns.manage','merchant.creator_campaigns.publish','merchant.creator_directory.view');
          ")"
          test "${PERMISSION_COUNT}" = "4"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "
            SELECT COUNT(*) FROM information_schema.statistics
            WHERE table_schema='microgifter' AND table_name='creator_campaigns'
              AND index_name='uq_creator_campaign_workspace_idempotency';
          " )" -ge "1"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema='microgifter' AND table_name='creator_campaigns'
              AND column_name='lock_version';
          " )" = "1"
