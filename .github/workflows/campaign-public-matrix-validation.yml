name: Campaign Public Matrix v1 Validation

on:
  pull_request:
    paths:
      - 'includes/campaign-types.php'
      - 'includes/campaign-landing-foundation.php'
      - 'includes/public-campaign-page.php'
      - 'includes/campaign-media-landing.php'
      - 'newsletter-signup.php'
      - 'contest.php'
      - 'qr-reward.php'
      - 'referral-reward.php'
      - 'birthday-vip.php'
      - 'agent-offer.php'
      - 'survey-feedback.php'
      - 'check-in-reward.php'
      - 'instant-win.php'
      - 'stamp-card.php'
      - 'rsvp-event.php'
      - 'watch-reward.php'
      - 'listen-reward.php'
      - 'api/merchant/campaigns.php'
      - 'api/merchant/campaigns-core.php'
      - 'api/public/campaigns/signup.php'
      - 'api/public/campaigns/contest-entry.php'
      - 'api/public/campaigns/qr-pickup.php'
      - 'api/public/campaigns/engage.php'
      - 'api/public/campaigns/survey-feedback.php'
      - 'api/public/campaigns/check-in.php'
      - 'api/public/campaigns/instant-win.php'
      - 'api/public/campaigns/stamp-card.php'
      - 'api/public/campaigns/rsvp-event.php'
      - 'api/public/campaigns/watch-progress-v2.php'
      - 'api/public/campaigns/_media_progress_v2.php'
      - 'api/public/campaigns/listen-progress.php'
      - 'scripts/validate_campaign_public_matrix_v1.php'
      - '.github/workflows/campaign-public-matrix-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate 13 public campaign types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        run: |
          set -euo pipefail
          php -l includes/campaign-types.php
          php -l includes/campaign-landing-foundation.php
          php -l includes/public-campaign-page.php
          php -l includes/campaign-media-landing.php
          php -l newsletter-signup.php
          php -l contest.php
          php -l qr-reward.php
          php -l referral-reward.php
          php -l birthday-vip.php
          php -l agent-offer.php
          php -l survey-feedback.php
          php -l check-in-reward.php
          php -l instant-win.php
          php -l stamp-card.php
          php -l rsvp-event.php
          php -l watch-reward.php
          php -l listen-reward.php
          php -l api/merchant/campaigns.php
          php -l api/merchant/campaigns-core.php
          php -l api/public/campaigns/signup.php
          php -l api/public/campaigns/contest-entry.php
          php -l api/public/campaigns/qr-pickup.php
          php -l api/public/campaigns/engage.php
          php -l api/public/campaigns/survey-feedback.php
          php -l api/public/campaigns/check-in.php
          php -l api/public/campaigns/instant-win.php
          php -l api/public/campaigns/stamp-card.php
          php -l api/public/campaigns/rsvp-event.php
          php -l api/public/campaigns/watch-progress-v2.php
          php -l api/public/campaigns/_media_progress_v2.php
          php -l api/public/campaigns/listen-progress.php
          php -l scripts/validate_campaign_public_matrix_v1.php

      - name: Validate campaign public matrix
        id: campaign_matrix
        continue-on-error: true
        run: |
          mkdir -p build
          php scripts/validate_campaign_public_matrix_v1.php > build/campaign-public-matrix-output.txt 2>&1

      - name: Validate campaign landing foundation
        run: php scripts/validate_campaign_landing_foundation_repair_v1.php

      - name: Validate specialized landing migration
        run: php scripts/validate_campaign_specialized_foundation_v1.php

      - name: Validate interactive campaign alignment
        run: php scripts/validate_interactive_campaign_alignment_v1.php

      - name: Validate Watch and Listen media alignment
        run: php scripts/validate_watch_listen_media_alignment_v1.php

      - name: Upload campaign matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-public-matrix-v1
          path: |
            build/campaign-public-matrix-v1.md
            build/campaign-public-matrix-output.txt
          if-no-files-found: error

      - name: Enforce campaign matrix result
        if: always() && steps.campaign_matrix.outcome == 'failure'
        run: |
          cat build/campaign-public-matrix-output.txt
          exit 1
