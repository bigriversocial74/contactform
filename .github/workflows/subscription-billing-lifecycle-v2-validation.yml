name: Subscription Billing Lifecycle v2 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'account-subscriptions.php'
      - 'includes/account/subscription-authority.php'
      - 'api/payments/_stripe.php'
      - 'api/subscriptions/**'
      - 'assets/css/subscription-billing-v2.css'
      - 'assets/js/subscription-billing-v2.js'
      - 'assets/js/subscription-activation-status.js'
      - 'database/stage_18aj_subscription_billing_lifecycle_v2.sql'
      - 'scripts/validate_subscription_billing_lifecycle_v2.php'
      - 'scripts/validate_account_subscription_authority_v1.php'
      - '.github/workflows/subscription-billing-lifecycle-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax account subscription page
        run: php -l account-subscriptions.php
      - name: Syntax subscription authority
        run: php -l includes/account/subscription-authority.php
      - name: Syntax Stripe provider
        run: php -l api/payments/_stripe.php
      - name: Syntax package billing
        run: php -l api/subscriptions/_package_billing.php
      - name: Syntax billing lifecycle service
        run: php -l api/subscriptions/_billing_lifecycle_v2.php
      - name: Syntax checkout handoff
        run: php -l api/subscriptions/_checkout_handoff.php
      - name: Syntax lifecycle webhook
        run: php -l api/subscriptions/_package_webhook_v2.php
      - name: Syntax Stripe webhook dispatcher
        run: php -l api/subscriptions/_stripe_webhook.php
      - name: Syntax upgrade request
        run: php -l api/subscriptions/request-upgrade.php
      - name: Syntax billing portal
        run: php -l api/subscriptions/billing-portal.php
      - name: Syntax billing state
        run: php -l api/subscriptions/billing-state.php
      - name: Syntax subscription management
        run: php -l api/subscriptions/manage.php
      - name: Syntax package status
        run: php -l api/subscriptions/package-change-status.php
      - name: Syntax billing validation contract
        run: php -l scripts/validate_subscription_billing_lifecycle_v2.php
      - name: Syntax authority validation contract
        run: php -l scripts/validate_account_subscription_authority_v1.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/subscription-billing-v2.js
          node --check assets/js/subscription-activation-status.js

      - name: Subscription billing lifecycle contract
        run: php scripts/validate_subscription_billing_lifecycle_v2.php

      - name: Existing account subscription authority contract
        run: php scripts/validate_account_subscription_authority_v1.php

      - name: Existing production subscription behavior
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/ProductionSubscriptionBehaviorTest.php tests/phpunit/ProductionSubscriptionRecoveryBehaviorTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone billing lifecycle contracts completed.'
          fi
