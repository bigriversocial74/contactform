name: Public Donations Community Assignment Phase 3

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'includes/public-donations-community-assignments.php'
      - 'api/merchant/public-donations-community.php'
      - 'assets/js/public-donations-community-assignments.js'
      - 'assets/css/public-donations-community-assignments.css'
      - 'merchant-campaigns.php'
      - 'scripts/validate_public_donations_community_assignment_v1.php'
      - 'scripts/test_public_donations_community_assignment_mysql.php'
      - 'tests/phpunit/PublicDonationsCommunityAssignmentContractTest.php'
      - 'database/20260724_public_donations_community_v1_single_install.sql'
      - '.github/workflows/public-donations-community-assignment-v1.yml'

permissions:
  contents: read

concurrency:
  group: public-donations-community-assignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: microgifter_phase3
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: microgifter_phase3
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: node --check assets/js/public-donations-community-assignments.js

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql,mbstring
          tools: phpunit
      - name: Validate PHP 8.2
        run: |
          php -l includes/public-donations-community-assignments.php
          php -l api/merchant/public-donations-community.php
          php -l merchant-campaigns.php
          php -l scripts/validate_public_donations_community_assignment_v1.php
          php -l scripts/test_public_donations_community_assignment_mysql.php
          php -l tests/phpunit/PublicDonationsCommunityAssignmentContractTest.php
          php scripts/validate_public_donations_community_assignment_v1.php
          phpunit tests/phpunit/PublicDonationsCommunityAssignmentContractTest.php
          php scripts/test_public_donations_community_assignment_mysql.php

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql,mbstring
          tools: phpunit
      - name: Validate PHP 8.3
        run: |
          php -l includes/public-donations-community-assignments.php
          php -l api/merchant/public-donations-community.php
          php -l merchant-campaigns.php
          php -l scripts/validate_public_donations_community_assignment_v1.php
          php -l scripts/test_public_donations_community_assignment_mysql.php
          php -l tests/phpunit/PublicDonationsCommunityAssignmentContractTest.php
          php scripts/validate_public_donations_community_assignment_v1.php
          phpunit tests/phpunit/PublicDonationsCommunityAssignmentContractTest.php
          php scripts/test_public_donations_community_assignment_mysql.php
