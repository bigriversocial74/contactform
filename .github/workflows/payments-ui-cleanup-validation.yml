name: Payments UI Cleanup Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-payments.php'
      - 'includes/merchant-payments-view.php'
      - 'assets/css/merchant-payments.css'
      - 'assets/js/merchant-payments.js'
      - 'api/merchant/payment-methods.php'
      - 'admin-payments.php'
      - 'assets/css/admin-payments.css'
      - 'assets/js/admin-payments.js'
      - 'tests/phpunit/PaymentsUiCleanupContractTest.php'
      - 'tests/phpunit/StageFStripeContractTest.php'
      - 'scripts/validate_payments_ui_cleanup.php'
      - '.github/workflows/payments-ui-cleanup-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-payments.php
          php -l includes/merchant-payments-view.php
          php -l api/merchant/payment-methods.php
          php -l admin-payments.php
          php -l tests/phpunit/PaymentsUiCleanupContractTest.php
          php -l tests/phpunit/StageFStripeContractTest.php
          php -l scripts/validate_payments_ui_cleanup.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-payments.js
          node --check assets/js/admin-payments.js

      - name: Payments UI cleanup contract
        run: php scripts/validate_payments_ui_cleanup.php

      - name: PHPUnit contracts when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/PaymentsUiCleanupContractTest.php tests/phpunit/StageFStripeContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi
