name: CRM Contact Identity Duplicate Management

on:
  pull_request:
    paths:
      - 'database/crm_contact_identity_duplicate_management_v1.sql'
      - 'config/migrations.php'
      - 'includes/merchant-crm-identity.php'
      - 'includes/merchant-crm.php'
      - 'api/merchant/crm-duplicates.php'
      - 'includes/merchant-crm-view.php'
      - 'merchant-crm.php'
      - 'merchant-customer.php'
      - 'assets/js/merchant-crm-identity-duplicates.js'
      - 'assets/css/merchant-crm-identity-duplicates.css'
      - 'scripts/validate_crm_contact_identity_duplicates_v1.php'
      - '.github/workflows/crm-contact-identity-duplicates-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/merchant-crm-identity.php
          php -l includes/merchant-crm.php
          php -l api/merchant/crm-duplicates.php
          php -l includes/merchant-crm-view.php
          php -l merchant-crm.php
          php -l merchant-customer.php
          php -l config/migrations.php
          php -l scripts/validate_crm_contact_identity_duplicates_v1.php
      - name: JavaScript syntax
        run: node --check assets/js/merchant-crm-identity-duplicates.js
      - name: Contract validation
        run: php scripts/validate_crm_contact_identity_duplicates_v1.php
