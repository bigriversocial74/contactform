name: Action Center Mutation Contract v1

on:
  pull_request:
    paths:
      - 'api/account/_action_center_mutation_contract.php'
      - 'api/account/action-center-mutation-state.php'
      - 'api/account/action-center-read.php'
      - 'api/account/action-center-unread.php'
      - 'api/account/action-center-archive.php'
      - 'api/account/action-center-restore.php'
      - 'assets/js/gift-action-center-actions.js'
      - 'assets/js/gift-action-center-regift-submit.js'
      - 'assets/js/gift-action-center-claim-modal.js'
      - 'includes/gift-action-center.php'
      - 'docs/action-center-mutation-contract-v1.md'
      - 'scripts/validate_action_center_mutation_contract_v1.php'
      - 'tests/phpunit/ActionCenterFrontendSubmitContractTest.php'
      - 'tests/phpunit/ActionCenterMutationContractV1Test.php'
      - '.github/workflows/action-center-mutation-contract-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l api/account/_action_center_mutation_contract.php
          php -l api/account/action-center-mutation-state.php
          php -l api/account/action-center-read.php
          php -l api/account/action-center-unread.php
          php -l api/account/action-center-archive.php
          php -l api/account/action-center-restore.php
          php -l includes/gift-action-center.php
          php -l scripts/validate_action_center_mutation_contract_v1.php
          php -l tests/phpunit/ActionCenterFrontendSubmitContractTest.php
          php -l tests/phpunit/ActionCenterMutationContractV1Test.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/gift-action-center-actions.js
          node --check assets/js/gift-action-center-regift-submit.js
          node --check assets/js/gift-action-center-claim-modal.js
          node --check assets/js/gift-action-center-runtime-v4.js
      - name: Mutation contract
        run: php scripts/validate_action_center_mutation_contract_v1.php
      - name: Focused PHPUnit contracts
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit \
              tests/phpunit/ActionCenterFrontendSubmitContractTest.php \
              tests/phpunit/ActionCenterMutationContractV1Test.php \
              tests/phpunit/Stage11CActionCenterStateMutationsTest.php \
              tests/phpunit/Stage11EActionCenterActionWiringTest.php \
              tests/phpunit/Stage12UniversalTipsTest.php \
              tests/phpunit/ClaimVoucherQrScannerContractTest.php
          else
            echo 'PHPUnit is unavailable; static mutation validation completed.'
          fi
