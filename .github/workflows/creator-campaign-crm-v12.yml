name: Creator Campaign CRM v12

on:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-crm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy: {fail-fast: false, matrix: {php: ['8.2','8.3']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/crm-definitions.php
          php -l includes/creator-campaigns/crm-repository.php
          php -l includes/creator-campaigns/crm-service.php
          php -l includes/creator-campaigns/crm-query.php
          php -l includes/creator-campaigns/bootstrap.php
          php -l includes/creator-campaigns/participation-repository.php
          php -l includes/creator-campaigns/tracking-service.php
          php -l includes/merchant-crm-creator-campaign-bridge.php
          php -l api/merchant/creator-campaign-crm.php
          php -l api/merchant/merchant-crm.php
          php -l merchant-creator-crm.php
          php -l merchant-crm.php
          php -l includes/merchant-creator-campaign-crm-view.php
          php -l includes/merchant-creator-campaigns-view.php
          php -l includes/merchant-creator-campaign-detail-view.php
          php -l scripts/validate_creator_campaign_crm_v12.php
          php -l scripts/validate_creator_campaign_crm_v12_mysql.php
          php -l tests/phpunit/CreatorCampaignCrmV12ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-creator-campaign-crm-v12.js
          node --check assets/js/merchant-crm-creator-campaign-bridge-v12.js
      - name: Phase 2 compatibility
        run: php scripts/validate_creator_campaign_merchant_builder_v2.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignMerchantBuilderV2ContractTest.php
      - name: Phase 3 compatibility
        run: php scripts/validate_creator_campaign_participation_v3.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignParticipationV3ContractTest.php
      - name: Phase 4 compatibility
        run: php scripts/validate_creator_campaign_deliverables_v4.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignDeliverablesV4ContractTest.php
      - name: Phase 5 compatibility
        run: php scripts/validate_creator_campaign_tracking_v5.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignTrackingV5ContractTest.php
      - name: Phase 6 compatibility
        run: php scripts/validate_creator_campaign_compensation_v6.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignCompensationV6ContractTest.php
      - name: Phase 7 compatibility
        run: php scripts/validate_creator_campaign_budgets_v7.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignBudgetsV7ContractTest.php
      - name: Phase 8 compatibility
        run: php scripts/validate_creator_campaign_payouts_v8.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignPayoutsV8ContractTest.php
      - name: Phase 9 compatibility
        run: php scripts/validate_creator_campaign_messaging_v9.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignMessagingV9ContractTest.php
      - name: Phase 10 compatibility
        run: php scripts/validate_creator_campaign_analytics_v10.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignAnalyticsV10ContractTest.php
      - name: Phase 11 compatibility
        run: php scripts/validate_creator_campaign_ui_v11.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignUiV11ContractTest.php
      - name: Phase 12 score
        run: php scripts/validate_creator_campaign_crm_v12.php
      - name: Phase 12 PHPUnit
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignCrmV12ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php

  mysql-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: creator-campaign-crm-v12
      MG_TRACKING_HASH_PEPPER: creator-campaign-crm-v12-tracking
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Verify Phase 3 clean compatibility
        run: php scripts/validate_creator_campaign_participation_v3_mysql.php
      - name: Verify Phase 4 clean compatibility
        run: php scripts/validate_creator_campaign_deliverables_v4_mysql.php
      - name: Verify Phase 5 clean compatibility
        run: php scripts/validate_creator_campaign_tracking_v5_mysql.php
      - name: Apply Phase 12 SQL
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_crm_lifecycle_v12_single_install.sql
      - name: Verify Phase 12 schema contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='microgifter' AND table_name IN ('merchant_crm_creator_campaign_events','merchant_crm_contact_creator_campaigns','merchant_crm_creator_campaign_projection_runs');")" = "3"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM permissions WHERE slug IN ('merchant.creator_crm.view','merchant.creator_crm.manage');")" = "2"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='microgifter' AND table_name='merchant_crm_creator_campaign_events' AND index_name='uq_merchant_crm_cc_event_source' AND non_unique=0;")" = "1"
      - name: Verify Phase 12 SQL idempotency
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_crm_lifecycle_v12_single_install.sql
      - name: Execute Phase 12 CRM lifecycle
        shell: bash
        run: |
          set +e
          php scripts/validate_creator_campaign_crm_v12_mysql.php > phase12-crm-lifecycle.log 2>&1
          status=$?
          cat phase12-crm-lifecycle.log
          exit $status
      - name: Upload Phase 12 lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-campaign-crm-v12-lifecycle
          path: phase12-crm-lifecycle.log
          if-no-files-found: error
          retention-days: 7
