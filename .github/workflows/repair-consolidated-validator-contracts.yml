name: Build Creator Compatibility Workflow Bundle

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - .github/workflows/repair-consolidated-validator-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-creator-compatibility-workflow-bundle
  cancel-in-progress: true

jobs:
  bundle:
    if: github.head_ref == 'ci/repair-consolidated-validator-contracts-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/repair-consolidated-validator-contracts-20260731
          fetch-depth: 0
      - name: Build manual-only compatibility workflows
        env:
          SOURCE_COMMIT: 4c772318b7b737199af2974816a62537b27de6a2
        run: |
          set -euo pipefail
          mkdir -p repair-bundle/.github/workflows
          files=(
            creator-campaign-analytics-v10.yml
            creator-campaign-budgets-v7.yml
            creator-campaign-compensation-v6.yml
            creator-campaign-crm-v12.yml
            creator-campaign-deliverables-v4.yml
            creator-campaign-mcp-bounded-playbooks-v13d.yml
            creator-campaign-mcp-canonical-v13c.yml
            creator-campaign-mcp-draft-v13b.yml
            creator-campaign-mcp-read-v13a.yml
            creator-campaign-merchant-builder-v2.yml
            creator-campaign-messaging-v9.yml
            creator-campaign-native-foundation-v1.yml
            creator-campaign-participation-v3.yml
            creator-campaign-payouts-v8.yml
            creator-campaign-production-pilot-v14.yml
            creator-campaign-tracking-v5.yml
            creator-campaign-ui-v11.yml
          )
          for name in "${files[@]}"; do
            git show "${SOURCE_COMMIT}:.github/workflows/${name}" > "repair-bundle/.github/workflows/${name}"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('repair-bundle/.github/workflows').glob('*.yml'):
              text = path.read_text()
              updated, count = re.subn(
                  r'(?ms)^on:\s*\n.*?(?=^(?:permissions|jobs):)',
                  'on:\n  workflow_dispatch:\n\n',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Unable to convert {path} to manual-only')
              path.write_text(updated)
          PY
          tar -czf creator-compatibility-workflows.tar.gz -C repair-bundle .
          find repair-bundle -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: creator-compatibility-workflows
          path: creator-compatibility-workflows.tar.gz
          if-no-files-found: error
          retention-days: 1
