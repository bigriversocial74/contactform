name: Creator Campaign Dropdown Navigation

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'includes/header-templates/logged-in.php'
      - 'tests/phpunit/CreatorCampaignDropdownNavigationContractTest.php'
      - '.github/workflows/creator-campaign-dropdown-navigation.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-dropdown-navigation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: 'json,mbstring,pdo,pdo_mysql'
          coverage: none
          tools: 'composer:v2'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/header-templates/logged-in.php
          php -l tests/phpunit/CreatorCampaignDropdownNavigationContractTest.php
      - name: Dropdown navigation contract
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignDropdownNavigationContractTest.php
      - name: Existing Creator Campaign UI compatibility
        run: |
          php scripts/validate_creator_campaign_ui_v11.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignUiV11ContractTest.php
      - name: Repository production quality
        run: composer audit-repository-quality
