name: Diagnose Public Donations Phase 5 PR Open

on:
  push:
    branches:
      - feature/public-donations-recall-controls-v1
    paths:
      - '.github/workflows/diagnose-open-public-donations-phase5-pr.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-donations-recall-controls-v1
          fetch-depth: 0
      - name: Open or resolve pull request
        run: |
          set +e
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feature/public-donations-recall-controls-v1 --base integration-from-repair-20260628 --state open --json number --jq '.[0].number // empty' 2>/tmp/phase5-pr-error.txt)"
          code=$?
          output=''
          if [ $code -eq 0 ] && [ -z "$existing" ]; then
            output="$(gh pr create --repo "$GITHUB_REPOSITORY" --base integration-from-repair-20260628 --head feature/public-donations-recall-controls-v1 --title 'Public Donations Phase 5 recall controls' --body 'Phase 5 recall controls are validated at 10/10. Full validation details will be applied to the PR body after creation. No additional SQL required; uses database/20260724_public_donations_community_v1_single_install.sql. Closes #1320.' 2>&1)"
            code=$?
            existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feature/public-donations-recall-controls-v1 --base integration-from-repair-20260628 --state open --json number --jq '.[0].number // empty' 2>>/tmp/phase5-pr-error.txt)"
          fi
          {
            echo "RESULT=$([ -n "$existing" ] && echo success || echo failure)"
            echo "PR_NUMBER=$existing"
            if [ -n "$existing" ]; then echo "PR_URL=https://github.com/$GITHUB_REPOSITORY/pull/$existing"; fi
            echo "COMMAND_EXIT=$code"
            echo "OUTPUT=$output"
            echo 'ERROR_LOG_BEGIN'
            cat /tmp/phase5-pr-error.txt 2>/dev/null || true
            echo 'ERROR_LOG_END'
          } > scripts/.public_donations_phase5_pr.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/.public_donations_phase5_pr.txt
          git commit -m "Record Phase 5 PR open result"
          git push origin HEAD:feature/public-donations-recall-controls-v1
          if [ -z "$existing" ]; then exit 1; fi
