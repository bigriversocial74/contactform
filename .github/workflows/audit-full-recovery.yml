name: Audit Full Recovery

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - .github/workflows/audit-full-recovery.yml
      - tests/phpunit/**
      - scripts/validate_identity_behavior.php
      - scripts/validate_auth_session_identity_hardening_v1.php
      - scripts/validate_personal_agent_contact_intelligence_v1.php
      - config/migrations.php
      - database/auth_session_identity_hardening_v1.sql
      - database/stage_18am_personal_agent_contact_intelligence_v1.sql
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-run:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717
          fetch-depth: 0
      - name: Record recovery run id
        run: |
          printf '%s\n' "${{ github.run_id }}" > .audit-full-recovery-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit-full-recovery-run-id
          git commit -m 'Record temporary full recovery run'
          git push origin HEAD:audit/repository-production-hardening-20260717

  recovery:
    needs: record-run
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    uses: ./.github/workflows/recovery-baseline.yml
