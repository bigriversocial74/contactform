name: True Multi-Agent Workspace v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'includes/agent-workspace.php'
      - 'includes/header-components/app-header.php'
      - 'includes/personal-agent-sidebar.php'
      - 'includes/multi-agent-workspace-data.php'
      - 'includes/personal-agent/multi-agent-workspace.php'
      - 'assets/js/multi-agent-workspace.js'
      - 'assets/css/multi-agent-workspace.css'
      - 'assets/css/multi-agent-workspace-state.css'
      - 'scripts/validate_personal_agent_runtime_nav.php'
      - 'tests/phpunit/TrueMultiAgentWorkspaceV1ContractTest.php'
      - 'tests/phpunit/AgentHeaderTabBehaviorTest.php'
      - 'tests/phpunit/MobileAgentTabsTest.php'
      - '.github/workflows/true-multi-agent-workspace-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l agent.php
          php -l includes/agent-workspace.php
          php -l includes/header-components/app-header.php
          php -l includes/personal-agent-sidebar.php
          php -l includes/multi-agent-workspace-data.php
          php -l includes/personal-agent/multi-agent-workspace.php
          php -l scripts/validate_personal_agent_runtime_nav.php
          php -l tests/phpunit/TrueMultiAgentWorkspaceV1ContractTest.php
          php -l tests/phpunit/AgentHeaderTabBehaviorTest.php
          php -l tests/phpunit/MobileAgentTabsTest.php
      - name: JavaScript syntax
        run: node --check assets/js/multi-agent-workspace.js
      - name: Capture runtime validator output
        run: php scripts/validate_personal_agent_runtime_nav.php > runtime-validator-${{ matrix.php }}.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-validator-${{ matrix.php }}
          path: runtime-validator-${{ matrix.php }}.txt
          if-no-files-found: error
      - name: Contract tests
        run: |
          vendor/bin/phpunit tests/phpunit/TrueMultiAgentWorkspaceV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/AgentHeaderTabBehaviorTest.php
          vendor/bin/phpunit tests/phpunit/MobileAgentTabsTest.php
