name: Hosted Game Standard v1

on:
  pull_request:
    paths:
      - 'includes/hosted-game-standard-v1.php'
      - 'includes/hosted-game-standard-core.php'
      - 'includes/hosted-game-standard-security.php'
      - 'includes/hosted-game-standard-upload.php'
      - 'api/hosted-games/document.php'
      - 'api/hosted-games/runtime.php'
      - 'api/admin/hosted-game-upload.php'
      - 'api/merchant/hosted-game-upload.php'
      - 'assets/js/hosted-game-shell.js'
      - 'assets/js/hosted-game-child-bridge.js'
      - 'hosted-game.php'
      - 'docs/hosted-game-standard-v1.md'
      - 'docs/hosted-games-package-guide.md'
      - 'examples/hosted-game-starter/**'
      - 'scripts/validate_hosted_game_standard_v1.php'
      - '.github/workflows/hosted-game-standard-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} standard v1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, fileinfo, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/hosted-game-standard-v1.php
          php -l includes/hosted-game-standard-core.php
          php -l includes/hosted-game-standard-security.php
          php -l includes/hosted-game-standard-upload.php
          php -l api/hosted-games/document.php
          php -l api/hosted-games/runtime.php
          php -l api/admin/hosted-game-upload.php
          php -l api/merchant/hosted-game-upload.php
          php -l hosted-game.php
          php -l scripts/validate_hosted_game_standard_v1.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/hosted-game-shell.js
          node --check assets/js/hosted-game-child-bridge.js
          node --check examples/hosted-game-starter/game.js
      - name: JSON syntax
        run: php -r '$manifest=json_decode(file_get_contents("examples/hosted-game-starter/game.json"),true,512,JSON_THROW_ON_ERROR); if(($manifest["schema"]??"")!=="microgifter.hosted-game/v1") exit(1);'
      - name: Standard contract
        run: php scripts/validate_hosted_game_standard_v1.php
