name: Footer Public Links v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'creator-campaigns-overview.php'
      - 'assets/css/creator-campaigns-overview-v1.css'
      - 'assets/js/footer-public-links-v1.js'
      - 'config/security-route-policy.php'
      - 'cookies.php'
      - 'includes/cookie-consent.php'
      - 'scripts/validate_footer_public_links_v1.php'
      - '.github/workflows/footer-public-links-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PHP syntax
        run: |
          php -l creator-campaigns-overview.php
          php -l config/security-route-policy.php
          php -l cookies.php
          php -l includes/cookie-consent.php
          php -l scripts/validate_footer_public_links_v1.php

      - name: JavaScript syntax
        run: node --check assets/js/footer-public-links-v1.js

      - name: Footer public links contract
        run: php scripts/validate_footer_public_links_v1.php
