name: Design and Calendar Standalone v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'design-studio.php'
      - 'design-calendar.php'
      - 'includes/personal-agent-sidebar.php'
      - 'includes/personal-agent/workspace-design.php'
      - 'includes/personal-agent/workspace-design-calendar.php'
      - 'assets/css/design-studio-standalone.css'
      - 'assets/css/design-calendar-standalone.css'
      - 'assets/js/design-studio-template-variants.js'
      - 'assets/js/design-studio-schedule-context.js'
      - 'assets/js/design-calendar-modal.js'
      - 'scripts/validate_design_calendar_standalone_v1.php'
      - '.github/workflows/design-calendar-standalone-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l design-studio.php
          php -l design-calendar.php
          php -l includes/personal-agent-sidebar.php
          php -l includes/personal-agent/workspace-design.php
          php -l includes/personal-agent/workspace-design-calendar.php
          php -l scripts/validate_design_calendar_standalone_v1.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/design-studio-template-variants.js
          node --check assets/js/design-studio-schedule-context.js
          node --check assets/js/design-calendar-modal.js

      - name: Standalone page contract
        run: php scripts/validate_design_calendar_standalone_v1.php
