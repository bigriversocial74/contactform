name: Audit Generate Composer Lock

on:
  push:
    branches:
      - audit/repository-production-hardening-20260717
    paths:
      - composer.json
      - .github/workflows/audit-generate-composer-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Resolve and audit locked dependencies
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer audit --locked --no-interaction

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            echo 'composer.lock is already current.'
            exit 0
          fi
          git commit -m 'Lock Composer dependencies for deterministic builds'
          git push origin HEAD:audit/repository-production-hardening-20260717
