name: Repair HomeServer upgrade error boundary

on:
  pull_request:
    paths:
      - '.github/workflows/repair-homeserver-upgrade-error-boundary.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/homeserver-primary-connection-upgrades'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-primary-connection-upgrades
          fetch-depth: 0

      - name: Replace direct exception disclosure
        shell: python
        run: |
          from pathlib import Path

          target = Path('api/admin/homeserver-upgrades.php')
          text = target.read_text(encoding='utf-8')
          old = """    } catch (Throwable $error) {
        mg_fail('The rollback target manifest is no longer valid: ' . $error->getMessage(), 409);
    }
"""
          new = """    } catch (Throwable $error) {
        error_log('HomeServer rollback target manifest validation failed: ' . $error->getMessage());
        mg_fail('The rollback target manifest is no longer valid.', 409);
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one rollback exception boundary, found {text.count(old)}')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-homeserver-upgrade-error-boundary.yml').unlink()

      - name: Commit permanent repair only
        run: |
          git config user.name "Microgifter Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api/admin/homeserver-upgrades.php .github/workflows/repair-homeserver-upgrade-error-boundary.yml
          git commit -m "Harden HomeServer upgrade error boundary"
          git push origin HEAD:feature/homeserver-primary-connection-upgrades
