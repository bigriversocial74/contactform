name: MCP Phase 1 Protocol v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'services/mcp/**'
      - 'config/mcp_phase1_protocol_release.php'
      - 'docs/MICROGIFTER_MCP_PHASE1_PROTOCOL_RUNBOOK.md'
      - 'scripts/validate_mcp_phase1_protocol.php'
      - 'tests/phpunit/McpPhase1ProtocolV1ContractTest.php'
      - '.github/workflows/mcp-phase1-protocol-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and test protocol
        run: npm run check

  php-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: php-contracts (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l config/mcp_phase1_protocol_release.php
          php -l scripts/validate_mcp_phase1_protocol.php
          php -l tests/phpunit/McpPhase1ProtocolV1ContractTest.php
      - name: MCP Phase 1 protocol executable contract
        run: php scripts/validate_mcp_phase1_protocol.php
      - name: MCP Phase 1 protocol and foundation PHPUnit contracts
        run: |
          vendor/bin/phpunit \
            tests/phpunit/McpPhase1ProtocolV1ContractTest.php \
            tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Task Agent Phase 4 and Approval Center regressions
        run: |
          vendor/bin/phpunit \
            tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php \
            tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php \
            tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php
      - name: Repository production-quality audit
        run: composer audit-repository-quality
