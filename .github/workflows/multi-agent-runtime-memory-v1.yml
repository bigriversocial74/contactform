name: Multi-Agent Runtime Memory v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'api/agents/runtime.php'
      - 'includes/multi-agent-runtime.php'
      - 'includes/personal-agent/multi-agent-workspace.php'
      - 'assets/js/multi-agent-runtime.js'
      - 'assets/css/multi-agent-runtime.css'
      - 'database/20260719_multi_agent_runtime_memory_v1.sql'
      - 'tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php'
      - '.github/workflows/multi-agent-runtime-memory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Capture PHP syntax report
        run: |
          set +e
          failed=0
          : > multi-agent-lint-${{ matrix.php }}.txt
          for file in agent.php api/agents/runtime.php includes/multi-agent-runtime.php includes/personal-agent/multi-agent-workspace.php tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php; do
            php -l "$file" >> multi-agent-lint-${{ matrix.php }}.txt 2>&1 || failed=1
          done
          echo "$failed" > multi-agent-lint-status-${{ matrix.php }}.txt
          cat multi-agent-lint-${{ matrix.php }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: multi-agent-lint-${{ matrix.php }}
          path: |
            multi-agent-lint-${{ matrix.php }}.txt
            multi-agent-lint-status-${{ matrix.php }}.txt
          if-no-files-found: error
      - name: Enforce PHP syntax
        run: test "$(cat multi-agent-lint-status-${{ matrix.php }}.txt)" = "0"
      - name: JavaScript syntax
        run: node --check assets/js/multi-agent-runtime.js
      - name: Existing multi-agent workspace regressions
        run: |
          vendor/bin/phpunit tests/phpunit/TrueMultiAgentWorkspaceV1ContractTest.php
          vendor/bin/phpunit tests/phpunit/AgentHeaderTabBehaviorTest.php
          vendor/bin/phpunit tests/phpunit/MobileAgentTabsTest.php
      - name: Runtime and memory contract
        run: vendor/bin/phpunit tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
