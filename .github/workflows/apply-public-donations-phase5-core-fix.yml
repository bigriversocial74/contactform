name: Apply Public Donations Phase 5 Core Fix

on:
  push:
    branches:
      - feature/public-donations-recall-controls-v1
    paths:
      - '.github/workflows/apply-public-donations-phase5-core-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-donations-recall-controls-v1
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply guarded correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('includes/public-donations-recall.php')
          text = path.read_text()
          old = "VALUES (?,?,?,?,'recall','partial_recall','processing',?,?,?,?,0,?,?,?,?,?,'standard',?,?,?,NOW(),NOW())"
          new = "VALUES (?,?,?,?,'recall','partial_recall','processing',?,?,?,?,0,?,?,?,?,'standard',?,?,?,NOW(),NOW())"
          if new not in text:
              matches = text.count(old)
              if matches != 1:
                  raise SystemExit(f'expected one operation INSERT match, found {matches}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate corrected core
        run: php -l includes/public-donations-recall.php
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'Core correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/public-donations-recall.php
          git commit -m 'Correct Phase 5 recall operation insert'
          git push origin HEAD:feature/public-donations-recall-controls-v1
