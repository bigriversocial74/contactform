name: Hosted Games Cover Image Upload

on:
  pull_request:
    paths:
      - 'includes/hosted-game-cover-images.php'
      - 'api/admin/hosted-game-cover-upload.php'
      - 'api/merchant/hosted-game-cover-upload.php'
      - 'api/public/hosted-game-cover.php'
      - 'assets/js/hosted-games-cover-upload.js'
      - 'assets/css/hosted-games-cover-upload.css'
      - 'admin/hosted-games.php'
      - 'merchant-games.php'
      - 'includes/merchant-hosted-games-view.php'
      - 'scripts/validate_hosted_games_cover_image_upload.php'
      - '.github/workflows/hosted-games-cover-image-upload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} cover upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/hosted-game-cover-images.php
          php -l api/admin/hosted-game-cover-upload.php
          php -l api/merchant/hosted-game-cover-upload.php
          php -l api/public/hosted-game-cover.php
          php -l admin/hosted-games.php
          php -l merchant-games.php
          php -l includes/merchant-hosted-games-view.php
          php -l scripts/validate_hosted_games_cover_image_upload.php
      - name: JavaScript syntax
        run: node --check assets/js/hosted-games-cover-upload.js
      - name: Cover upload contract
        run: php scripts/validate_hosted_games_cover_image_upload.php
