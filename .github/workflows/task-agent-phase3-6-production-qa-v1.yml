name: Task Agent Phase 3.6 Production QA v1

on:
  pull_request:
    paths:
      - 'config/task_agent_phase3_release.php'
      - 'docs/TASK_AGENT_PHASE3_PRODUCTION_RUNBOOK.md'
      - 'docs/TASK_AGENT_PHASE3_6_SCORECARD.md'
      - 'tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php'
      - '.github/workflows/task-agent-phase3-6-production-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    name: validate (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l config/task_agent_phase3_release.php
          php -l includes/task-agent-shortlist.php
          php -l includes/task-agent-plan-selection.php
          php -l includes/task-agent-delivery-preparation.php
          php -l includes/task-agent-order-tracking.php
          php -l includes/task-agent-lifecycle-tracking.php
          php -l includes/multi-agent-runtime.php
          php -l api/agents/runtime.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/multi-agent-runtime.js
          node --check assets/js/task-agent-shortlist-runtime.js
          node --check assets/js/task-agent-delivery-runtime.js
          node --check assets/js/task-agent-order-tracking-runtime.js
          node --check assets/js/task-agent-lifecycle-runtime.js
      - name: Phase 3 integrated contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php
      - name: Phase 3 safety contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php
      - name: Phase 3.5 lifecycle regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase35LifecycleHandoffV1ContractTest.php
      - name: Phase 3.4 purchase regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase34PurchaseConfirmationPppmTrackingV1ContractTest.php
      - name: Phase 3.3 delivery regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase33RecipientSendLaterDeliveryPrepV1ContractTest.php
      - name: Phase 3.2 cart handoff regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase32PlanCartHandoffV1ContractTest.php
      - name: Phase 3.1 shortlist regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php
      - name: Contextual chat regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
      - name: Runtime memory regression
        run: vendor/bin/phpunit tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
      - name: Phase 2 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
      - name: Action Center regression
        run: vendor/bin/phpunit tests/phpunit/ActionCenterContractV2Test.php
      - name: Purchase issuance regression
        run: vendor/bin/phpunit tests/phpunit/PostCheckoutMicrogiftIssuanceContractTest.php
      - name: Order confirmation regression
        run: vendor/bin/phpunit tests/phpunit/CheckoutSuccessOrderConfirmationContractTest.php
