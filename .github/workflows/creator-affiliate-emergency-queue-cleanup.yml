name: Creator Affiliate Emergency Queue Cleanup

on:
  push:
    branches:
      - integration-from-repair-20260628
    paths:
      - .github/workflows/creator-affiliate-emergency-queue-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: creator-affiliate-emergency-queue-cleanup
  cancel-in-progress: true

jobs:
  cancel-nonessential-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete and nonessential PR workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: feature/creator-affiliate-operations-v16-20260730
          TARGET_HEAD: 6ba96ac1eb7cebbe609cbf4cc6377a0597852081
        run: |
          set -euo pipefail

          page=1
          cancelled=0

          while true; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&event=pull_request&per_page=100&page=${page}")"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            if [[ "${count}" -eq 0 ]]; then
              break
            fi

            mapfile -t run_ids < <(jq -r --arg target "${TARGET_HEAD}" '
              .workflow_runs[]
              | select(
                  .status == "queued"
                  or .status == "pending"
                  or .status == "waiting"
                  or .status == "requested"
                  or .status == "in_progress"
                )
              | select(
                  .head_sha != $target
                  or (
                    .name != "Creator Affiliate Operations v16"
                    and .name != "Creator Campaign Phases 1-15 Production Audit v1"
                    and .name != "Repository Production Quality"
                    and .name != "Merchant Navigation Groups v1"
                  )
                )
              | .id
            ' <<<"${response}")

            for run_id in "${run_ids[@]}"; do
              echo "Cancelling nonessential run ${run_id}"
              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel" \
                >/dev/null || true
              cancelled=$((cancelled + 1))
            done

            if [[ "${count}" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Cancelled ${cancelled} obsolete or nonessential runs."
          echo "Preserved exact head ${TARGET_HEAD}."
          echo "Preserved Creator Affiliate Operations v16, retained production audit, repository quality, and merchant navigation only."
