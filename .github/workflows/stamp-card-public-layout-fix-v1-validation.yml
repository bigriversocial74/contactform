name: Stamp Card Public Layout Fix v1

on:
  pull_request:
    paths:
      - 'stamp-card.php'
      - 'assets/css/stamp-card-public-layout-fix.css'
      - 'assets/js/stamp-card-public-layout-fix.js'
      - 'scripts/validate_stamp_card_public_layout_fix_v1.php'
      - '.github/workflows/stamp-card-public-layout-fix-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l stamp-card.php
          php -l scripts/validate_stamp_card_public_layout_fix_v1.php
      - name: JavaScript syntax
        run: node --check assets/js/stamp-card-public-layout-fix.js
      - name: Stamp Card layout contract
        run: php scripts/validate_stamp_card_public_layout_fix_v1.php
