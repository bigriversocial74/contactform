name: Public Donations Operations Admin v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'account-admin.php'
      - 'admin/public-donations-operations.php'
      - 'api/admin/_public_donations_operations.php'
      - 'api/admin/public-donations-operations.php'
      - 'api/admin/public-donations-operations-action.php'
      - 'assets/css/admin-public-donations-operations.css'
      - 'assets/js/admin-public-donations-nav.js'
      - 'assets/js/admin-public-donations-operations*.js'
      - 'database/20260724_public_donations_operations_admin_v1_single_install.sql'
      - 'includes/public-donations-feature.php'
      - 'scripts/validate_public_donations_operations_admin_v1.php'
      - 'scripts/test_public_donations_operations_admin_mysql.php'
      - 'tests/phpunit/PublicDonationsOperationsAdminContractTest.php'
      - '.github/workflows/public-donations-operations-admin-v1.yml'

permissions:
  contents: read

concurrency:
  group: public-donations-operations-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: microgifter_public_donations_ops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: microgifter_public_donations_ops
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MG_PUBLIC_DONATIONS_FEATURE_STATE: enabled

    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check assets/js/admin-public-donations-nav.js
          node --check assets/js/admin-public-donations-operations.js
          node --input-type=module --check < assets/js/admin-public-donations-operations-ui.js
          node --input-type=module --check < assets/js/admin-public-donations-operations-app.js

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql,mbstring
          tools: phpunit

      - name: PHP 8.2 syntax
        run: |
          php -l account-admin.php
          php -l admin/public-donations-operations.php
          php -l api/admin/_public_donations_operations.php
          php -l api/admin/public-donations-operations.php
          php -l api/admin/public-donations-operations-action.php
          php -l includes/public-donations-feature.php
          php -l scripts/validate_public_donations_operations_admin_v1.php
          php -l scripts/test_public_donations_operations_admin_mysql.php
          php -l tests/phpunit/PublicDonationsOperationsAdminContractTest.php

      - name: PHP 8.2 operations contracts
        run: php scripts/validate_public_donations_operations_admin_v1.php

      - name: PHP 8.2 PHPUnit
        run: phpunit tests/phpunit/PublicDonationsOperationsAdminContractTest.php

      - name: PHP 8.2 operations MySQL fixture
        run: php scripts/test_public_donations_operations_admin_mysql.php

      - name: PHP 8.2 Phase 10 regression
        run: |
          php scripts/validate_public_donations_production_qa_v1.php
          phpunit tests/phpunit/PublicDonationsProductionQaContractTest.php
          php scripts/test_public_donations_production_qa_mysql.php
          php scripts/test_public_donations_governance_mysql.php
          php scripts/test_public_donations_community_assignment_mysql.php
          php scripts/test_public_donations_allocation_mysql.php
          php scripts/test_public_donations_recall_mysql.php
          php scripts/test_merchant_community_support_mysql.php
          php scripts/test_public_donations_public_campaign_mysql.php
          php scripts/test_public_profile_community_mysql.php

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql,mbstring
          tools: phpunit

      - name: PHP 8.3 syntax
        run: |
          php -l account-admin.php
          php -l admin/public-donations-operations.php
          php -l api/admin/_public_donations_operations.php
          php -l api/admin/public-donations-operations.php
          php -l api/admin/public-donations-operations-action.php
          php -l includes/public-donations-feature.php
          php -l scripts/validate_public_donations_operations_admin_v1.php
          php -l scripts/test_public_donations_operations_admin_mysql.php
          php -l tests/phpunit/PublicDonationsOperationsAdminContractTest.php

      - name: PHP 8.3 operations contracts
        run: php scripts/validate_public_donations_operations_admin_v1.php

      - name: PHP 8.3 PHPUnit
        run: phpunit tests/phpunit/PublicDonationsOperationsAdminContractTest.php

      - name: PHP 8.3 operations MySQL fixture
        run: php scripts/test_public_donations_operations_admin_mysql.php

      - name: PHP 8.3 Phase 10 regression
        run: |
          php scripts/validate_public_donations_production_qa_v1.php
          phpunit tests/phpunit/PublicDonationsProductionQaContractTest.php
          php scripts/test_public_donations_production_qa_mysql.php
          php scripts/test_public_donations_governance_mysql.php
          php scripts/test_public_donations_community_assignment_mysql.php
          php scripts/test_public_donations_allocation_mysql.php
          php scripts/test_public_donations_recall_mysql.php
          php scripts/test_merchant_community_support_mysql.php
          php scripts/test_public_donations_public_campaign_mysql.php
          php scripts/test_public_profile_community_mysql.php
