name: Creator Campaign MCP Canonical v13C

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'api/internal/_mcp_creator_campaign_action_bridge.php'
      - 'api/internal/_mcp_draft_bridge.php'
      - 'api/internal/mcp-bridge.php'
      - 'includes/mcp-creator-campaign-actions/**'
      - 'includes/mcp-creator-campaign-actions.php'
      - 'includes/creator-campaigns/earning-service.php'
      - 'includes/creator-campaigns/bootstrap.php'
      - 'includes/mcp-automations/**'
      - 'includes/mcp-oauth/**'
      - 'admin/mcp-oauth-clients.php'
      - 'account-creator-campaign-actions.php'
      - 'assets/css/mcp-creator-campaign-actions.css'
      - 'services/mcp/src/bridge/canonicalBridge.ts'
      - 'services/mcp/src/tools/creatorCampaignActions.ts'
      - 'services/mcp/src/tools/registry.ts'
      - 'services/mcp/tests/creatorCampaignActions.test.mjs'
      - 'database/20260722_creator_campaign_mcp_canonical_actions_v13c_single_install.sql'
      - 'scripts/validate_creator_campaign_mcp_v13c.php'
      - 'tests/phpunit/CreatorCampaignMcpCanonicalV13cContractTest.php'
      - 'docs/creator-campaigns/CREATOR_CAMPAIGN_PHASE13C_MCP_CANONICAL_ACTIONS.md'
      - '.github/workflows/creator-campaign-mcp-canonical-v13c.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-mcp-canonical-v13c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2','8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: services/mcp/package-lock.json}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefix services/mcp
      - name: PHP syntax
        run: |
          php -l api/internal/_mcp_creator_campaign_action_bridge.php
          php -l api/internal/_mcp_draft_bridge.php
          php -l api/internal/mcp-bridge.php
          php -l includes/mcp-creator-campaign-actions/bootstrap.php
          php -l includes/mcp-creator-campaign-actions/repository.php
          php -l includes/mcp-creator-campaign-actions/request-service.php
          php -l includes/mcp-creator-campaign-actions/owner-service.php
          php -l includes/mcp-creator-campaign-actions/execution-service.php
          php -l includes/mcp-creator-campaign-actions/owner-page-view.php
          php -l includes/mcp-creator-campaign-actions.php
          php -l includes/creator-campaigns/earning-service.php
          php -l includes/creator-campaigns/bootstrap.php
          php -l includes/mcp-automations/authorize-action.php
          php -l includes/mcp-automations/bootstrap.php
          php -l includes/mcp-automations/connections.php
          php -l includes/mcp-automations/create-grant.php
          php -l includes/mcp-oauth/operation-classes.php
          php -l includes/mcp-oauth/clients.php
          php -l admin/mcp-oauth-clients.php
          php -l account-creator-campaign-actions.php
          php -l scripts/validate_creator_campaign_mcp_v13c.php
          php -l tests/phpunit/CreatorCampaignMcpCanonicalV13cContractTest.php
      - name: MCP TypeScript and Node contracts
        run: npm test --prefix services/mcp
      - name: Phase 13C score
        run: php scripts/validate_creator_campaign_mcp_v13c.php
      - name: Phase 13C PHPUnit
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignMcpCanonicalV13cContractTest.php
      - name: Creator Campaign compatibility
        run: |
          php scripts/validate_creator_campaign_mcp_v13b.php
          php scripts/validate_creator_campaign_mcp_v13a.php
          php scripts/validate_creator_campaign_crm_v12.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignMcpDraftV13bContractTest.php tests/phpunit/CreatorCampaignMcpReadV13aContractTest.php tests/phpunit/CreatorCampaignCrmV12ContractTest.php
      - name: MCP Phase 2A authority compatibility
        run: vendor/bin/phpunit tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php
      - name: MCP Phase 3A draft compatibility
        run: vendor/bin/phpunit tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php
      - name: MCP Phase 3B conversion compatibility
        run: vendor/bin/phpunit tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php
      - name: MCP Phase 3C status compatibility
        run: vendor/bin/phpunit tests/phpunit/McpNativeDraftStatusPhase3cV1ContractTest.php
      - name: MCP Phase 4A grant compatibility
        run: vendor/bin/phpunit tests/phpunit/McpAutomationGrantsPhase4aV1ContractTest.php
      - name: MCP Phase 4B definition compatibility
        run: vendor/bin/phpunit tests/phpunit/McpAutomationDefinitionsPhase4bV1ContractTest.php
      - name: MCP Phase 4C schedule compatibility
        run: vendor/bin/phpunit tests/phpunit/McpAutomationSchedulesPhase4cV1ContractTest.php
      - name: MCP Phase 4D operations compatibility
        run: vendor/bin/phpunit tests/phpunit/McpAutomationOperationsPhase4dV1ContractTest.php
      - name: Migration compatibility
        run: php scripts/validate_migration_manifest.php

  sql-lifecycle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Apply Phase 6 earnings prerequisite
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_compensation_earnings_v6_single_install.sql
      - name: Apply Phase 7 budget prerequisite
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_budget_controls_v7_single_install.sql
      - name: Apply Phase 13C migration
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_canonical_actions_v13c_single_install.sql
      - name: Verify authority schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog WHERE scope_key IN ('creator_campaigns:publish','creator_campaign_participants:manage','creator_campaign_agreements:manage','creator_campaign_submissions:review','creator_campaign_attribution:manage','creator_campaign_earnings:manage','creator_campaign_payouts:manage','creator_campaign_disputes:manage') AND operation_class='approval_gated' AND active=1 AND grantable=1;")" = "8"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('mcp_creator_campaign_action_approvals','creator_campaign_earning_reviews');")" = "2"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog WHERE scope_key LIKE 'creator_campaign%' AND operation_class IN ('bounded_auto','prohibited');")" = "0"
      - name: Verify SQL idempotency
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_canonical_actions_v13c_single_install.sql
