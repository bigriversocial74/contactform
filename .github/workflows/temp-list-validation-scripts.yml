name: Temporary validation script list

on:
  push:
    branches:
      - fix/post-login-agent-free-systematic-access-v1-20260718
    paths:
      - .github/workflows/temp-list-validation-scripts.yml

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-login-agent-free-systematic-access-v1-20260718
      - name: Write validation script inventory
        run: |
          find scripts -maxdepth 1 -type f -printf '%f\n' | sort > tmp-validation-scripts.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-validation-scripts.txt
          git commit -m "Write temporary validation script inventory"
          git push origin HEAD:fix/post-login-agent-free-systematic-access-v1-20260718
