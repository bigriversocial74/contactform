name: Task Agent Phase 4.2 Group Gifting v1

on:
  pull_request:
    paths:
      - 'includes/task-agent-group-gifts.php'
      - 'includes/task-agent-group-gifts-router.php'
      - 'api/agents/runtime.php'
      - 'agent.php'
      - 'assets/js/task-agent-group-gifts-runtime.js'
      - 'tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php'
      - '.github/workflows/task-agent-phase4-2-group-gifting-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    name: validate (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/task-agent-group-gifts.php
          php -l includes/task-agent-group-gifts-router.php
          php -l api/agents/runtime.php
          php -l agent.php
      - name: JavaScript syntax
        run: node --check assets/js/task-agent-group-gifts-runtime.js
      - name: Phase 4.2 contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php
      - name: Phase 4.1 recurring regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php
      - name: Phase 3 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php
      - name: Phase 2 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
