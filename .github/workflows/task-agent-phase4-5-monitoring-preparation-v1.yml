name: Task Agent Phase 4.5 Monitoring Preparation v1

on:
  pull_request:
    paths:
      - 'includes/task-agent-monitoring.php'
      - 'includes/task-agent-monitoring-router.php'
      - 'includes/task-agent-recurring-programs-router.php'
      - 'includes/task-agent-program-coordination-router.php'
      - 'agent.php'
      - 'assets/js/task-agent-monitoring-runtime.js'
      - 'config/migrations.php'
      - 'scripts/validate_migration_manifest.php'
      - 'tests/phpunit/TaskAgentPhase45MonitoringPreparationV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase44RulesBudgetsApprovalsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase43WorkplaceCommunityProgramsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php'
      - 'tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php'
      - '.github/workflows/task-agent-phase4-5-monitoring-preparation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    name: validate (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/task-agent-monitoring.php
          php -l includes/task-agent-monitoring-router.php
          php -l includes/task-agent-recurring-programs-router.php
          php -l includes/task-agent-program-coordination-router.php
          php -l agent.php
          php -l tests/phpunit/TaskAgentPhase45MonitoringPreparationV1ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/task-agent-monitoring-runtime.js
      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Phase 4.5 contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase45MonitoringPreparationV1ContractTest.php
      - name: Phase 4.4 regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase44RulesBudgetsApprovalsV1ContractTest.php
      - name: Phase 4.3 regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase43WorkplaceCommunityProgramsV1ContractTest.php
      - name: Phase 4.2 regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php
      - name: Phase 4.1 regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php
      - name: Phase 3 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php
      - name: Approval center regression
        run: vendor/bin/phpunit tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php
