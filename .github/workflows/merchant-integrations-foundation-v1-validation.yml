name: Merchant App Connect Foundation

on:
  pull_request:
    paths:
      - 'database/merchant_integrations_foundation_v1.sql'
      - 'config/migrations.php'
      - 'includes/merchant-integrations.php'
      - 'includes/integrations/**'
      - 'api/merchant/integrations.php'
      - 'merchant-integrations.php'
      - 'merchant-integrations-squarespace-callback.php'
      - 'includes/merchant-integrations-view.php'
      - 'includes/merchant-navigation.php'
      - 'includes/merchant-view.php'
      - 'assets/js/merchant-integrations.js'
      - 'assets/css/merchant-integrations.css'
      - 'scripts/validate_merchant_integrations_foundation_v1.php'
      - '.github/workflows/merchant-integrations-foundation-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l includes/integrations/provider-interface.php
          php -l includes/integrations/providers/squarespace.php
          php -l includes/merchant-integrations.php
          php -l api/merchant/integrations.php
          php -l merchant-integrations.php
          php -l merchant-integrations-squarespace-callback.php
          php -l includes/merchant-integrations-view.php
          php -l scripts/validate_merchant_integrations_foundation_v1.php
      - name: JavaScript syntax
        run: node --check assets/js/merchant-integrations.js
      - name: Foundation contract
        run: php scripts/validate_merchant_integrations_foundation_v1.php
