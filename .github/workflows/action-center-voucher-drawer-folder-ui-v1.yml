name: Action Center Voucher Drawer and Folder UI v1

on:
  pull_request:
    paths:
      - 'api/account/action-center-voucher-detail.php'
      - 'assets/css/gift-action-center-voucher-drawer-v1.css'
      - 'assets/js/gift-action-center-voucher-drawer-v1.js'
      - 'includes/gift-action-center.php'
      - 'scripts/validate_action_center_voucher_drawer_folder_ui_v1.php'
      - '.github/workflows/action-center-voucher-drawer-folder-ui-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l api/account/action-center-voucher-detail.php
          php -l includes/gift-action-center.php
          php -l scripts/validate_action_center_voucher_drawer_folder_ui_v1.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/gift-action-center-voucher-drawer-v1.js
          node --check assets/js/gift-action-center-runtime-v4.js
          node --check assets/js/gift-action-center-actions.js
      - name: Voucher drawer and folder UI contract
        run: php scripts/validate_action_center_voucher_drawer_folder_ui_v1.php
