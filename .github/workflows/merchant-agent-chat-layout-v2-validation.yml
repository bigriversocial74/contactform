name: Merchant Agent Chat Layout v2 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-agent-chat.php'
      - 'includes/merchant-agent-chat-view.php'
      - 'includes/personal-agent-sidebar.php'
      - 'assets/css/agent-mode-switch.css'
      - 'assets/css/merchant-agent-integrated-workspace.css'
      - 'assets/css/merchant-agent-integrated-compat.css'
      - 'assets/js/merchant-agent-chat-mobile.js'
      - 'assets/js/merchant-agent-sidebar-history.js'
      - 'scripts/validate_merchant_agent_chat_layout_v2.php'
      - '.github/workflows/merchant-agent-chat-layout-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-agent-chat.php
          php -l includes/merchant-agent-chat-view.php
          php -l includes/personal-agent-sidebar.php
          php -l scripts/validate_merchant_agent_chat_layout_v2.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-agent-chat-mobile.js
          node --check assets/js/merchant-agent-sidebar-history.js

      - name: Merchant agent chat layout contract
        run: php scripts/validate_merchant_agent_chat_layout_v2.php
