name: MCP Approved Draft Conversion Phase 3B

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'account-agent-drafts.php'
      - 'account-agent-draft-open.php'
      - 'assets/css/mcp-drafts.css'
      - 'includes/mcp-drafts.php'
      - 'includes/mcp-drafts/**'
      - 'database/20260720_mcp_approved_draft_conversion_phase3b_v1.sql'
      - 'config/migrations.php'
      - 'config/mcp_approved_draft_conversion_phase3b_release.php'
      - 'scripts/mcp-phase3b/**'
      - 'scripts/test_mcp_approved_draft_conversion_phase3b.php'
      - 'tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php'
      - 'docs/MICROGIFTER_MCP_INSTALLATION_AND_ACTIVATION.md'
      - 'docs/MICROGIFTER_MCP_APPROVED_DRAFT_CONVERSION_PHASE3B.md'
      - '.github/workflows/mcp-approved-draft-conversion-phase3b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-external-conversion-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install locked dependencies
        working-directory: services/mcp
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        working-directory: services/mcp
        run: npm audit --audit-level=high
      - name: Build and test MCP service
        working-directory: services/mcp
        run: npm run check
      - name: Prove conversion remains owner-only PHP
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'microgifter.gift.create_draft' services/mcp/src/tools/drafts.ts
          grep -F 'microgifter.drafts.cancel' services/mcp/src/tools/drafts.ts
          if grep -E 'microgifter\..*(convert|publish|purchase|send_message|launch_campaign|activate_reward)' services/mcp/src/tools/drafts.ts; then
            echo 'External conversion or execution tool detected.' >&2
            exit 1
          fi

  php-native-draft-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: php-native-draft-conversion (${{ matrix.php }})
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: ci-phase3b-pepper
      MG_MCP_BRIDGE_ENABLED: 'true'
      MG_MCP_BRIDGE_SECRET: ci-phase3b-bridge-secret-0123456789abcdef
      MG_MCP_OAUTH_ENABLED: 'true'
      MG_MCP_OAUTH_ISSUER: https://microgifter.test
      MG_MCP_OAUTH_RESOURCE_URI: https://mcp.microgifter.test/mcp
      MG_MCP_OAUTH_DYNAMIC_REGISTRATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find includes/mcp-drafts scripts/mcp-phase3b -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l includes/mcp-drafts.php
          php -l account-agent-drafts.php
          php -l account-agent-draft-open.php
          php -l config/mcp_approved_draft_conversion_phase3b_release.php
          php -l scripts/test_mcp_approved_draft_conversion_phase3b.php
          php -l tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php
      - name: Phase 3B and MCP regression contracts
        run: |
          vendor/bin/phpunit \
            tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php \
            tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php \
            tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php \
            tests/phpunit/McpExternalAgentSimulatorPhase2bContractTest.php \
            tests/phpunit/McpProductionVpsDeploymentV1ContractTest.php \
            tests/phpunit/McpPhase1ProvisioningConsoleV1ContractTest.php \
            tests/phpunit/McpPhase1CanonicalBridgeV1ContractTest.php \
            tests/phpunit/McpPhase1ProtocolV1ContractTest.php \
            tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Build clean MySQL database
        shell: bash
        run: |
          set -o pipefail
          php scripts/run_migrations.php 2>&1 | tee /tmp/mcp-phase3b-migrations.log
      - name: Verify Phase 3B tables
        run: |
          php -r '
          $config = require "api/config.php";
          $db = $config["db"];
          $pdo = new PDO(
              sprintf("mysql:host=%s;dbname=%s;charset=%s", $db["host"], $db["name"], $db["charset"]),
              getenv("MG_MIGRATION_DB_USER"),
              getenv("MG_MIGRATION_DB_PASS"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $tables = $pdo->query("SELECT table_name FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"mcp_agent_draft_conversions\",\"mcp_agent_draft_conversion_events\") ORDER BY table_name")->fetchAll(PDO::FETCH_COLUMN);
          if ($tables !== ["mcp_agent_draft_conversion_events", "mcp_agent_draft_conversions"]) {
              throw new RuntimeException("Phase 3B table mismatch: " . json_encode($tables));
          }
          echo "MCP Phase 3B tables verified.\n";
          '
      - name: Execute approved-draft conversion lifecycle
        run: php scripts/test_mcp_approved_draft_conversion_phase3b.php
      - name: Repository production-quality audit
        run: composer audit-repository-quality
      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-phase3b-migration-log-php-${{ matrix.php }}
          path: /tmp/mcp-phase3b-migrations.log
          if-no-files-found: ignore
