name: Loyalty Quest Admin Operations Validation

on:
  pull_request:
    paths:
      - 'admin/loyalty-quests.php'
      - 'api/admin/_loyalty_quest_operations.php'
      - 'api/admin/loyalty-quests.php'
      - 'assets/css/admin-loyalty-quests.css'
      - 'assets/js/admin-loyalty-quests.js'
      - 'includes/admin-permission-matrix.php'
      - 'includes/admin-sidebar.php'
      - 'scripts/validate_loyalty_quest_admin_operations_v1.php'
      - 'scripts/validate_loyalty_quest_admin_operations_behavior.php'
      - 'docs/architecture/loyalty_quest_admin_operations_v1.md'
      - '.github/workflows/loyalty-quest-admin-operations-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Loyalty Quest Admin Operations (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: microgifter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql,mbstring,json
          coverage: none
      - name: PHP syntax
        run: |
          php -l admin/loyalty-quests.php
          php -l api/admin/_loyalty_quest_operations.php
          php -l api/admin/loyalty-quests.php
          php -l includes/admin-permission-matrix.php
          php -l includes/admin-sidebar.php
          php -l scripts/validate_loyalty_quest_admin_operations_v1.php
          php -l scripts/validate_loyalty_quest_admin_operations_behavior.php
      - name: JavaScript syntax
        run: node --check assets/js/admin-loyalty-quests.js
      - name: Loyalty Quest Admin Operations 10/10 contract
        run: php scripts/validate_loyalty_quest_admin_operations_v1.php
      - name: Loyalty Quest Admin Operations behavior
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: microgifter_test
          DB_USER: root
          DB_PASS: root
        run: |
          set +e
          php scripts/validate_loyalty_quest_admin_operations_behavior.php > loyalty-quest-admin-behavior-${{ matrix.php }}.json 2>&1
          status=$?
          cat loyalty-quest-admin-behavior-${{ matrix.php }}.json
          exit $status
      - name: Upload admin behavior failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loyalty-quest-admin-behavior-php-${{ matrix.php }}
          path: loyalty-quest-admin-behavior-${{ matrix.php }}.json
          retention-days: 7
      - name: Loyalty Quest campaign regression
        run: php scripts/validate_loyalty_quest_campaign_type_v1.php
      - name: Participant quest regression
        run: php scripts/validate_participant_quest_experience_v1.php
      - name: Merchant quest regression
        run: php scripts/validate_merchant_quest_management_v1.php
      - name: Notifications regression
        run: php scripts/validate_loyalty_quest_notifications_v1.php
      - name: Analytics regression
        run: php scripts/validate_loyalty_quest_analytics_v1.php
      - name: Quest media regression
        run: php scripts/validate_quest_media_promotional_assets_v1.php
      - name: Migration manifest regression
        run: php scripts/validate_migration_manifest.php
