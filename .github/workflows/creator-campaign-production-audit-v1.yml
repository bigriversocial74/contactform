name: Creator Campaign Phases 1-15 Production Audit v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'api/creator/**'
      - 'api/merchant/creator-campaign**'
      - 'api/internal/**creator_campaign**'
      - 'assets/js/*creator-campaign*'
      - 'database/*creator_campaign*'
      - 'docs/creator-campaigns/**'
      - 'includes/creator-campaigns/**'
      - 'includes/creator-campaign-onboarding/**'
      - 'includes/creator-campaign-pilot/**'
      - 'merchant-creator-*.php'
      - 'scripts/validate_creator_campaign*'
      - 'tests/phpunit/CreatorCampaign*'
      - 'services/mcp/src/tools/creatorCampaign*'
      - 'services/mcp/tests/creatorCampaign*'
      - '.github/workflows/creator-campaign-production-audit-v1.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-production-audit-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2','8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm', cache-dependency-path: 'services/mcp/package-lock.json'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/compensation-definitions.php
          php -l includes/creator-campaigns/compensation-service.php
          php -l includes/creator-campaign-onboarding/repository.php
          php -l includes/creator-campaign-onboarding/readiness.php
          php -l includes/creator-campaign-onboarding/smoke-test.php
          php -l includes/creator-campaign-onboarding/page-view-launch.php
          php -l merchant-creator-campaign-builder.php
          php -l merchant-creator-campaign-detail.php
          php -l merchant-creator-participation.php
          php -l merchant-creator-deliverables.php
          php -l merchant-creator-tracking.php
          php -l merchant-creator-compensation.php
          php -l merchant-creator-budgets.php
          php -l scripts/validate_creator_campaign_production_audit_v1.php
          php -l tests/phpunit/CreatorCampaignProductionAuditV1ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/creator-campaign-context-filter.js
      - name: Production audit score
        run: php scripts/validate_creator_campaign_production_audit_v1.php
      - name: Phase 1-15 scored validators
        run: |
          php scripts/validate_creator_campaign_native_foundation_v1.php
          php scripts/validate_creator_campaign_merchant_builder_v2.php
          php scripts/validate_creator_campaign_participation_v3.php
          php scripts/validate_creator_campaign_deliverables_v4.php
          php scripts/validate_creator_campaign_tracking_v5.php
          php scripts/validate_creator_campaign_compensation_v6.php
          php scripts/validate_creator_campaign_budgets_v7.php
          php scripts/validate_creator_campaign_payouts_v8.php
          php scripts/validate_creator_campaign_messaging_v9.php
          php scripts/validate_creator_campaign_analytics_v10.php
          php scripts/validate_creator_campaign_ui_v11.php
          php scripts/validate_creator_campaign_crm_v12.php
          php scripts/validate_creator_campaign_mcp_v13a.php
          php scripts/validate_creator_campaign_mcp_v13b.php
          php scripts/validate_creator_campaign_mcp_v13c.php
          php scripts/validate_creator_campaign_mcp_v13d.php
          php scripts/validate_creator_campaign_pilot_v14.php
          php scripts/validate_creator_campaign_onboarding_v15.php
      - name: Creator Campaign PHPUnit suite
        run: vendor/bin/phpunit tests/phpunit --filter CreatorCampaign
      - name: MCP TypeScript and Node suite
        working-directory: services/mcp
        run: npm ci && npm test
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Repository production quality
        run: composer audit-repository-quality

  mysql-lifecycle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical Phase 1-5 migration chain
        run: composer migrate
      - name: Apply Phase 6-15 SQL chain
        run: |
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_compensation_earnings_v6_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_budget_controls_v7_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_payouts_disputes_v8_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_messaging_notifications_v9_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_crm_lifecycle_v12_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_read_scopes_v13a_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_draft_scopes_v13b_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_canonical_actions_v13c_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_production_pilot_v14_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260723_creator_campaign_pilot_launch_onboarding_v15_single_install.sql
      - name: Capture MCP authority scope count
        run: mysql -N -B -h 127.0.0.1 -uroot -proot microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog;" > /tmp/creator-campaign-scope-count-before
      - name: Apply production audit repair
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260723_creator_campaign_phases_1_15_production_audit_repair_v1.sql
      - name: Verify permission, receipt, migration, and authority contracts
        shell: bash
        run: |
          set -euo pipefail
          permission_count="$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(DISTINCT p.slug) FROM role_permissions rp INNER JOIN roles r ON r.id=rp.role_id INNER JOIN permissions p ON p.id=rp.permission_id WHERE r.slug='customer' AND p.slug IN ('creator.campaigns.discover','creator.campaign_applications.manage_own','creator.campaign_invitations.respond_own','creator.campaign_participants.view_own','creator.campaign_agreements.view_own','creator.campaign_agreements.respond_own','creator.campaign_deliverables.view_own','creator.campaign_submissions.manage_own','creator.campaign_tracking.view_own','creator.campaign_tracking.manage_own','creator.campaign_earnings.view_own','creator.campaign_payouts.view_own','creator.campaign_disputes.manage_own');")"
          test "$permission_count" = "13"
          index_columns="$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',') FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='creator_campaign_onboarding_receipts' AND index_name='uq_creator_campaign_onboarding_receipt_snapshot';")"
          test "$index_columns" = "onboarding_id,receipt_type,snapshot_hash,status"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='creator_campaign_onboarding_receipts' AND index_name='uq_creator_campaign_onboarding_receipt_snapshot' AND non_unique=0;")" = "4"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260723_creator_campaign_phases_1_15_production_audit_repair_v1';")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog;")" = "$(cat /tmp/creator-campaign-scope-count-before)"
      - name: Verify audit SQL re-import and idempotency
        run: |
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260723_creator_campaign_phases_1_15_production_audit_repair_v1.sql
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260723_creator_campaign_phases_1_15_production_audit_repair_v1';")" = "1"
