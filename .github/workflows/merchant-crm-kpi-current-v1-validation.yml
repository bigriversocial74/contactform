name: Merchant CRM KPI v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - merchant-crm.php
      - includes/merchant-crm-view.php
      - assets/css/merchant-crm-kpi-authoritative-v1.css
      - scripts/validate_merchant_crm_kpi_current_v1.php
      - tests/phpunit/MerchantCrmKpiCurrentV1Test.php
      - .github/workflows/merchant-crm-kpi-current-v1-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax
        run: |
          php -l merchant-crm.php
          php -l includes/merchant-crm-view.php
          php -l scripts/validate_merchant_crm_kpi_current_v1.php
          php -l tests/phpunit/MerchantCrmKpiCurrentV1Test.php
      - name: Contract
        run: php scripts/validate_merchant_crm_kpi_current_v1.php
      - name: PHPUnit
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantCrmKpiCurrentV1Test.php
          fi
