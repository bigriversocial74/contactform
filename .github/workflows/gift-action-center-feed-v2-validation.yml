name: Gift Action Center Feed v2 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'assets/css/gift-action-center-feed-v2.css'
      - 'assets/js/gift-action-center-feed-v2.js'
      - 'assets/js/gift-envelope-presentation.js'
      - 'assets/js/gift-source-metadata.js'
      - 'assets/js/gift-action-center.js'
      - 'includes/gift-action-center.php'
      - 'inbox.php'
      - 'sent.php'
      - 'claimed.php'
      - 'scripts/validate_gift_action_center_feed_v2.php'
      - '.github/workflows/gift-action-center-feed-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l includes/gift-action-center.php
          php -l inbox.php
          php -l sent.php
          php -l claimed.php
          php -l scripts/validate_gift_action_center_feed_v2.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/gift-action-center-feed-v2.js
          node --check assets/js/gift-envelope-presentation.js
          node --check assets/js/gift-source-metadata.js
          node --check assets/js/gift-action-center.js

      - name: Feed v2 contract
        run: php scripts/validate_gift_action_center_feed_v2.php
