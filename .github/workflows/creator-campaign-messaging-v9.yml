name: Creator Campaign Messaging v9
on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'database/20260722_creator_campaign_messaging_notifications_v9_single_install.sql'
      - 'includes/creator-campaigns/**'
      - 'api/merchant/creator-campaign-messages.php'
      - 'api/creator/campaign-messages.php'
      - 'api/messages/send.php'
      - 'api/messages/thread.php'
      - 'merchant-creator-messages.php'
      - 'creator-campaign-messages.php'
      - 'includes/merchant-creator-campaign-messages-view.php'
      - 'includes/creator-campaign-messages-view.php'
      - 'includes/merchant-creator-campaign-payouts-view.php'
      - 'includes/creator-campaign-payouts-view.php'
      - 'assets/css/creator-campaign-messages.css'
      - 'assets/js/merchant-creator-campaign-messages.js'
      - 'assets/js/creator-campaign-messages.js'
      - 'scripts/validate_creator_campaign_messaging_v9.php'
      - 'scripts/validate_creator_campaign_messaging_v9_mysql.php'
      - 'scripts/validate_message_delivery_verification.php'
      - 'tests/phpunit/CreatorCampaignMessagingV9ContractTest.php'
      - 'docs/creator-campaigns/CREATOR_CAMPAIGN_PHASE9_MESSAGING.md'
      - '.github/workflows/creator-campaign-messaging-v9.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: creator-campaign-messaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    strategy: {fail-fast: false, matrix: {php: ['8.2','8.3']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/message-definitions.php
          php -l includes/creator-campaigns/message-context.php
          php -l includes/creator-campaigns/message-repository.php
          php -l includes/creator-campaigns/message-notification.php
          php -l includes/creator-campaigns/message-service.php
          php -l includes/creator-campaigns/message-query.php
          php -l api/merchant/creator-campaign-messages.php
          php -l api/creator/campaign-messages.php
          php -l api/messages/send.php
          php -l api/messages/thread.php
          php -l merchant-creator-messages.php
          php -l creator-campaign-messages.php
          php -l includes/merchant-creator-campaign-messages-view.php
          php -l includes/creator-campaign-messages-view.php
          php -l scripts/validate_creator_campaign_messaging_v9.php
          php -l scripts/validate_creator_campaign_messaging_v9_mysql.php
          php -l scripts/validate_message_delivery_verification.php
          php -l tests/phpunit/CreatorCampaignMessagingV9ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-creator-campaign-messages.js
          node --check assets/js/creator-campaign-messages.js
      - name: Phase 2 compatibility
        run: php scripts/validate_creator_campaign_merchant_builder_v2.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignMerchantBuilderV2ContractTest.php
      - name: Phase 3 compatibility
        run: php scripts/validate_creator_campaign_participation_v3.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignParticipationV3ContractTest.php
      - name: Phase 4 compatibility
        run: php scripts/validate_creator_campaign_deliverables_v4.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignDeliverablesV4ContractTest.php
      - name: Phase 5 compatibility
        run: php scripts/validate_creator_campaign_tracking_v5.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignTrackingV5ContractTest.php
      - name: Phase 6 compatibility
        run: php scripts/validate_creator_campaign_compensation_v6.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignCompensationV6ContractTest.php
      - name: Phase 7 compatibility
        run: php scripts/validate_creator_campaign_budgets_v7.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignBudgetsV7ContractTest.php
      - name: Phase 8 compatibility
        run: php scripts/validate_creator_campaign_payouts_v8.php && vendor/bin/phpunit tests/phpunit/CreatorCampaignPayoutsV8ContractTest.php
      - name: Phase 9 score
        run: php scripts/validate_creator_campaign_messaging_v9.php
      - name: Phase 9 PHPUnit
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignMessagingV9ContractTest.php
      - name: Existing message delivery contract
        run: php scripts/validate_message_delivery_verification.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php
  mysql-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: creator-campaign-messaging-v9
      MG_TRACKING_HASH_PEPPER: creator-campaign-messaging-v9-tracking
      MG_DELIVERY_EMAIL_ENABLED: '1'
      MG_DELIVERY_PUSH_ENABLED: '1'
      MG_MEDIA_STORAGE_DRIVER: persistent_local
      MG_MEDIA_STORAGE_ROOT: /tmp/microgifter-creator-campaign-messaging-storage
      MG_MEDIA_PUBLIC_ENDPOINT: /api/public/media.php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Apply Phase 6 SQL
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_compensation_earnings_v6_single_install.sql
      - name: Verify Phase 6 compatibility
        run: php scripts/validate_creator_campaign_compensation_v6_mysql.php
      - name: Apply Phase 7 SQL
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_budget_controls_v7_single_install.sql
      - name: Verify Phase 7 compatibility
        run: php scripts/validate_creator_campaign_budgets_v7_mysql.php
      - name: Apply Phase 8 SQL
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_payouts_disputes_v8_single_install.sql
      - name: Verify Phase 8 compatibility
        run: php scripts/validate_creator_campaign_payouts_v8_mysql.php
      - name: Apply Phase 9 SQL
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_messaging_notifications_v9_single_install.sql
      - name: Phase 9 tables
        run: php scripts/validate_creator_campaign_messaging_v9_mysql.php tables
      - name: Phase 9 permissions
        run: php scripts/validate_creator_campaign_messaging_v9_mysql.php permissions
      - name: Phase 9 uniqueness and idempotency
        run: php scripts/validate_creator_campaign_messaging_v9_mysql.php indexes
      - name: Phase 9 canonical message columns
        run: php scripts/validate_creator_campaign_messaging_v9_mysql.php columns
      - name: Phase 9 duplicate-store boundary
        run: php scripts/validate_creator_campaign_messaging_v9_mysql.php boundaries
      - name: Phase 9 Creator center access
        run: php scripts/validate_creator_campaign_messaging_v9_mysql.php creator_access
      - name: Existing message delivery database bridges
        run: php scripts/validate_message_delivery_bridges.php
