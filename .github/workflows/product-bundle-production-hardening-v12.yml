name: Product Bundle Production Hardening v12
on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'database/20260720_product_bundle_production_hardening_v12.sql'
      - 'api/bundles/_provider_reversal.php'
      - 'scripts/process_bundle_provider_reversals.php'
      - 'api/admin/bundle-production-hardening.php'
      - 'admin/bundle-production-hardening.php'
      - 'tests/phpunit/ProductBundleProductionHardeningV12ContractTest.php'
      - 'config/migrations.php'
      - '.github/workflows/product-bundle-production-hardening-v12.yml'
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2','8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', tools: composer}
      - name: PHP syntax
        run: |
          php -l api/bundles/_provider_reversal.php
          php -l scripts/process_bundle_provider_reversals.php
          php -l api/admin/bundle-production-hardening.php
          php -l admin/bundle-production-hardening.php
          php -l tests/phpunit/ProductBundleProductionHardeningV12ContractTest.php
      - name: Contract test
        run: |
          if [ -x vendor/bin/phpunit ]; then vendor/bin/phpunit tests/phpunit/ProductBundleProductionHardeningV12ContractTest.php; else echo 'PHPUnit unavailable; source guards completed.'; fi
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Safety gates
        run: |
          grep -q "PHP_SAPI !== 'cli'" scripts/process_bundle_provider_reversals.php
          grep -q 'MG_BUNDLE_REVERSAL_DISPATCH_ENABLED' api/bundles/_provider_reversal.php
          grep -q 'MG_BUNDLE_REVERSAL_LIVE_ENABLED' api/bundles/_provider_reversal.php
