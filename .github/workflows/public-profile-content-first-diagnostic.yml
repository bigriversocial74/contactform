name: Public Profile Content First Diagnostic

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - '.github/workflows/public-profile-content-first-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Capture validator output
        id: validator
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php scripts/validate_public_profile_content_first.php 2>&1 | tee public-profile-content-first-diagnostic.log
      - uses: actions/upload-artifact@v4
        with:
          name: public-profile-content-first-diagnostic
          path: public-profile-content-first-diagnostic.log
          if-no-files-found: error
      - name: Enforce result
        if: steps.validator.outcome != 'success'
        run: exit 1
