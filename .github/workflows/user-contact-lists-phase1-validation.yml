name: User Contact Lists Phase 1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'lists.php'
      - 'list.php'
      - 'api/user-lists/**'
      - 'api/user-contacts/**'
      - 'includes/user-contact-lists.php'
      - 'includes/user-contact-search.php'
      - 'includes/header-components/app-header.php'
      - 'includes/header-components/create-list-extension.php'
      - 'includes/header-templates/logged-in.php'
      - 'includes/agent-workspace.php'
      - 'assets/js/agent-workspace.js'
      - 'assets/js/user-lists.js'
      - 'assets/js/create-list-extension.js'
      - 'assets/css/user-lists.css'
      - 'database/20260714_user_contact_lists_phase1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_user_contact_lists_phase1.php'
      - 'tests/phpunit/UserContactListsFoundationTest.php'
      - 'tests/phpunit/AgentHeaderTabBehaviorTest.php'
      - '.github/workflows/user-contact-lists-phase1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, pdo, pdo_mysql, openssl

      - name: PHP syntax
        run: |
          php -l lists.php
          php -l list.php
          php -l includes/user-contact-lists.php
          php -l includes/user-contact-search.php
          php -l includes/header-components/app-header.php
          php -l includes/header-components/create-list-extension.php
          php -l includes/header-templates/logged-in.php
          php -l api/user-lists/_bootstrap.php
          php -l api/user-lists/index.php
          php -l api/user-lists/create.php
          php -l api/user-lists/item.php
          php -l api/user-lists/search-contacts.php
          php -l api/user-lists/add-contact.php
          php -l api/user-lists/remove-contact.php
          php -l api/user-contacts/create.php
          php -l scripts/validate_user_contact_lists_phase1.php
          php -l tests/phpunit/UserContactListsFoundationTest.php
          php -l tests/phpunit/AgentHeaderTabBehaviorTest.php
          php -l config/migrations.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/agent-workspace.js
          node --check assets/js/user-lists.js
          node --check assets/js/create-list-extension.js

      - name: User Contact Lists Phase 1 contract
        run: php scripts/validate_user_contact_lists_phase1.php

      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
