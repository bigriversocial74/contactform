name: Apply homepage main header footer

on:
  push:
    branches:
      - fix/homepage-main-header-footer-v1-20260718
    paths:
      - .github/workflows/apply-homepage-main-shell.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-main-header-footer-v1-20260718
          fetch-depth: 0
      - name: Integrate shared Microgifter shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.php')
          css_path = Path('assets/css/homepage-parallax-exact-v2.css')
          validator_path = Path('scripts/validate_homepage_redesign_foundation.php')
          workflow_path = Path('.github/workflows/apply-homepage-main-shell.yml')

          index = index_path.read_text()
          css = css_path.read_text()

          start = index.index('    <section class="hero-scroll"')
          end = index.index('    <footer class="site-footer">')
          content = index[start:end]
          content = re.sub(r'\n\s*<header class="os-bar">.*?</header>\s*\n', '\n', content, count=1, flags=re.S)
          content = content.strip('\n')

          php_top = '''<?php
          declare(strict_types=1);

          $page_title = 'Microgifter — Customer Relationship Agent';
          $page_section = 'public';
          $header_mode = 'public';
          $page_body_class = 'mg-homepage-exact-v2';
          $page_styles = [
              '/assets/css/public-header-footer-fixes.css',
              '/assets/css/public-dark-shell.css',
              '/assets/css/public-header-cleanup.css',
              '/assets/css/homepage-parallax-exact-v2.css?v=2.1.0',
          ];
          $page_scripts = [
              '/assets/js/homepage-parallax-exact-v2.js?v=2.0.0',
          ];
          $page_meta = [
              'description' => 'Microgifter personal social gifting and customer service agent.',
              'canonical' => 'https://microgifter.com/index.php',
              'og_title' => 'Microgifter — Customer Relationship Agent',
              'og_description' => 'One intelligent relationship system for social gifting, customer service, loyalty, and post-purchase commerce.',
          ];
          $page_manifest = [
              'id' => 'index',
              'title' => $page_title,
              'section' => $page_section,
              'header_mode' => $header_mode,
              'body_class' => $page_body_class,
              'styles' => $page_styles,
              'scripts' => $page_scripts,
              'onboarding' => [
                  'enabled' => false,
                  'page' => 'home',
                  'sections' => [],
              ],
          ];

          header('Cache-Control: public, max-age=300, stale-while-revalidate=600');
          require __DIR__ . '/includes/header.php';
          ?>
          <div class="homepage-exact-v2" data-homepage-exact-v2>
          '''
          php_bottom = '''
          </div>
          <?php require __DIR__ . '/includes/footer.php'; ?>
          '''
          index_path.write_text(php_top + content + php_bottom)

          css = css.replace(':root {', '.homepage-exact-v2 {', 1)
          css = css.replace('* { box-sizing: border-box; }', '.homepage-exact-v2, .homepage-exact-v2 * { box-sizing: border-box; }', 1)
          css = css.replace('body {\n  margin: 0;\n  color: var(--ink);\n  background: #edf0f4;\n  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  -webkit-font-smoothing: antialiased;\n}', '.homepage-exact-v2 {\n  color: var(--ink);\n  background: #edf0f4;\n  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  -webkit-font-smoothing: antialiased;\n}\nbody.mg-homepage-exact-v2 .mg-main {\n  width: 100%;\n  max-width: none;\n  margin: 0;\n  padding: 0;\n  background: #edf0f4 !important;\n  color: #20242b !important;\n  overflow: visible;\n}', 1)
          css = css.replace('a { color: inherit; text-decoration: none; }', '.homepage-exact-v2 a { color: inherit; text-decoration: none; }', 1)
          css = css.replace('.brand { font-size:', '.homepage-exact-v2 .brand { font-size:', 1)
          css = css.replace('h1, h2 {', '.homepage-exact-v2 h1, .homepage-exact-v2 h2 {')
          css = re.sub(r'(?m)^h1 \{', '.homepage-exact-v2 h1 {', css)
          css = css.replace('  top: 0;\n  height: 100vh;', '  top: 72px;\n  height: calc(100vh - 72px);', 1)
          css = css.replace('.scene { position: absolute; inset: 72px 0 0;', '.scene { position: absolute; inset: 0;', 1)
          css = css.replace('  .scene { inset: 62px 0 0; }', '  .scene { inset: 0; }', 1)

          anchor_css = '''
          body.mg-homepage-exact-v2 #hero,
          body.mg-homepage-exact-v2 #relationship-system,
          body.mg-homepage-exact-v2 #agent-in-action,
          body.mg-homepage-exact-v2 #pppm-presentation,
          body.mg-homepage-exact-v2 #get-started {
            scroll-margin-top: 84px;
          }
          @media (max-width: 760px) {
            .hero-sticky {
              top: 64px;
              height: calc(100vh - 64px);
            }
            body.mg-homepage-exact-v2 #hero,
            body.mg-homepage-exact-v2 #relationship-system,
            body.mg-homepage-exact-v2 #agent-in-action,
            body.mg-homepage-exact-v2 #pppm-presentation,
            body.mg-homepage-exact-v2 #get-started {
              scroll-margin-top: 74px;
            }
          }
          '''
          css = css.replace('@media (prefers-reduced-motion: reduce) {', anchor_css + '\n@media (prefers-reduced-motion: reduce) {', 1)
          css_path.write_text(css)

          validator_path.write_text('''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__);
          $indexPath = $root . '/index.php';
          $merchantPath = $root . '/merchant-landing.php';

          if (!is_file($indexPath) || !is_file($merchantPath)) {
              fwrite(STDERR, "Homepage files are missing.\\n");
              exit(1);
          }

          $index = (string) file_get_contents($indexPath);
          $merchant = (string) file_get_contents($merchantPath);

          $checks = [
              'index shared header' => str_contains($index, "require __DIR__ . '/includes/header.php'"),
              'index shared footer' => str_contains($index, "require __DIR__ . '/includes/footer.php'"),
              'index page manifest' => str_contains($index, "'id' => 'index'") && str_contains($index, "'header_mode' => $header_mode"),
              'index exact homepage shell' => str_contains($index, 'class="homepage-exact-v2"') && str_contains($index, 'class="hero-scroll"') && str_contains($index, 'class="scene" id="scene"'),
              'index exact stylesheet' => str_contains($index, '/assets/css/homepage-parallax-exact-v2.css'),
              'index exact javascript' => str_contains($index, '/assets/js/homepage-parallax-exact-v2.js'),
              'index foreground image' => str_contains($index, '/assets/images/foreground.png'),
              'index mountains image' => str_contains($index, '/assets/images/mountains.png'),
              'index orb image' => str_contains($index, '/assets/images/orb.png'),
              'index no duplicate document shell' => !str_contains($index, '<!doctype html>') && !str_contains($index, '<body>'),
              'index no duplicate demo header' => !str_contains($index, 'class="os-bar"'),
              'index no duplicate demo footer' => !str_contains($index, 'class="site-footer"'),
              'index no superseded v1 assets' => !str_contains($index, 'homepage-parallax-agent-v1.css') && !str_contains($index, 'homepage-parallax-agent-v1.js'),
              'index no placeholder root' => !str_contains($index, 'data-homepage-redesign-root'),
              'index no merchant shell' => !str_contains($index, 'class="mg-lb-home"'),
              'index no merchant stylesheet' => !str_contains($index, 'homepage-local-business-v1.css'),
              'merchant shell' => str_contains($merchant, 'class="mg-lb-home"'),
              'merchant business section' => str_contains($merchant, 'id="businesses"'),
              'merchant workflow section' => str_contains($merchant, 'id="how-it-works"'),
              'merchant rewards section' => str_contains($merchant, 'id="rewards"'),
              'merchant CRM integration' => str_contains($merchant, 'includes/landing/homepage-crm-integrations.php'),
              'merchant stylesheet' => str_contains($merchant, 'homepage-local-business-v1.css'),
              'merchant shared header' => str_contains($merchant, "require __DIR__ . '/includes/header.php'"),
              'merchant shared footer' => str_contains($merchant, "require __DIR__ . '/includes/footer.php'"),
          ];

          $failed = [];
          foreach ($checks as $label => $passed) {
              if (!$passed) $failed[] = $label;
          }

          if ($failed !== []) {
              fwrite(STDERR, "Homepage foundation validation failed:\\n- " . implode("\\n- ", $failed) . "\\n");
              exit(1);
          }

          echo 'Homepage foundation validation passed (' . count($checks) . " checks).\\n";
          ''')

          workflow_path.unlink()
          PY

          php -l index.php
          php -l scripts/validate_homepage_redesign_foundation.php
          node --check assets/js/homepage-parallax-exact-v2.js
          php scripts/validate_homepage_redesign_foundation.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate main Microgifter header and footer"
          git push origin HEAD:fix/homepage-main-header-footer-v1-20260718
