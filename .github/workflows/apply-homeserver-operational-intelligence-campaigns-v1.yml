name: Apply HomeServer operational intelligence campaigns v1

# Temporary focused integrator; removed before final validation.
on:
  push:
    branches:
      - feature/homeserver-operational-intelligence-campaigns-20260728
  pull_request:
    branches:
      - integration-from-repair-20260628
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeserver-operational-intelligence-campaigns-v1
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-operational-intelligence-campaigns-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, pdo, sodium
          coverage: none

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Apply deterministic integration
        shell: bash
        run: |
          set +e
          status=0
          if grep -Fq "function mg_homeserver_operational_catalog" api/homeserver/_operational_intelligence.php; then
            echo "HomeServer operational intelligence product integration is already present." > focused-integration.log
          else
            python scripts/fix-homeserver-operational-patcher.py > focused-integration.log 2>&1
            status=$?
            if [ $status -eq 0 ]; then
              python scripts/apply_homeserver_operational_intelligence_campaigns_v1.py >> focused-integration.log 2>&1
              status=$?
            fi
          fi
          if [ $status -eq 0 ]; then
            python scripts/fix-homeserver-campaign-management.py >> focused-integration.log 2>&1
            status=$?
          fi
          if [ $status -eq 0 ]; then
            python scripts/fix-homeserver-operational-cursors.py >> focused-integration.log 2>&1
            status=$?
          fi
          if [ $status -eq 0 ]; then
            python scripts/fix-homeserver-operational-cursor-validator.py >> focused-integration.log 2>&1
            status=$?
          fi
          if [ $status -eq 0 ]; then
            python scripts/fix-homeserver-authority-notice.py >> focused-integration.log 2>&1
            status=$?
          fi
          cat focused-integration.log
          exit $status

      - name: Validate provider contract and UI
        shell: bash
        run: |
          set +e
          {
            php -l api/homeserver/_homeserver.php
            php -l api/homeserver/_operational_intelligence.php
            php -l api/homeserver/operational-manifest.php
            php -l api/homeserver/operational-export.php
            php -l api/homeserver/operational-grants.php
            php -l api/homeserver/campaign-authorizations.php
            php -l api/homeserver/campaign-actions.php
            php -l includes/merchant-crm-campaign-send-service.php
            php -l api/merchant/crm-campaign-send.php
            php -l api/merchant/crm-send-reward-invite.php
            php -l account.php
            php -l includes/account/homeserver-view.php
            php -l config/migrations.php
            node --check assets/js/homeserver-intelligence-authority.js
            python scripts/validate_homeserver_operational_intelligence_v1.py
            php scripts/validate_merchant_crm_reporting_make_good_v1.php
            php scripts/validate_migration_manifest.php
          } > focused-validation.log 2>&1
          status=$?
          cat focused-validation.log
          exit $status

      - name: Commit integrated product files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No integration changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/homeserver/_homeserver.php api/homeserver/_operational_intelligence.php config/migrations.php api/merchant/crm-campaign-send.php api/merchant/crm-send-reward-invite.php assets/js/homeserver-intelligence-authority.js scripts/validate_homeserver_operational_intelligence_v1.py
          git commit -m "Integrate HomeServer operational intelligence and campaign authority"
          git push origin HEAD:feature/homeserver-operational-intelligence-campaigns-20260728

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeserver-operational-intelligence-focused
          path: |
            focused-integration.log
            focused-validation.log
          if-no-files-found: ignore
          retention-days: 7
