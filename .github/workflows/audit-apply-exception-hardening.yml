name: Audit Apply Exception Hardening

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - scripts/apply_repository_audit_exception_hardening.py
      - .github/workflows/audit-apply-exception-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717
          fetch-depth: 0

      - name: Apply exact exception-boundary transformations
        run: |
          set -o pipefail
          python3 scripts/apply_repository_audit_exception_hardening.py 2>&1 | tee /tmp/exception-hardening.log

      - name: Upload transformer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exception-hardening-diagnostics
          path: /tmp/exception-hardening.log
          if-no-files-found: error

      - name: Validate changed PHP files
        run: |
          git diff --name-only -- '*.php' | while IFS= read -r file; do
            [ -n "$file" ] && php -l "$file"
          done

      - name: Commit hardened endpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/admin api/ads api/auth api/catalog api/commerce api/me
          if git diff --cached --quiet; then
            echo 'No endpoint changes were required.'
            exit 0
          fi
          git commit -m 'Harden unexpected API exception responses'
          git push origin HEAD:audit/repository-production-hardening-20260717
