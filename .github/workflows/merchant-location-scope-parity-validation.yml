name: Merchant Location Scope Parity Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'api/merchant/locations.php'
      - 'api/catalog/_publish_distribution.php'
      - 'assets/js/merchant-workspace.js'
      - 'tests/phpunit/MerchantLocationsPageContractTest.php'
      - 'scripts/validate_merchant_location_scope_parity.php'
      - '.github/workflows/merchant-location-scope-parity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l api/merchant/locations.php
          php -l tests/phpunit/MerchantLocationsPageContractTest.php
          php -l scripts/validate_merchant_location_scope_parity.php

      - name: Merchant location scope parity contract
        run: php scripts/validate_merchant_location_scope_parity.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantLocationsPageContractTest.php tests/phpunit/MerchantClaimCodeConfigurationTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi
