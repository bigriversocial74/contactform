name: Sidebar Flat History and My Feed Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'design-calendar.php'
      - 'design-studio.php'
      - 'feed.php'
      - 'merchant-agent-chat.php'
      - 'saves.php'
      - 'api/public/feed.php'
      - 'api/public/_feed_resilient_v1.php'
      - 'api/public/_feed_contract_v2.php'
      - 'includes/agent-sidebar.php'
      - 'includes/gift-action-center.php'
      - 'includes/personal-agent-sidebar.php'
      - 'assets/js/personal-agent-chat-history.js'
      - 'assets/js/merchant-agent-sidebar-history.js'
      - 'assets/js/social-feed-sidebar-tabs.js'
      - 'assets/js/feed-contract-v2-bridge.js'
      - '.github/workflows/sidebar-flat-history-feed-load-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l agent.php
          php -l design-calendar.php
          php -l design-studio.php
          php -l feed.php
          php -l merchant-agent-chat.php
          php -l saves.php
          php -l api/public/feed.php
          php -l api/public/_feed_resilient_v1.php
          php -l api/public/_feed_contract_v2.php
          php -l includes/agent-sidebar.php
          php -l includes/gift-action-center.php
          php -l includes/personal-agent-sidebar.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/personal-agent-chat-history.js
          node --check assets/js/merchant-agent-sidebar-history.js
          node --check assets/js/social-feed-sidebar-tabs.js
          node --check assets/js/feed-contract-v2-bridge.js

      - name: Flat sidebar and My Feed contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E "groupLabel|Previous 7 days|mg-personal-chat-group" assets/js/personal-agent-chat-history.js assets/js/merchant-agent-sidebar-history.js
          ! grep -E "return 'Today'|return 'Yesterday'" assets/js/personal-agent-chat-history.js assets/js/merchant-agent-sidebar-history.js
          grep -F "state.threads.map" assets/js/personal-agent-chat-history.js
          grep -F "host.innerHTML = threads.map" assets/js/merchant-agent-sidebar-history.js
          grep -F 'href="/feed.php"' includes/personal-agent-sidebar.php
          grep -F "feedIsSettled" assets/js/social-feed-sidebar-tabs.js
          grep -F "MutationObserver" assets/js/social-feed-sidebar-tabs.js
          grep -F "mg_public_feed_resilient_v1" api/public/_feed_contract_v2.php api/public/_feed_resilient_v1.php
          grep -F "social.feed_post_skipped" api/public/_feed_resilient_v1.php
          grep -F "mg_public_feed_contract_v2" api/public/feed.php api/public/_feed_contract_v2.php
          grep -F '/assets/js/social-feed-sidebar-tabs.js?v=1.2.0' feed.php
          grep -F '/assets/js/feed-contract-v2-bridge.js?v=2.0.0' feed.php
          grep -F '/assets/js/personal-agent-chat-history.js?v=1.2.0' agent.php design-calendar.php design-studio.php saves.php includes/agent-sidebar.php includes/gift-action-center.php
          grep -F '/assets/js/merchant-agent-sidebar-history.js?v=2.1.0' merchant-agent-chat.php
