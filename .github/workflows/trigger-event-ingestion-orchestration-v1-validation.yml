name: Trigger Event Ingestion & Orchestration v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-canvas.php'
      - 'api/merchant-canvas/trigger-orchestration.php'
      - 'api/store/_canvas_trigger_orchestration.php'
      - 'api/store/_canvas_trigger_orchestration_rules.php'
      - 'api/store/_canvas_trigger_orchestration_runner.php'
      - 'api/public/campaigns/open.php'
      - 'api/catalog/public-product.php'
      - 'assets/js/public-campaign.js'
      - 'assets/js/merchant-canvas-trigger-orchestration.js'
      - 'scripts/run_trigger_event_orchestration_v1.php'
      - 'scripts/validate_trigger_event_ingestion_orchestration_v1.php'
      - 'database/trigger_event_ingestion_orchestration_v1.sql'
      - '.github/workflows/trigger-event-ingestion-orchestration-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-canvas.php
          php -l api/merchant-canvas/trigger-orchestration.php
          php -l api/store/_canvas_trigger_orchestration.php
          php -l api/store/_canvas_trigger_orchestration_rules.php
          php -l api/store/_canvas_trigger_orchestration_runner.php
          php -l api/public/campaigns/open.php
          php -l api/catalog/public-product.php
          php -l scripts/run_trigger_event_orchestration_v1.php
          php -l scripts/validate_trigger_event_ingestion_orchestration_v1.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/public-campaign.js
          node --check assets/js/merchant-canvas-trigger-orchestration.js

      - name: Ingestion and orchestration authority contract
        run: php scripts/validate_trigger_event_ingestion_orchestration_v1.php

      - name: Server trigger engine regression
        run: php scripts/validate_store_canvas_server_trigger_engine_v1.php

      - name: Stage 12 campaigns and rewards regression
        run: php scripts/validate_stage12_campaigns_reward_templates.php

      - name: Campaign public matrix regression
        run: php scripts/validate_campaign_public_matrix_v1.php

      - name: Store Canvas visual restoration regression
        run: php scripts/validate_store_canvas_visual_restoration_v1.php

      - name: Store Canvas movement continuity regression
        run: php scripts/validate_store_canvas_movement_continuity_v1.php

      - name: Store Canvas behavior memory regression
        run: php scripts/validate_store_canvas_behavior_memory_predictive_v1.php

      - name: Merchant Canvas production containment regression
        run: php scripts/validate_merchant_canvas_production_containment_v1.php
