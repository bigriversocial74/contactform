name: Task Agent Phase 4.6 Production QA v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'config/task_agent_phase4_release.php'
      - 'docs/TASK_AGENT_PHASE4_PRODUCTION_RUNBOOK.md'
      - 'docs/TASK_AGENT_PHASE4_6_SCORECARD.md'
      - 'tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php'
      - '.github/workflows/task-agent-phase4-6-production-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    name: validate (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l config/task_agent_phase4_release.php
          php -l includes/task-agent-recurring-programs.php
          php -l includes/task-agent-recurring-program-links.php
          php -l includes/task-agent-recurring-programs-router.php
          php -l includes/task-agent-group-gifts.php
          php -l includes/task-agent-group-gifts-router.php
          php -l includes/task-agent-program-coordination.php
          php -l includes/task-agent-program-coordination-router.php
          php -l includes/task-agent-policy-approvals.php
          php -l includes/task-agent-policy-approvals-router.php
          php -l includes/task-agent-monitoring.php
          php -l includes/task-agent-monitoring-router.php
          php -l api/agents/runtime.php
          php -l agent.php
          php -l tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php
          php -l tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/task-agent-recurring-programs-runtime.js
          node --check assets/js/task-agent-group-gifts-runtime.js
          node --check assets/js/task-agent-program-coordination-runtime.js
          node --check assets/js/task-agent-policy-approvals-runtime.js
          node --check assets/js/task-agent-monitoring-runtime.js
      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Phase 4.6 production QA contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php
      - name: Phase 4.6 safety boundary contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php
      - name: Phase 4.5 monitoring regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase45MonitoringPreparationV1ContractTest.php
      - name: Phase 4.4 rules and approvals regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase44RulesBudgetsApprovalsV1ContractTest.php
      - name: Phase 4.3 workplace and community regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase43WorkplaceCommunityProgramsV1ContractTest.php
      - name: Phase 4.2 group gifting regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php
      - name: Phase 4.1 recurring regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php
      - name: Phase 3 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php
      - name: Phase 2 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
      - name: Approval center regression
        run: vendor/bin/phpunit tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php
      - name: Action Center regression
        run: vendor/bin/phpunit tests/phpunit/ActionCenterContractV2Test.php
      - name: Purchase issuance regression
        run: vendor/bin/phpunit tests/phpunit/PostCheckoutMicrogiftIssuanceContractTest.php
      - name: Order confirmation regression
        run: vendor/bin/phpunit tests/phpunit/CheckoutSuccessOrderConfirmationContractTest.php
