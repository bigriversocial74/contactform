name: Subscription Agent Access v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'account-subscriptions.php'
      - 'agent.php'
      - 'merchant-agent-chat.php'
      - 'assets/css/subscription-agent-access-v1.css'
      - 'assets/js/subscription-agent-access-v1.js'
      - 'scripts/validate_subscription_agent_access_v1.php'
      - 'tests/phpunit/SubscriptionAgentAccessV1Test.php'
      - '.github/workflows/subscription-agent-access-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l account-subscriptions.php
          php -l agent.php
          php -l merchant-agent-chat.php
          php -l scripts/validate_subscription_agent_access_v1.php
          php -l tests/phpunit/SubscriptionAgentAccessV1Test.php

      - name: JavaScript syntax
        run: node --check assets/js/subscription-agent-access-v1.js

      - name: Agent subscription access contract
        run: php scripts/validate_subscription_agent_access_v1.php

      - name: Existing account subscription authority regression
        run: |
          if [ -f scripts/validate_account_subscription_authority.php ]; then
            php scripts/validate_account_subscription_authority.php
          fi

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/SubscriptionAgentAccessV1Test.php
          fi
