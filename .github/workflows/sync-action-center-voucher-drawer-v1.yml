name: Sync Action Center Voucher Drawer v1

on:
  push:
    branches:
      - feature/action-center-voucher-drawer-folder-ui-v1-20260717
    paths:
      - .github/workflows/sync-action-center-voucher-drawer-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-action-center-voucher-drawer-v1
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out voucher drawer branch
        uses: actions/checkout@v4
        with:
          ref: feature/action-center-voucher-drawer-folder-ui-v1-20260717
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge current integration and resolve known include
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin integration-from-repair-20260628

          set +e
          git merge --no-commit --no-ff origin/integration-from-repair-20260628
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for conflict in "${conflicts[@]}"; do
            if [ "$conflict" != 'includes/gift-action-center.php' ]; then
              echo "Unexpected merge conflict: $conflict" >&2
              exit 1
            fi
          done

          if [ ${#conflicts[@]} -gt 0 ]; then
            git checkout --theirs includes/gift-action-center.php
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/gift-action-center.php')
          text = path.read_text()

          css_anchor = '<link rel="stylesheet" href="/assets/css/gift-action-center-runtime-v4.css?v=4.0.1">\n'
          css_line = '<link rel="stylesheet" href="/assets/css/gift-action-center-voucher-drawer-v1.css?v=1.0.0">\n'
          if css_line not in text:
              if css_anchor not in text:
                  raise SystemExit('Runtime v4 stylesheet anchor is missing.')
              text = text.replace(css_anchor, css_anchor + css_line, 1)

          replacements = {
              'aria-label="Loaded PPPM content"': 'aria-label="Voucher details"',
              '<span class="mg-account-eyebrow">Loaded PPPM content</span>': '<span class="mg-account-eyebrow">Voucher details</span>',
              'aria-label="Close loaded content"': 'aria-label="Close voucher details"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          js_anchor = '<script src="/assets/js/gift-action-center-runtime-v4.js?v=4.0.0" defer></script>\n'
          js_line = '<script src="/assets/js/gift-action-center-voucher-drawer-v1.js?v=1.0.0" defer></script>\n'
          if js_line not in text:
              if js_anchor not in text:
                  raise SystemExit('Runtime v4 script anchor is missing.')
              text = text.replace(js_anchor, js_anchor + js_line, 1)

          required = [
              'gift-action-center-actions.js?v=2.0.0',
              'data-user-profile-search placeholder="Search users"',
              'gift-action-center-user-search-v2.js?v=2.0.0',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Merged include lost required integration markers: ' + ', '.join(missing))

          path.write_text(text)
          PY

          git add includes/gift-action-center.php
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            exit 1
          fi

          if [ "$merge_status" -ne 0 ] && [ ${#conflicts[@]} -eq 0 ]; then
            echo 'Integration merge failed without a resolvable include conflict.' >&2
            exit 1
          fi

      - name: Validate synchronized drawer
        shell: bash
        run: |
          set -euo pipefail
          php -l api/account/action-center-voucher-detail.php
          php -l includes/gift-action-center.php
          php -l scripts/validate_action_center_voucher_drawer_folder_ui_v1.php
          node --check assets/js/gift-action-center-voucher-drawer-v1.js
          node --check assets/js/gift-action-center-runtime-v4.js
          node --check assets/js/gift-action-center-actions.js
          php scripts/validate_action_center_voucher_drawer_folder_ui_v1.php
          git diff --check

      - name: Commit synchronized branch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-action-center-voucher-drawer-v1.yml
          git add -A
          git commit -m 'Synchronize voucher drawer with current integration'
          git push origin HEAD:feature/action-center-voucher-drawer-folder-ui-v1-20260717
