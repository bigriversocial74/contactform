name: Public Donations Production QA Diagnostic

on:
  pull_request:
    branches:
      - integration-from-repair-20260628

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpunit
      - name: Capture PHPUnit output
        run: |
          set +e
          phpunit --testdox tests/phpunit/PublicDonationsProductionQaContractTest.php > phpunit-output.txt 2>&1
          code=$?
          echo "$code" > phpunit-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-phpunit-output
          path: |
            phpunit-output.txt
            phpunit-exit-code.txt
