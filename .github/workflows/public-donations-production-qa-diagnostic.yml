name: Public Donations Production QA Diagnostic

on:
  pull_request:
    branches:
      - integration-from-repair-20260628

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpunit
      - run: phpunit --testdox tests/phpunit/PublicDonationsProductionQaContractTest.php
