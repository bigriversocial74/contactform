name: Homepage Source Validation

on:
  push:
    branches:
      - snapshot-current-homepage-20260718
    paths:
      - '.github/workflows/homepage-source-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: zip -qr source.zip . -x '.git/*' 'source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-source
          path: source.zip
          retention-days: 1
      - name: Record workflow run
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .homepage-source-run-id
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .homepage-source-run-id
          git commit -m "Record homepage source run" || exit 0
          git push origin HEAD:snapshot-current-homepage-20260718
