name: Campaign System Repair v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - includes/campaign-types.php
      - includes/header-templates/create-menu.php
      - api/merchant/campaigns.php
      - api/public/campaigns/**
      - api/account/action-center.php
      - assets/js/create-center-inline.js
      - assets/js/gift-action-center.js
      - assets/css/public-campaign-layout-cleanup-v1.css
      - scripts/validate_campaign_system_repair_v1.php
      - .github/workflows/campaign-system-repair-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: PHP ${{ matrix.php }} campaign matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l includes/header-templates/create-menu.php
          php -l api/account/action-center.php
          php -l api/public/campaigns/listen-progress.php
          php -l api/public/campaigns/watch-progress-v2.php
          php -l api/public/campaigns/_media_progress_v2.php
          php -l scripts/validate_campaign_system_repair_v1.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/create-center-inline.js
          node --check assets/js/gift-action-center.js
          node --check assets/js/public-listen-music-reward.js

      - name: Certify all 16 campaign types
        run: php scripts/validate_campaign_system_repair_v1.php
