name: Merchant Community Support Diagnostics

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'scripts/test_merchant_community_support_mysql.php'
      - 'includes/merchant-community-support.php'
      - '.github/workflows/merchant-community-support-diagnostics.yml'

permissions:
  contents: read

jobs:
  mysql-diagnostic:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: microgifter_phase6
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: microgifter_phase6
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql,mbstring
      - name: Run lifecycle diagnostic
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php scripts/test_merchant_community_support_mysql.php 2>&1 | tee phase6-mysql.log
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-community-support-mysql-diagnostic
          path: phase6-mysql.log
          if-no-files-found: error
      - name: Enforce lifecycle result
        if: steps.lifecycle.outcome != 'success'
        run: exit 1
