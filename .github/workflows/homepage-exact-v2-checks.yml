name: Homepage public landing checks

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - index.php
      - includes/footer.php
      - includes/header-components/public-header.php
      - assets/css/homepage-saas-*.css
      - assets/css/universal-footer.css
      - assets/images/home/microgifter-home-*.svg
      - tests/phpunit/HomepageSaasV1ContractTest.php
      - scripts/validate_homepage_redesign_foundation.php
      - scripts/validate_public_site_local_business_v1.php
      - .github/workflows/homepage-exact-v2-checks.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate public homepage
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          php -l includes/footer.php
          php -l includes/header-components/public-header.php
          php -l scripts/validate_homepage_redesign_foundation.php
          php -l scripts/validate_public_site_local_business_v1.php
          php -l tests/phpunit/HomepageSaasV1ContractTest.php
          php scripts/validate_homepage_redesign_foundation.php
          vendor/bin/phpunit --configuration phpunit.xml.dist tests/phpunit/HomepageSaasV1ContractTest.php
          test -s assets/images/home/microgifter-home-desktop-dashboard.svg
          test -s assets/images/home/microgifter-home-phone.svg
          grep -q '/assets/images/home/microgifter-home-desktop-dashboard.svg' index.php
          grep -q '/assets/images/home/microgifter-home-phone.svg' index.php
          grep -q '/assets/css/homepage-saas-v1.css' index.php
          grep -q 'Microgifting. Big Impact.' index.php
          grep -q 'Everything you need to grow with gifting.' index.php
          grep -q 'Drive more sales with gift certificates.' index.php
          grep -q 'Reward, recognize, and retain top talent.' index.php
          grep -q 'One platform. Endless possibilities.' index.php
          grep -q 'Coming soon' index.php
          grep -q 'Gusto' index.php
          grep -q 'Square' index.php
          grep -q 'Toast' index.php
          grep -q 'Other POS Systems' index.php
          ! grep -q 'Build relationships with Microgifter CRM' index.php
          ! grep -q 'mg_render_public_pricing_cards(' index.php
          ! grep -q "require_once __DIR__ . '/includes/pricing-cards.php'" index.php
          grep -q "require __DIR__ . '/includes/header.php'" index.php
          grep -q "require __DIR__ . '/includes/footer.php'" index.php
          grep -q 'overflow-x:clip!important' assets/css/universal-footer.css
          grep -q 'font-weight:500!important' assets/css/universal-footer.css
          ! grep -q 'pricingGrid.replaceChildren' includes/footer.php
          ! grep -q 'mg-homepage-live-pricing' includes/footer.php
