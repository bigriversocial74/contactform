name: Homepage exact v2 checks

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - index.php
      - includes/footer.php
      - assets/css/homepage-parallax-exact-v2.css
      - assets/css/universal-footer.css
      - assets/js/homepage-parallax-exact-v2.js
      - assets/images/foreground.png
      - assets/images/mountains.png
      - assets/images/orb.png
      - .github/workflows/homepage-exact-v2-checks.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage files
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          php -l includes/footer.php
          node --check assets/js/homepage-parallax-exact-v2.js
          test -s assets/images/foreground.png
          test -s assets/images/mountains.png
          test -s assets/images/orb.png
          grep -q '/assets/images/foreground.png' index.php
          grep -q '/assets/images/mountains.png' index.php
          grep -q '/assets/images/orb.png' index.php
          grep -q '/assets/css/homepage-parallax-exact-v2.css' index.php
          grep -q '/assets/js/homepage-parallax-exact-v2.js' index.php
          grep -q 'body.mg-homepage-exact-v2' assets/css/universal-footer.css
          grep -q 'overflow-x:clip!important' assets/css/universal-footer.css
          grep -q 'The Future of Gifting Has Arrived.' includes/footer.php
          grep -q 'mg-home-header-past-hero' includes/footer.php
          grep -q 'hero.getBoundingClientRect().bottom <= 0' includes/footer.php
          grep -q '/merchant-landing.php' assets/css/universal-footer.css
          grep -q '/featured-case-studies.php' assets/css/universal-footer.css
          grep -q 'font-weight:500!important' assets/css/universal-footer.css
