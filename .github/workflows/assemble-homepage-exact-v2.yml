name: Inspect Homepage Package Payload

on:
  push:
    branches:
      - fix/homepage-exact-zip-index-integration-v3-20260718
    paths:
      - '.github/workflows/assemble-homepage-exact-v2.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-exact-zip-index-integration-v3-20260718
          fetch-depth: 0
      - name: Decode and inspect staged image payloads
        run: |
          set -euo pipefail
          mkdir -p /tmp/homepage-payload
          cat .homepage-build/foreground.webp.b64.* | base64 --decode > /tmp/homepage-payload/foreground.bin
          cat .homepage-build/mountains.webp.b64.* | base64 --decode > /tmp/homepage-payload/mountains.bin
          cat .homepage-build/orb.webp.b64.* | base64 --decode > /tmp/homepage-payload/orb.bin
          {
            file /tmp/homepage-payload/*.bin
            sha256sum /tmp/homepage-payload/*.bin
            wc -c /tmp/homepage-payload/*.bin
            python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('/tmp/homepage-payload').glob('*.bin')):
              data = path.read_bytes()
              kind = 'PNG' if data.startswith(b'\x89PNG\r\n\x1a\n') else ('WEBP' if data[:4] == b'RIFF' and data[8:12] == b'WEBP' else 'UNKNOWN')
              print(f'{path.name}: magic={kind}')
          PY
          } > .homepage-build/diagnostic.txt
      - name: Commit diagnostic only
        run: |
          rm -f .github/workflows/assemble-homepage-exact-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Inspect staged homepage image payloads'
          git push origin HEAD:fix/homepage-exact-zip-index-integration-v3-20260718
