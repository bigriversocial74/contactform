name: Assemble Exact Uploaded Homepage

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  assemble:
    if: github.head_ref == 'fix/homepage-exact-zip-index-integration-v3-20260718'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-exact-zip-index-integration-v3-20260718
          fetch-depth: 0

      - name: Assemble uploaded demo files
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          exec > >(tee .homepage-build/assembly.log) 2>&1
          set -x
          test -f .homepage-build/.ready
          mkdir -p assets/css assets/js assets/images/homepage-parallax-exact-v2

          cat .homepage-build/index.php.gz.b64.* | base64 --decode | gzip --decompress > index.php
          cat .homepage-build/styles.css.gz.b64.* | base64 --decode | gzip --decompress > assets/css/homepage-parallax-exact-v2.css
          cat .homepage-build/app.js.gz.b64.* | base64 --decode | gzip --decompress > assets/js/homepage-parallax-exact-v2.js

          cat .homepage-build/foreground.webp.b64.* | base64 --decode > assets/images/homepage-parallax-exact-v2/foreground.webp
          cat .homepage-build/mountains.webp.b64.* | base64 --decode > assets/images/homepage-parallax-exact-v2/mountains.webp
          cat .homepage-build/orb.webp.b64.* | base64 --decode --ignore-garbage > assets/images/homepage-parallax-exact-v2/orb.webp

          sed -i 's/foreground\.png/foreground.webp/g; s/mountains\.png/mountains.webp/g; s/orb\.png/orb.webp/g' index.php assets/css/homepage-parallax-exact-v2.css

          php -l index.php
          node --check assets/js/homepage-parallax-exact-v2.js
          file assets/images/homepage-parallax-exact-v2/*.webp | tee /tmp/homepage-file-types.txt
          test "$(grep -c 'Web/P image' /tmp/homepage-file-types.txt)" -eq 3
          wc -c index.php assets/css/homepage-parallax-exact-v2.css assets/js/homepage-parallax-exact-v2.js assets/images/homepage-parallax-exact-v2/*.webp

      - name: Commit diagnostic
        if: steps.assemble.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .homepage-build/assembly.log
          git commit -m 'Record homepage assembly failure'
          git push origin HEAD:fix/homepage-exact-zip-index-integration-v3-20260718
          exit 1

      - name: Commit production files
        if: steps.assemble.outcome == 'success'
        run: |
          rm -rf .homepage-build
          rm -f .github/workflows/assemble-homepage-exact-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate exact uploaded homepage demo into index.php'
          git push origin HEAD:fix/homepage-exact-zip-index-integration-v3-20260718
