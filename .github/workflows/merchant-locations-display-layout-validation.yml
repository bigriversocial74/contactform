name: Merchant Locations Display and Layout Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-locations.php'
      - 'includes/merchant-locations-view.php'
      - 'api/merchant/locations.php'
      - 'assets/css/merchant-locations-redemption.css'
      - 'assets/js/merchant-locations-tabs.js'
      - 'tests/phpunit/MerchantLocationsPageContractTest.php'
      - 'scripts/validate_merchant_locations_display_layout.php'
      - '.github/workflows/merchant-locations-display-layout-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-locations.php
          php -l includes/merchant-locations-view.php
          php -l api/merchant/locations.php
          php -l tests/phpunit/MerchantLocationsPageContractTest.php
          php -l scripts/validate_merchant_locations_display_layout.php

      - name: JavaScript syntax
        run: node --check assets/js/merchant-locations-tabs.js

      - name: Merchant locations display and layout contract
        run: php scripts/validate_merchant_locations_display_layout.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantLocationsPageContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi
