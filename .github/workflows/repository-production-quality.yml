name: Repository Production Quality

on:
  pull_request:
  push:
    branches:
      - audit/repository-production-hardening-20260717
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-production-quality-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php-version }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run 100-point production quality gate
        run: php scripts/audit_repository_production_quality.php --gate

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-production-audit-php-${{ matrix.php-version }}
          path: |
            build/repository-production-audit.json
            build/repository-production-audit.md
          if-no-files-found: error
