name: Creator Campaign MCP Bounded Playbooks v13D

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'api/internal/_mcp_creator_campaign_playbook_bridge.php'
      - 'api/internal/mcp-bridge.php'
      - 'includes/mcp-creator-campaign-playbooks/**'
      - 'includes/mcp-creator-campaign-playbooks.php'
      - 'includes/mcp-automations/bootstrap.php'
      - 'includes/mcp-automations/definitions.php'
      - 'includes/mcp-automations/definitions-repository.php'
      - 'includes/mcp-automations/definitions-page-view.php'
      - 'includes/mcp-drafts/account-page-phase3b-view.php'
      - 'services/mcp/src/bridge/canonicalBridge.ts'
      - 'services/mcp/src/tools/creatorCampaignPlaybooks.ts'
      - 'services/mcp/src/tools/registry.ts'
      - 'services/mcp/tests/creatorCampaignPlaybooks.test.mjs'
      - 'database/20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install.sql'
      - 'scripts/validate_creator_campaign_mcp_v13d.php'
      - 'tests/phpunit/CreatorCampaignMcpBoundedPlaybooksV13dContractTest.php'
      - 'docs/creator-campaigns/CREATOR_CAMPAIGN_PHASE13D_MCP_BOUNDED_PLAYBOOKS.md'
      - '.github/workflows/creator-campaign-mcp-bounded-playbooks-v13d.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-mcp-bounded-playbooks-v13d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2', '8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: services/mcp/package-lock.json}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefix services/mcp
      - name: PHP syntax
        run: |
          php -l api/internal/_mcp_creator_campaign_playbook_bridge.php
          php -l api/internal/mcp-bridge.php
          php -l includes/mcp-creator-campaign-playbooks/bootstrap.php
          php -l includes/mcp-creator-campaign-playbooks/common.php
          php -l includes/mcp-creator-campaign-playbooks/campaign-preparation.php
          php -l includes/mcp-creator-campaign-playbooks/review-builders.php
          php -l includes/mcp-creator-campaign-playbooks/insight-builders.php
          php -l includes/mcp-creator-campaign-playbooks/service.php
          php -l includes/mcp-creator-campaign-playbooks.php
          php -l includes/mcp-automations/bootstrap.php
          php -l includes/mcp-automations/definitions.php
          php -l includes/mcp-automations/definitions-repository.php
          php -l includes/mcp-automations/definitions-page-view.php
          php -l includes/mcp-drafts/account-page-phase3b-view.php
          php -l scripts/validate_creator_campaign_mcp_v13d.php
          php -l tests/phpunit/CreatorCampaignMcpBoundedPlaybooksV13dContractTest.php
      - name: MCP TypeScript and Node contracts
        run: npm test --prefix services/mcp
      - name: Phase 13D score
        run: php scripts/validate_creator_campaign_mcp_v13d.php
      - name: Phase 13D PHPUnit
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignMcpBoundedPlaybooksV13dContractTest.php
      - name: Creator Campaign Phase 13 compatibility
        run: |
          php scripts/validate_creator_campaign_mcp_v13c.php
          php scripts/validate_creator_campaign_mcp_v13b.php
          php scripts/validate_creator_campaign_mcp_v13a.php
          php scripts/validate_creator_campaign_crm_v12.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignMcpCanonicalV13cContractTest.php tests/phpunit/CreatorCampaignMcpDraftV13bContractTest.php tests/phpunit/CreatorCampaignMcpReadV13aContractTest.php tests/phpunit/CreatorCampaignCrmV12ContractTest.php
      - name: MCP Phase 2 and 3 authority compatibility
        run: vendor/bin/phpunit tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php tests/phpunit/McpNativeDraftStatusPhase3cV1ContractTest.php
      - name: MCP Phase 4 automation compatibility
        run: |
          php scripts/validate_mcp_automation_grants_phase4a.php
          php scripts/validate_mcp_automation_definitions_phase4b.php
          vendor/bin/phpunit tests/phpunit/McpAutomationGrantsPhase4aV1ContractTest.php tests/phpunit/McpAutomationDefinitionsPhase4bV1ContractTest.php tests/phpunit/McpAutomationSchedulesPhase4cV1ContractTest.php tests/phpunit/McpAutomationOperationsPhase4dV1ContractTest.php
      - name: Migration compatibility
        run: php scripts/validate_migration_manifest.php

  scope-sql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Apply Phase 13D scopes
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install.sql
      - name: Verify bounded review scope contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog WHERE scope_key IN ('creator_campaign_playbooks:campaign_preparation','creator_campaign_playbooks:application_review','creator_campaign_playbooks:content_review','creator_campaign_playbooks:campaign_health','creator_campaign_playbooks:earnings_review','creator_campaign_playbooks:creator_outreach') AND operation_class='draft' AND active=1 AND grantable=1;")" = "6"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog WHERE scope_key LIKE 'creator_campaign_playbooks:%' AND operation_class IN ('approval_gated','bounded_auto','prohibited');")" = "0"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install';")" = "1"
      - name: Verify SQL idempotency
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install.sql
