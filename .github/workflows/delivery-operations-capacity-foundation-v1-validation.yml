name: Delivery Operations Capacity Foundation v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'includes/delivery-operations*.php'
      - 'api/communications/_communications.php'
      - 'api/admin/delivery-operations.php'
      - 'admin/delivery-operations.php'
      - 'bin/delivery-worker.php'
      - 'assets/js/delivery-operations.js'
      - 'assets/css/delivery-operations.css'
      - 'assets/css/modal-foundation.css'
      - 'assets/css/gift-action-center-modals.css'
      - 'includes/gift-action-center.php'
      - 'inbox.php'
      - 'claimed.php'
      - 'database/delivery_operations_capacity_foundation_v1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_delivery_operations_capacity_foundation_v1.php'
      - 'scripts/audit_delivery_operations_capacity_foundation_v1.php'
      - 'scripts/validate_delivery_communications_regression_v1.php'
      - 'scripts/validate_delivery_microgift_authority_regression_v1.php'
      - 'docs/delivery-operations-capacity-foundation-v1.md'
      - 'docs/audits/delivery-operations-capacity-foundation-v1-scorecard.md'
      - '.github/workflows/delivery-operations-capacity-foundation-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, pdo, pdo_mysql

      - name: PHP syntax
        run: |
          php -l includes/delivery-operations.php
          php -l includes/delivery-operations-config.php
          php -l includes/delivery-operations-adapters.php
          php -l includes/delivery-operations-worker.php
          php -l includes/delivery-operations-admin.php
          php -l api/communications/_communications.php
          php -l api/admin/delivery-operations.php
          php -l admin/delivery-operations.php
          php -l bin/delivery-worker.php
          php -l includes/gift-action-center.php
          php -l inbox.php
          php -l claimed.php
          php -l config/migrations.php
          php -l scripts/validate_delivery_operations_capacity_foundation_v1.php
          php -l scripts/audit_delivery_operations_capacity_foundation_v1.php
          php -l scripts/validate_delivery_communications_regression_v1.php
          php -l scripts/validate_delivery_microgift_authority_regression_v1.php

      - name: JavaScript syntax
        run: node --check assets/js/delivery-operations.js

      - name: Delivery operations ten-point contract
        run: php scripts/validate_delivery_operations_capacity_foundation_v1.php

      - name: Delivery operations scored quality audit
        run: php scripts/audit_delivery_operations_capacity_foundation_v1.php

      - name: Purchase-to-Microgift issuance regression
        run: php scripts/validate_purchase_microgift_issuance_v1.php

      - name: Merchant order delivery recovery regression
        run: php scripts/validate_merchant_orders_recovery_v1.php

      - name: Communication delivery compatibility regression
        run: php scripts/validate_delivery_communications_regression_v1.php

      - name: Microgift authority compatibility regression
        run: php scripts/validate_delivery_microgift_authority_regression_v1.php
