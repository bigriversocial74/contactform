name: Reward Drop Game v1

on:
  pull_request:
    paths:
      - 'games/reward-drop/**'
      - 'database/reward_drop_game_v1.sql'
      - 'config/migrations.php'
      - 'merchant-distribution.php'
      - 'includes/merchant-distribution-view.php'
      - 'assets/css/merchant-distribution-game.css'
      - 'scripts/validate_reward_drop_game_v1.php'
      - '.github/workflows/reward-drop-game-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l games/reward-drop/includes/bootstrap.php
          php -l games/reward-drop/index.php
          php -l games/reward-drop/api/link.php
          php -l games/reward-drop/api/start.php
          php -l games/reward-drop/api/complete.php
          php -l games/reward-drop/api/status.php
          php -l games/reward-drop/webhook.php
          php -l includes/merchant-distribution-view.php
          php -l merchant-distribution.php
          php -l config/migrations.php
          php -l scripts/validate_reward_drop_game_v1.php
      - name: JavaScript syntax
        run: node --check games/reward-drop/assets/game.js
      - name: Reward Drop production contract
        run: php scripts/validate_reward_drop_game_v1.php
