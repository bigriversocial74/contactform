name: Creator Campaign Production Pilot v14

on:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: creator-campaign-production-pilot-v14-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix: {php: ['8.2','8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: services/mcp/package-lock.json}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --prefix services/mcp
      - name: PHP syntax
        run: |
          php -l account-creator-campaign-pilot.php
          php -l includes/creator-campaign-pilot.php
          php -l includes/creator-campaign-pilot/runtime.php
          php -l includes/creator-campaign-pilot/bootstrap.php
          php -l includes/creator-campaign-pilot/repository.php
          php -l includes/creator-campaign-pilot/service.php
          php -l includes/creator-campaign-pilot/service-readiness.php
          php -l includes/creator-campaign-pilot/service-health.php
          php -l includes/creator-campaign-pilot/service-control.php
          php -l includes/creator-campaign-pilot/action-handoff.php
          php -l includes/creator-campaign-pilot/action-handoff-seed.php
          php -l includes/creator-campaign-pilot/action-handoff-service.php
          php -l includes/creator-campaign-pilot/page-view.php
          php -l includes/creator-campaign-pilot/page-view-runs.php
          php -l includes/creator-campaign-pilot/page-view-monitoring.php
          php -l api/internal/_mcp_creator_campaign_playbook_bridge.php
          php -l includes/mcp-automations/definitions-page-view.php
          php -l includes/mcp-drafts/account-page-phase3b-view.php
          php -l includes/mcp-creator-campaign-actions/owner-page-view.php
          php -l includes/agent-sidebar.php
          php -l scripts/validate_creator_campaign_pilot_v14.php
          php -l tests/phpunit/CreatorCampaignProductionPilotV14ContractTest.php
      - name: MCP TypeScript and Node compatibility
        run: npm test --prefix services/mcp
      - name: Phase 14 score
        run: php scripts/validate_creator_campaign_pilot_v14.php
      - name: Phase 14 PHPUnit
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignProductionPilotV14ContractTest.php
      - name: Creator Campaign Phase 12-13 compatibility
        run: |
          php scripts/validate_creator_campaign_mcp_v13d.php
          php scripts/validate_creator_campaign_mcp_v13c.php
          php scripts/validate_creator_campaign_mcp_v13b.php
          php scripts/validate_creator_campaign_mcp_v13a.php
          php scripts/validate_creator_campaign_crm_v12.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignMcpBoundedPlaybooksV13dContractTest.php tests/phpunit/CreatorCampaignMcpCanonicalV13cContractTest.php tests/phpunit/CreatorCampaignMcpDraftV13bContractTest.php tests/phpunit/CreatorCampaignMcpReadV13aContractTest.php tests/phpunit/CreatorCampaignCrmV12ContractTest.php
      - name: MCP authority and automation compatibility
        run: |
          php scripts/validate_mcp_automation_grants_phase4a.php
          php scripts/validate_mcp_automation_definitions_phase4b.php
          vendor/bin/phpunit tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php tests/phpunit/McpApprovedDraftConversionPhase3bV1ContractTest.php tests/phpunit/McpNativeDraftStatusPhase3cV1ContractTest.php tests/phpunit/McpAutomationGrantsPhase4aV1ContractTest.php tests/phpunit/McpAutomationDefinitionsPhase4bV1ContractTest.php tests/phpunit/McpAutomationSchedulesPhase4cV1ContractTest.php tests/phpunit/McpAutomationOperationsPhase4dV1ContractTest.php
      - name: Migration compatibility
        run: php scripts/validate_migration_manifest.php

  sql-lifecycle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: microgifter, MYSQL_USER: microgifter, MYSQL_PASSWORD: microgifter, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'json,mbstring,pdo,pdo_mysql', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: for attempt in {1..30}; do mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0; sleep 1; done; exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Apply Creator Campaign Phase 6 and 7 prerequisites
        run: |
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_compensation_earnings_v6_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_budget_controls_v7_single_install.sql
      - name: Apply Phase 13C and 13D
        run: |
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_canonical_actions_v13c_single_install.sql
          mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_mcp_bounded_playbooks_v13d_single_install.sql
      - name: Capture authority scope count
        run: mysql -N -B -h 127.0.0.1 -uroot -proot microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog;" > /tmp/scope-count-before
      - name: Apply Phase 14 operator migration
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_production_pilot_v14_single_install.sql
      - name: Verify operator schema and no authority elevation
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('creator_campaign_operator_pilots','creator_campaign_operator_events','creator_campaign_operator_handoffs');")" = "3"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260722_creator_campaign_production_pilot_v14_single_install';")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot microgifter -e "SELECT COUNT(*) FROM mcp_scope_catalog;")" = "$(cat /tmp/scope-count-before)"
      - name: Verify Phase 14 SQL idempotency
        run: mysql -h 127.0.0.1 -uroot -proot microgifter < database/20260722_creator_campaign_production_pilot_v14_single_install.sql
