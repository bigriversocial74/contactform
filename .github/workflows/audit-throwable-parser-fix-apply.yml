name: Audit Throwable Parser Fix Apply

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - scripts/fix_audit_throwable_type_parser.py
      - .github/workflows/audit-throwable-parser-fix-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply exact parser repair
        run: python3 scripts/fix_audit_throwable_type_parser.py

      - name: Validate parser and full 100-point gate
        run: |
          php -l scripts/audit_repository_production_quality_v2.php
          php scripts/audit_repository_production_quality.php --gate

      - name: Commit permanent parser repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_repository_production_quality_v2.php
          if git diff --cached --quiet; then
            echo 'No parser changes were required.'
            exit 0
          fi
          git commit -m 'Correct Throwable catch type parsing'
          git push origin HEAD:audit/repository-production-hardening-20260717
