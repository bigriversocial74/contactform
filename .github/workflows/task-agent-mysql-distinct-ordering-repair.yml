name: Task Agent MySQL DISTINCT Ordering Repair

on:
  pull_request:
    paths:
      - 'includes/task-agent-order-tracking.php'
      - 'tests/phpunit/TaskAgentPhase34PurchaseConfirmationPppmTrackingV1ContractTest.php'
      - '.github/workflows/task-agent-mysql-distinct-ordering-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: contract (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/task-agent-order-tracking.php
          php -l tests/phpunit/TaskAgentPhase34PurchaseConfirmationPppmTrackingV1ContractTest.php
      - name: Task Agent purchase tracking contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase34PurchaseConfirmationPppmTrackingV1ContractTest.php
      - name: Task Agent lifecycle regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase35LifecycleHandoffV1ContractTest.php
      - name: Repository production quality
        run: php scripts/repository_production_quality.php --json=build/repository-production-quality-${{ matrix.php }}.json
