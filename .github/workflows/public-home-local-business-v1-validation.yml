name: Public Home Local Business v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'index.php'
      - 'merchant-landing.php'
      - 'assets/css/homepage-local-business-v1.css'
      - 'assets/images/public-home-merchant-hero.jpg'
      - 'includes/header-components/public-header.php'
      - 'scripts/validate_public_home_local_business_v1.php'
      - '.github/workflows/public-home-local-business-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l index.php
          php -l merchant-landing.php
          php -l scripts/validate_public_home_local_business_v1.php

      - name: Public merchant landing design contract
        run: php scripts/validate_public_home_local_business_v1.php
