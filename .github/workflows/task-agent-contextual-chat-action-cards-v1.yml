name: Task Agent Contextual Chat and Action Cards v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'api/agents/runtime.php'
      - 'includes/multi-agent-runtime.php'
      - 'includes/task-agent-context.php'
      - 'includes/task-agent-memory.php'
      - 'includes/task-agent-intent-router.php'
      - 'assets/js/multi-agent-runtime.js'
      - 'tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php'
      - 'tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php'
      - '.github/workflows/task-agent-contextual-chat-action-cards-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l agent.php
          php -l api/agents/runtime.php
          php -l includes/multi-agent-runtime.php
          php -l includes/task-agent-context.php
          php -l includes/task-agent-memory.php
          php -l includes/task-agent-intent-router.php
          php -l tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
          php -l tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/multi-agent-runtime.js
      - name: Contextual chat and action card contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
      - name: Shared runtime memory regression
        run: vendor/bin/phpunit tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
