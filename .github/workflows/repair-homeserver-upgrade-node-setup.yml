name: Repair HomeServer upgrade Node setup

on:
  push:
    branches:
      - feature/homeserver-primary-connection-upgrades
    paths:
      - .github/workflows/repair-homeserver-upgrade-node-setup.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.ref_name == 'feature/homeserver-primary-connection-upgrades'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-primary-connection-upgrades
          fetch-depth: 0
      - name: Remove unsupported npm cache contract
        shell: python
        run: |
          from pathlib import Path
          target = Path('.github/workflows/homeserver-primary-upgrade-authority.yml')
          text = target.read_text(encoding='utf-8')
          old = '          node-version: 22\n          cache: npm\n'
          new = '          node-version: 22\n'
          if text.count(old) != 1:
              raise SystemExit('Node setup cache anchor is not unique')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-homeserver-upgrade-node-setup.yml').unlink()
      - name: Commit permanent workflow repair
        run: |
          git config user.name "Microgifter Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/homeserver-primary-upgrade-authority.yml .github/workflows/repair-homeserver-upgrade-node-setup.yml
          git commit -m "Fix HomeServer upgrade Node setup"
          git push origin HEAD:feature/homeserver-primary-connection-upgrades
