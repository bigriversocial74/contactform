name: Predictive Campaign Studio Foundation v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-campaigns.php'
      - 'api/merchant/_predictive_campaign_studio.php'
      - 'api/merchant/predictive-campaign-studio.php'
      - 'assets/css/predictive-campaign-studio.css'
      - 'assets/js/predictive-campaign-studio.js'
      - 'database/predictive_campaign_studio_foundation_v1.sql'
      - 'scripts/validate_predictive_campaign_studio_foundation_v1.php'
      - '.github/workflows/predictive-campaign-studio-foundation-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-campaigns.php
          php -l api/merchant/_predictive_campaign_studio.php
          php -l api/merchant/predictive-campaign-studio.php
          php -l scripts/validate_predictive_campaign_studio_foundation_v1.php

      - name: JavaScript syntax
        run: node --check assets/js/predictive-campaign-studio.js

      - name: Predictive Campaign Studio contract
        run: php scripts/validate_predictive_campaign_studio_foundation_v1.php

      - name: Stage 12 campaigns and rewards regression
        run: php scripts/validate_stage12_campaigns_reward_templates.php

      - name: Campaign public matrix regression
        run: php scripts/validate_campaign_public_matrix_v1.php

      - name: Store Canvas behavior memory regression
        run: php scripts/validate_store_canvas_behavior_memory_predictive_v1.php

      - name: Merchant Canvas production containment regression
        run: php scripts/validate_merchant_canvas_production_containment_v1.php
