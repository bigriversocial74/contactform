name: Store Canvas Movement Continuity v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-canvas.php'
      - 'assets/js/merchant-canvas-movement-continuity.js'
      - 'scripts/validate_store_canvas_movement_continuity_v1.php'
      - '.github/workflows/store-canvas-movement-continuity-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-canvas.php
          php -l scripts/validate_store_canvas_movement_continuity_v1.php

      - name: JavaScript syntax
        run: node --check assets/js/merchant-canvas-movement-continuity.js

      - name: Movement continuity contract
        run: php scripts/validate_store_canvas_movement_continuity_v1.php

      - name: Store Canvas restoration regression
        run: php scripts/validate_store_canvas_visual_restoration_v1.php

      - name: Manual operations regression
        run: php scripts/validate_merchant_canvas_manual_operations_stabilization_v1.php

      - name: Production containment regression
        run: php scripts/validate_merchant_canvas_production_containment_v1.php
