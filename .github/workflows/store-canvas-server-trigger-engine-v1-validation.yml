name: Store Canvas Server Trigger Engine v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-canvas.php'
      - 'api/merchant-canvas/trigger-engine.php'
      - 'api/store/_canvas_trigger_engine.php'
      - 'api/store/_canvas_trigger_engine_runner.php'
      - 'assets/js/merchant-canvas-trigger-engine.js'
      - 'scripts/run_store_trigger_engine_v1.php'
      - 'database/store_canvas_server_trigger_engine_v1.sql'
      - 'scripts/validate_store_canvas_server_trigger_engine_v1.php'
      - '.github/workflows/store-canvas-server-trigger-engine-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l merchant-canvas.php
          php -l api/merchant-canvas/trigger-engine.php
          php -l api/store/_canvas_trigger_engine.php
          php -l api/store/_canvas_trigger_engine_runner.php
          php -l scripts/run_store_trigger_engine_v1.php
          php -l scripts/validate_store_canvas_server_trigger_engine_v1.php

      - name: JavaScript syntax
        run: node --check assets/js/merchant-canvas-trigger-engine.js

      - name: Server trigger engine authority contract
        run: php scripts/validate_store_canvas_server_trigger_engine_v1.php

      - name: Stage 12 campaigns and rewards regression
        run: php scripts/validate_stage12_campaigns_reward_templates.php

      - name: Campaign public matrix regression
        run: php scripts/validate_campaign_public_matrix_v1.php

      - name: Store Canvas visual restoration regression
        run: php scripts/validate_store_canvas_visual_restoration_v1.php

      - name: Store Canvas movement continuity regression
        run: php scripts/validate_store_canvas_movement_continuity_v1.php

      - name: Store Canvas behavior memory regression
        run: php scripts/validate_store_canvas_behavior_memory_predictive_v1.php

      - name: Merchant Canvas customer journey regression
        run: php scripts/validate_merchant_canvas_customer_journey_v1.php

      - name: Merchant Canvas manual operations regression
        run: php scripts/validate_merchant_canvas_manual_operations_v1.php

      - name: Merchant Canvas production containment regression
        run: php scripts/validate_merchant_canvas_production_containment_v1.php
