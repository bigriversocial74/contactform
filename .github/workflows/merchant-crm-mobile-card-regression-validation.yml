name: Merchant CRM Mobile Card Regression

on:
  pull_request:
    paths:
      - 'merchant-crm.php'
      - 'includes/merchant-crm-view.php'
      - 'assets/css/merchant-crm-mobile-card-regression-fix.css'
      - 'scripts/validate_merchant_crm_mobile_card_regression.php'
      - '.github/workflows/merchant-crm-mobile-card-regression-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l merchant-crm.php
          php -l includes/merchant-crm-view.php
          php -l scripts/validate_merchant_crm_mobile_card_regression.php
      - name: Contract validation
        run: php scripts/validate_merchant_crm_mobile_card_regression.php
