name: Merchant CRM KPI Compatibility Validation

on:
  pull_request:
    paths:
      - 'merchant-crm.php'
      - 'assets/css/merchant-crm-kpi-authoritative-v1.css'
      - 'scripts/validate_merchant_crm_kpi_hard_reset_v3.php'
      - '.github/workflows/merchant-crm-kpi-hard-reset-v3-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l merchant-crm.php
          php -l scripts/validate_merchant_crm_kpi_hard_reset_v3.php
      - name: Validate KPI compatibility contract
        run: php scripts/validate_merchant_crm_kpi_hard_reset_v3.php
