name: One-time Loyalty Quest Registry Repair

on:
  push:
    branches:
      - fix/wallet-pppm-inbox-authority-v1-20260711

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallet-pppm-inbox-authority-v1-20260711
          fetch-depth: 0
      - name: Register Loyalty Quest and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/campaign-types.php')
          text = path.read_text()

          marker = "declare(strict_types=1);\n"
          include = "declare(strict_types=1);\n\nrequire_once __DIR__ . '/loyalty-quest-campaign-type.php';\n"
          if "loyalty-quest-campaign-type.php" not in text:
              if marker not in text:
                  raise SystemExit('strict-types marker missing')
              text = text.replace(marker, include, 1)

          start_old = "function mg_campaign_type_registry(): array\n{\n    return ["
          start_new = "function mg_campaign_type_registry(): array\n{\n    $registry = ["
          if start_old in text:
              text = text.replace(start_old, start_new, 1)
          elif start_new not in text:
              raise SystemExit('registry start marker missing')

          end_old = "        ],\n    ];\n}\n\nfunction mg_campaign_type_get"
          end_new = "        ],\n    ];\n    $registry['loyalty_quest'] = mg_loyalty_quest_campaign_definition();\n    return $registry;\n}\n\nfunction mg_campaign_type_get"
          if "$registry['loyalty_quest']" not in text:
              if end_old not in text:
                  raise SystemExit('registry end marker missing')
              text = text.replace(end_old, end_new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-loyalty-quest-registry-once.yml').unlink()
          PY
          php -l includes/campaign-types.php
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add includes/campaign-types.php .github/workflows/patch-loyalty-quest-registry-once.yml
          git commit -m "Restore Loyalty Quest in central campaign registry"
          git push origin HEAD:fix/wallet-pppm-inbox-authority-v1-20260711
