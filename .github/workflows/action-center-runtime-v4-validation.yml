name: Action Center Runtime v4

on:
  pull_request:
    paths:
      - 'inbox.php'
      - 'sent.php'
      - 'claimed.php'
      - 'includes/gift-action-center.php'
      - 'assets/js/gift-action-center-runtime-v4.js'
      - 'assets/css/gift-action-center-runtime-v4.css'
      - 'config/frontend-contracts.php'
      - 'scripts/validate_action_center_runtime_v4.php'
      - 'tests/phpunit/GiftActionCenterConsolidatedLayoutTest.php'
      - 'tests/phpunit/GiftActionCenterNotificationIntegrationTest.php'
      - '.github/workflows/action-center-runtime-v4-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l inbox.php
          php -l sent.php
          php -l claimed.php
          php -l includes/gift-action-center.php
          php -l config/frontend-contracts.php
          php -l scripts/validate_action_center_runtime_v4.php
          php -l tests/phpunit/GiftActionCenterConsolidatedLayoutTest.php
          php -l tests/phpunit/GiftActionCenterNotificationIntegrationTest.php
      - name: JavaScript syntax
        run: node --check assets/js/gift-action-center-runtime-v4.js
      - name: Runtime contract
        run: php scripts/validate_action_center_runtime_v4.php
      - name: Focused PHPUnit contracts
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/GiftActionCenterConsolidatedLayoutTest.php tests/phpunit/GiftActionCenterNotificationIntegrationTest.php
          else
            echo 'PHPUnit is unavailable; static runtime validation completed.'
          fi
