name: Audit Raw Throwable Diagnostics

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - scripts/diagnose_raw_throwable_responses.php
      - .github/workflows/audit-raw-throwable-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717

      - name: Run exact catch diagnostics
        run: php scripts/diagnose_raw_throwable_responses.php

      - name: Upload exact findings
        uses: actions/upload-artifact@v4
        with:
          name: raw-throwable-diagnostics
          path: build/raw-throwable-diagnostics.json
          if-no-files-found: error
