name: Migration Delimiter Runner v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'includes/migrations.php'
      - 'scripts/run_migrations.php'
      - 'database/20260719_product_bundle_checkout_fulfillment_v3.sql'
      - 'tests/phpunit/MigrationDelimiterRunnerV1Test.php'
      - '.github/workflows/migration-delimiter-runner-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: validate (${{ matrix.php }})
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: ci-migration-delimiter-runner-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/migrations.php
          php -l scripts/run_migrations.php
          php -l tests/phpunit/MigrationDelimiterRunnerV1Test.php
      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Delimiter parser contract
        run: vendor/bin/phpunit tests/phpunit/MigrationDelimiterRunnerV1Test.php
      - name: Build clean MySQL database
        shell: bash
        run: |
          set -o pipefail
          php scripts/run_migrations.php 2>&1 | tee /tmp/microgifter-migrations.log
      - name: Repository production-quality audit
        run: composer audit-repository-quality
      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: delimiter-runner-migration-log-php-${{ matrix.php }}
          path: /tmp/microgifter-migrations.log
          if-no-files-found: ignore
