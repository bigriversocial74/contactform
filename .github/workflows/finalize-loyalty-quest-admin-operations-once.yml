name: Finalize Loyalty Quest Admin Operations

on:
  push:
    branches:
      - feature/loyalty-quest-admin-operations-v1-20260711

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/loyalty-quest-admin-operations-v1-20260711
          fetch-depth: 0
      - name: Finalize scoped files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          helper = Path('api/admin/_loyalty_quest_operations.php')
          text = helper.read_text()
          text = text.replace(
              "$eventType='quest.admin_'.$action.'d';",
              "$eventType=['pause'=>'quest.admin_paused','resume'=>'quest.admin_resumed','end'=>'quest.admin_ended'][$action];"
          )
          helper.write_text(text)

          sidebar = Path('includes/admin-sidebar.php')
          text = sidebar.read_text()
          if 'loyalty_quest_operations' not in text:
              lines = text.splitlines(keepends=True)
              index = next((i for i,line in enumerate(lines) if 'operations_command' in line), None)
              if index is None:
                  raise SystemExit('Operations Command navigation item was not found.')
              start = index
              while start > 0 and '[' not in lines[start]:
                  start -= 1
              depth = 0
              end = start
              opened = False
              for i in range(start, min(len(lines), start + 40)):
                  line = lines[i]
                  depth += line.count('[') - line.count(']')
                  opened = opened or '[' in line
                  end = i
                  if opened and depth <= 0:
                      break
              block = ''.join(lines[start:end + 1])
              if 'operations_command' not in block:
                  block = lines[index]
                  start = end = index
              clone = block.replace('operations_command','loyalty_quest_operations')
              clone = clone.replace('Operations Command','Loyalty Quests')
              clone = clone.replace('/admin/operations-command.php','/admin/loyalty-quests.php')
              clone = re.sub(r"('(?:description|detail|subtitle)'\s*=>\s*)'[^']*'", r"\1'Campaign control and recovery'", clone)
              clone = re.sub(r'("(?:description|detail|subtitle)"\s*=>\s*)"[^"]*"', r'\1"Campaign control and recovery"', clone)
              if 'loyalty_quest_operations' not in clone or '/admin/loyalty-quests.php' not in clone:
                  raise SystemExit('Unable to construct Loyalty Quest navigation item.')
              lines.insert(end + 1, clone)
              sidebar.write_text(''.join(lines))

          validator = Path('scripts/validate_loyalty_quest_admin_operations_v1.php')
          text = validator.read_text()
          replacements = {
              'str_contains($service,"$old!==\'paused\'")': 'str_contains($service,"\\$old!==\'paused\'")',
              'str_contains($service,"$old_status")': 'str_contains($service,"\\$old_status")',
              'str_contains($service,"$new_status")': 'str_contains($service,"\\$new_status")',
              'str_contains($service,"\'old_status\'=>$old")': 'str_contains($service,"\'old_status\'=>\\$old")',
              'str_contains($service,"\'new_status\'=>$new")': 'str_contains($service,"\'new_status\'=>\\$new")',
              'str_contains($service,"status===\'processing\'")': 'str_contains($service,"status===\'processing\'")',
              'str_contains($service,"\'email\'=>(string)($recipient[\'email\']")': 'str_contains($service,"\'email\'=>(string)(\\$recipient[\'email\']")',
          }
          for old,new in replacements.items():
              text = text.replace(old,new)
          text = text.replace('str_contains($service,"$old!==\'paused\'")','str_contains($service,"\\$old!==\'paused\'")')
          validator.write_text(text)

          for path in [
              Path('.github/workflows/patch-loyalty-quest-admin-operations-once.yml'),
              Path('.github/workflows/finalize-loyalty-quest-admin-operations-once.yml'),
          ]:
              if path.exists():
                  path.unlink()
          PY
      - name: Commit finalized integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Loyalty Quest admin operations integration"
          git push origin HEAD:feature/loyalty-quest-admin-operations-v1-20260711
