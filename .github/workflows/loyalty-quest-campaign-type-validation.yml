name: Loyalty Quest Campaign Type Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'includes/loyalty-quest-campaign-type.php'
      - 'api/merchant/loyalty-quest-campaigns.php'
      - 'assets/js/loyalty-quest-campaign-type.js'
      - 'merchant-campaigns.php'
      - 'loyalty-quest.php'
      - 'scripts/validate_loyalty_quest_campaign_type_v1.php'
      - '.github/workflows/loyalty-quest-campaign-type-validation.yml'
  push:
    branches:
      - 'feature/loyalty-quest-*'
    paths:
      - 'includes/loyalty-quest-campaign-type.php'
      - 'api/merchant/loyalty-quest-campaigns.php'
      - 'assets/js/loyalty-quest-campaign-type.js'
      - 'merchant-campaigns.php'
      - 'loyalty-quest.php'
      - 'scripts/validate_loyalty_quest_campaign_type_v1.php'
      - '.github/workflows/loyalty-quest-campaign-type-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Loyalty Quest campaign type v1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/loyalty-quest-campaign-type.php
          php -l api/merchant/loyalty-quest-campaigns.php
          php -l merchant-campaigns.php
          php -l loyalty-quest.php
          php -l scripts/validate_loyalty_quest_campaign_type_v1.php
      - name: Loyalty Quest 10/10 contract
        run: php scripts/validate_loyalty_quest_campaign_type_v1.php
