name: MCP Approval-Gated Drafts Phase 3A

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'account-agent-drafts.php'
      - 'admin/mcp-oauth-clients.php'
      - 'api/internal/mcp-bridge.php'
      - 'api/internal/_mcp_draft_bridge.php'
      - 'api/internal/_mcp_oauth_bridge.php'
      - 'assets/css/mcp-drafts.css'
      - 'includes/mcp-drafts.php'
      - 'includes/mcp-drafts/**'
      - 'includes/mcp-oauth.php'
      - 'includes/mcp-oauth/**'
      - 'services/mcp/**'
      - 'database/20260720_mcp_approval_gated_drafts_phase3a_v1.sql'
      - 'config/migrations.php'
      - 'config/mcp_approval_gated_drafts_phase3a_release.php'
      - 'scripts/test_mcp_approval_gated_drafts_phase3a.php'
      - 'tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php'
      - 'docs/MICROGIFTER_MCP_INSTALLATION_AND_ACTIVATION.md'
      - 'docs/MICROGIFTER_MCP_APPROVAL_GATED_DRAFTS_PHASE3A.md'
      - '.github/workflows/mcp-approval-gated-drafts-phase3a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-draft-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install locked dependencies
        working-directory: services/mcp
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        working-directory: services/mcp
        run: npm audit --audit-level=high
      - name: Build and test MCP service
        working-directory: services/mcp
        run: npm run check
      - name: Prove draft tool names exclude execution verbs
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'microgifter.gift.create_draft' services/mcp/src/tools/drafts.ts
          grep -F 'microgifter.campaign.create_draft' services/mcp/src/tools/drafts.ts
          grep -F 'microgifter.reward.create_draft' services/mcp/src/tools/drafts.ts
          grep -F 'microgifter.message.create_draft' services/mcp/src/tools/drafts.ts
          if grep -E 'registerTool\([^\n]*(publish|send|purchase|execute|schedule)' services/mcp/src/tools/drafts.ts; then
            echo 'Execution-capable draft tool detected.' >&2
            exit 1
          fi

  php-draft-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: php-draft-authority (${{ matrix.php }})
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: ci-phase3a-pepper
      MG_MCP_BRIDGE_ENABLED: 'true'
      MG_MCP_BRIDGE_SECRET: ci-phase3a-bridge-secret-0123456789abcdef
      MG_MCP_OAUTH_ENABLED: 'true'
      MG_MCP_OAUTH_ISSUER: https://microgifter.test
      MG_MCP_OAUTH_RESOURCE_URI: https://mcp.microgifter.test/mcp
      MG_MCP_OAUTH_DYNAMIC_REGISTRATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find includes/mcp-drafts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l includes/mcp-drafts.php
          php -l includes/mcp-oauth.php
          php -l includes/mcp-oauth/operation-classes.php
          php -l includes/mcp-oauth/clients.php
          php -l includes/mcp-oauth/consent.php
          php -l includes/mcp-oauth/connections.php
          php -l api/internal/_mcp_draft_bridge.php
          php -l api/internal/_mcp_oauth_bridge.php
          php -l api/internal/mcp-bridge.php
          php -l admin/mcp-oauth-clients.php
          php -l account-agent-drafts.php
          php -l config/mcp_approval_gated_drafts_phase3a_release.php
          php -l scripts/test_mcp_approval_gated_drafts_phase3a.php
          php -l tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php
      - name: Phase 3A and MCP regression contracts
        run: |
          vendor/bin/phpunit \
            tests/phpunit/McpApprovalGatedDraftsPhase3aV1ContractTest.php \
            tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php \
            tests/phpunit/McpExternalAgentSimulatorPhase2bContractTest.php \
            tests/phpunit/McpProductionVpsDeploymentV1ContractTest.php \
            tests/phpunit/McpPhase1ProvisioningConsoleV1ContractTest.php \
            tests/phpunit/McpPhase1CanonicalBridgeV1ContractTest.php \
            tests/phpunit/McpPhase1ProtocolV1ContractTest.php \
            tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Build clean MySQL database
        shell: bash
        run: |
          set -o pipefail
          php scripts/run_migrations.php 2>&1 | tee /tmp/mcp-phase3a-migrations.log
      - name: Verify Phase 3A tables and scopes
        run: |
          php -r '
          $config = require "api/config.php";
          $db = $config["db"];
          $pdo = new PDO(
              sprintf("mysql:host=%s;dbname=%s;charset=%s", $db["host"], $db["name"], $db["charset"]),
              getenv("MG_MIGRATION_DB_USER"),
              getenv("MG_MIGRATION_DB_PASS"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $tables = $pdo->query("SELECT table_name FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"mcp_agent_drafts\",\"mcp_agent_draft_events\") ORDER BY table_name")->fetchAll(PDO::FETCH_COLUMN);
          if ($tables !== ["mcp_agent_draft_events", "mcp_agent_drafts"]) {
              throw new RuntimeException("Phase 3A table mismatch: " . json_encode($tables));
          }
          $scopes = $pdo->query("SELECT scope_key FROM mcp_scope_catalog WHERE scope_key IN (\"gift:draft\",\"campaign:draft\",\"reward:draft\",\"message:draft\") AND active=1 AND grantable=1 AND operation_class=\"draft\" ORDER BY scope_key")->fetchAll(PDO::FETCH_COLUMN);
          if ($scopes !== ["campaign:draft", "gift:draft", "message:draft", "reward:draft"]) {
              throw new RuntimeException("Phase 3A scope mismatch: " . json_encode($scopes));
          }
          echo "MCP Phase 3A tables and scopes verified.\n";
          '
      - name: Execute approval-gated draft lifecycle
        run: php scripts/test_mcp_approval_gated_drafts_phase3a.php
      - name: Repository production-quality audit
        run: composer audit-repository-quality
      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-phase3a-migration-log-php-${{ matrix.php }}
          path: /tmp/mcp-phase3a-migrations.log
          if-no-files-found: ignore
