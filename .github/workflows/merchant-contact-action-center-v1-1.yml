name: Merchant Contact Action Center v1.1

on:
  pull_request:
    branches:
      - feature/merchant-contact-action-center-v1-20260717
      - integration-from-repair-20260628
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php82:
    name: PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PHP syntax
        run: |
          php -l merchant-agent-chat.php
          php -l includes/merchant-agent-chat-view.php
          php -l api/ai/merchant-agent-chat.php
          php -l api/merchant/agent-approval-action.php
          php -l includes/ai/merchant-agent-contact-action-center.php
          php -l includes/ai/merchant-agent-contact-workspace-v1-1.php
          php -l includes/ai/merchant-contact-workspace-review-actions.php
          php -l scripts/validate_merchant_contact_action_center_v1_1.php
          php -l scripts/validate_merchant_contact_workspace_review_actions.php
          php -l tests/phpunit/MerchantContactActionCenterV11Test.php
          php -l tests/phpunit/MerchantContactWorkspaceReviewActionsTest.php
      - name: JavaScript syntax
        run: node --check assets/js/merchant-agent-contact-workspace-v1-1.js
      - name: Follow-Up Workspace contract
        run: php scripts/validate_merchant_contact_action_center_v1_1.php
      - name: Canonical approval adapter contract
        run: |
          set -o pipefail
          php scripts/validate_merchant_contact_workspace_review_actions.php 2>&1 | tee canonical-adapter-contract.txt
      - name: Upload canonical adapter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-adapter-contract-php82
          path: canonical-adapter-contract.txt
          if-no-files-found: error
          retention-days: 3
      - name: PHPUnit when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantContactActionCenterV11Test.php
            vendor/bin/phpunit tests/phpunit/MerchantContactWorkspaceReviewActionsTest.php
          fi

  php83:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PHP syntax
        run: |
          php -l merchant-agent-chat.php
          php -l includes/merchant-agent-chat-view.php
          php -l api/ai/merchant-agent-chat.php
          php -l api/merchant/agent-approval-action.php
          php -l includes/ai/merchant-agent-contact-action-center.php
          php -l includes/ai/merchant-agent-contact-workspace-v1-1.php
          php -l includes/ai/merchant-contact-workspace-review-actions.php
          php -l scripts/validate_merchant_contact_action_center_v1_1.php
          php -l scripts/validate_merchant_contact_workspace_review_actions.php
          php -l tests/phpunit/MerchantContactActionCenterV11Test.php
          php -l tests/phpunit/MerchantContactWorkspaceReviewActionsTest.php
      - name: JavaScript syntax
        run: node --check assets/js/merchant-agent-contact-workspace-v1-1.js
      - name: Follow-Up Workspace contract
        run: php scripts/validate_merchant_contact_action_center_v1_1.php
      - name: Canonical approval adapter contract
        run: php scripts/validate_merchant_contact_workspace_review_actions.php
      - name: PHPUnit when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantContactActionCenterV11Test.php
            vendor/bin/phpunit tests/phpunit/MerchantContactWorkspaceReviewActionsTest.php
          fi
