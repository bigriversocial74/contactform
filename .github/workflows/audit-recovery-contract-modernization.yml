name: Audit Recovery Contract Modernization

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - scripts/apply_recovery_contract_modernization.py
      - .github/workflows/audit-recovery-contract-modernization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo, pdo_mysql, openssl

      - name: Apply guarded contract modernization
        run: python3 scripts/apply_recovery_contract_modernization.py

      - name: Update migration validator contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('scripts/validate_auth_session_identity_hardening_v1.php')
          text = auth.read_text()
          old = "    'migration has auth version' => $has('database/auth_session_identity_hardening_v1.sql', \"'users','auth_version'\"),"
          new = """    'migration has auth version' => $has('database/auth_session_identity_hardening_v1.sql', \"TABLE_NAME='users'\")
              && $has('database/auth_session_identity_hardening_v1.sql', \"COLUMN_NAME='auth_version'\")
              && $has('database/auth_session_identity_hardening_v1.sql', 'ALTER TABLE `users` ADD COLUMN `auth_version`'),"""
          if old not in text:
              raise SystemExit('Auth migration validator source contract was not found.')
          auth.write_text(text.replace(old, new, 1))

          personal = Path('scripts/validate_personal_agent_contact_intelligence_v1.php')
          text = personal.read_text()
          old = """$checks['migration is canonical and ordered'] = str_contains($manifest,\"'stage_18am_personal_agent_contact_intelligence_v1.sql'\")
              && strpos($manifest,\"'stage_18al_personal_agent_followup_recovery_v1.sql'\") < strpos($manifest,\"'stage_18am_personal_agent_contact_intelligence_v1.sql'\")
              && strpos($manifest,\"'stage_18am_personal_agent_contact_intelligence_v1.sql'\") < strpos($manifest,\"'stage_19_ai_provider_models.sql'\");"""
          new = """$checks['migration is canonical and ordered'] = str_contains($manifest,\"'stage_18am_personal_agent_contact_intelligence_v1.sql'\")
              && strpos($manifest,\"'stage_18al_personal_agent_followup_recovery_v1.sql'\") < strpos($manifest,\"'stage_19_ai_provider_models.sql'\")
              && strpos($manifest,\"'stage_19_ai_provider_models.sql'\") < strpos($manifest,\"'20260714_personal_gifting_agent_phase2.sql'\")
              && strpos($manifest,\"'20260714_personal_gifting_agent_phase2.sql'\") < strpos($manifest,\"'stage_18am_personal_agent_contact_intelligence_v1.sql'\");"""
          if old not in text:
              raise SystemExit('Personal Agent migration order validator source contract was not found.')
          personal.write_text(text.replace(old, new, 1))
          PY

      - name: Normalize changed text whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACM'],
              text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if not path.is_file() or path.suffix not in {'.php', '.py'}:
                  continue
              text = path.read_text()
              normalized = '\n'.join(line.rstrip(' \t') for line in text.splitlines()) + '\n'
              path.write_text(normalized)
          PY

      - name: Validate changed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACM | grep -E '\.php$' || true)
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate current security and migration contracts
        id: permanent-contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            php scripts/validate_auth_session_identity_hardening_v1.php
            php scripts/validate_personal_agent_contact_intelligence_v1.php
            php scripts/validate_migration_manifest.php
            git diff --check
          } 2>&1 | tee /tmp/modernization-validation.log

      - name: Capture guarded patch and validation output
        if: always()
        shell: bash
        run: |
          git diff --binary > /tmp/recovery-contract-modernization.patch
          git diff --name-status > /tmp/recovery-contract-modernization-files.txt

      - name: Upload guarded modernization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-contract-modernization-diagnostics
          path: |
            /tmp/recovery-contract-modernization.patch
            /tmp/recovery-contract-modernization-files.txt
            /tmp/modernization-validation.log
          if-no-files-found: error

      - name: Enforce permanent contract validation
        if: steps.permanent-contracts.outcome != 'success'
        run: exit 1

      - name: Commit modernization only when validation passes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No contract changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/phpunit scripts/validate_identity_behavior.php scripts/validate_auth_session_identity_hardening_v1.php scripts/validate_personal_agent_contact_intelligence_v1.php
          git commit -m 'Modernize recovery contracts for current runtime'
          git push origin HEAD:audit/repository-production-hardening-20260717
