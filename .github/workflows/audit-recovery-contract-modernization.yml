name: Audit Recovery Contract Modernization

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - scripts/apply_recovery_contract_modernization.py
      - .github/workflows/audit-recovery-contract-modernization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo, pdo_mysql, openssl

      - name: Apply guarded contract modernization
        run: python3 scripts/apply_recovery_contract_modernization.py

      - name: Validate changed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACM | grep -E '\.php$' || true)
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate current security and migration contracts
        run: |
          php scripts/validate_auth_session_identity_hardening_v1.php
          php scripts/validate_personal_agent_contact_intelligence_v1.php
          php scripts/validate_migration_manifest.php
          git diff --check

      - name: Commit modernization only when validation passes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No contract changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/phpunit scripts/validate_auth_session_identity_hardening_v1.php scripts/validate_personal_agent_contact_intelligence_v1.php
          git commit -m 'Modernize recovery contracts for current runtime'
          git push origin HEAD:audit/repository-production-hardening-20260717
