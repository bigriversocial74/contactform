name: Pitch Deck Scroll v1

on:
  pull_request:
    paths:
      - 'pitch-deck.php'
      - 'assets/css/pitch-deck-scroll-v1.css'
      - 'assets/js/pitch-deck-scroll-v1.js'
      - 'scripts/validate_pitch_deck_scroll_v1.php'
      - '.github/workflows/pitch-deck-scroll-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: PHP syntax
        run: |
          php -l pitch-deck.php
          php -l scripts/validate_pitch_deck_scroll_v1.php
      - name: JavaScript syntax
        run: node --check assets/js/pitch-deck-scroll-v1.js
      - name: Validate pitch deck contract
        run: php scripts/validate_pitch_deck_scroll_v1.php
