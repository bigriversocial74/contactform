name: Hosted Games Management v1

on:
  pull_request:
    paths:
      - '.htaccess'
      - 'admin/hosted-games.php'
      - 'api/admin/hosted-games.php'
      - 'api/hosted-games/**'
      - 'api/merchant/hosted-games.php'
      - 'api/merchant/hosted-game-upload.php'
      - 'assets/css/hosted-game-shell.css'
      - 'assets/css/hosted-games-management.css'
      - 'assets/js/admin-hosted-games.js'
      - 'assets/js/hosted-game-child-bridge.js'
      - 'assets/js/hosted-game-shell.js'
      - 'assets/js/merchant-hosted-games.js'
      - 'config/migrations.php'
      - 'database/hosted_games_management_v1.sql'
      - 'docs/hosted-games-package-guide.md'
      - 'examples/hosted-game-starter/**'
      - 'hosted-game.php'
      - 'includes/admin-permission-matrix.php'
      - 'includes/admin-sidebar.php'
      - 'includes/hosted-games.php'
      - 'includes/merchant-distribution-view.php'
      - 'includes/merchant-hosted-games-view.php'
      - 'includes/merchant-navigation.php'
      - 'includes/merchant-view.php'
      - 'merchant-games.php'
      - 'scripts/validate_hosted_games_management_v1.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium, zip, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l admin/hosted-games.php
          php -l api/admin/hosted-games.php
          php -l api/hosted-games/asset.php
          php -l api/hosted-games/document.php
          php -l api/hosted-games/runtime.php
          php -l api/hosted-games/webhook.php
          php -l api/merchant/hosted-games.php
          php -l api/merchant/hosted-game-upload.php
          php -l config/migrations.php
          php -l hosted-game.php
          php -l includes/admin-permission-matrix.php
          php -l includes/admin-sidebar.php
          php -l includes/hosted-games.php
          php -l includes/merchant-distribution-view.php
          php -l includes/merchant-hosted-games-view.php
          php -l includes/merchant-navigation.php
          php -l includes/merchant-view.php
          php -l merchant-games.php
          php -l scripts/validate_hosted_games_management_v1.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin-hosted-games.js
          node --check assets/js/hosted-game-child-bridge.js
          node --check assets/js/hosted-game-shell.js
          node --check assets/js/merchant-hosted-games.js
          node --check examples/hosted-game-starter/game.js
      - name: Hosted Games contract validation
        shell: bash
        run: |
          set -o pipefail
          php scripts/validate_hosted_games_management_v1.php 2>&1 | tee hosted-games-validation-${{ matrix.php }}.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-games-validation-${{ matrix.php }}
          path: hosted-games-validation-${{ matrix.php }}.log
          if-no-files-found: warn
