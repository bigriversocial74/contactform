name: Apply HomeServer upgrade integration

on:
  push:
    branches:
      - feature/homeserver-primary-connection-upgrades
    paths:
      - .github/workflows/apply-homeserver-upgrade-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref_name == 'feature/homeserver-primary-connection-upgrades'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-primary-connection-upgrades
          fetch-depth: 0

      - name: Apply exact integration patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one integration anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'config/migrations.php',
              "        '20260728_homeserver_pairing_entitlement_update_contract_v1.sql',\n        '20260729_investor_invite_onboarding_v1.sql',",
              "        '20260728_homeserver_pairing_entitlement_update_contract_v1.sql',\n        '20260803_homeserver_upgrade_control_v2.sql',\n        '20260729_investor_invite_onboarding_v1.sql',"
          )

          replace_once(
              'admin/homeserver-releases.php',
              "          <a class=\"mg-btn mg-btn-soft\" href=\"/api/homeserver/latest-release.php\" target=\"_blank\" rel=\"noopener\">View latest metadata</a>\n          <a class=\"mg-btn mg-btn-soft\" href=\"/account-homeserver.php\">User download view</a>",
              "          <a class=\"mg-btn mg-btn-primary\" href=\"/admin/homeserver-upgrades.php\">Signed update control</a>\n          <a class=\"mg-btn mg-btn-soft\" href=\"/api/homeserver/latest-release.php\" target=\"_blank\" rel=\"noopener\">View latest metadata</a>\n          <a class=\"mg-btn mg-btn-soft\" href=\"/account-homeserver.php\">User download view</a>"
          )

          replace_once(
              'admin/homeserver-releases.php',
              'This is the manual distribution foundation for the later automated updater.',
              'The signed update control center publishes these verified installers to the active HomeServer updater.'
          )

          replace_once(
              'admin/homeserver-releases.php',
              'Reserved now for the future updater compatibility policy.',
              'Enforced by the signed HomeServer update manifest.'
          )

          replace_once(
              'admin/homeserver-releases.php',
              'Saved for the future automated updater; it does not force-install anything yet.',
              'Included in release policy while installation remains user-authorized and rollback protected.'
          )

          replace_once(
              'admin/homeserver-releases.php',
              '<div class="mg-hsr-foundation-note"><strong>Updater foundation</strong><p>The version, channel, architecture, checksum, mandatory flag, minimum supported version, and latest-release endpoint are stored now so the future HomeServer updater can consume a stable contract.</p></div>',
              '<div class="mg-hsr-foundation-note"><strong>Active updater catalog</strong><p>Version, channel, architecture, checksum, minimum version, signing identity, rollout, revocation, and rollback are joined by the signed update control center.</p></div>'
          )

          Path('.github/workflows/apply-homeserver-upgrade-integration.yml').unlink()

      - name: Commit permanent integration only
        run: |
          git config user.name "Microgifter Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add config/migrations.php admin/homeserver-releases.php .github/workflows/apply-homeserver-upgrade-integration.yml
          git commit -m "Integrate signed HomeServer upgrade control"
          git push origin HEAD:feature/homeserver-primary-connection-upgrades
