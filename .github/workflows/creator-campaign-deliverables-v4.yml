name: Creator Campaign Deliverables v4

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'database/20260721_creator_campaign_deliverables_v4.sql'
      - 'config/migrations.php'
      - 'includes/creator-campaigns/**'
      - 'api/merchant/creator-campaign-deliverables.php'
      - 'api/creator/campaign-deliverables.php'
      - 'merchant-creator-deliverables.php'
      - 'creator-campaign-deliverables.php'
      - 'includes/merchant-creator-campaign-deliverables-view.php'
      - 'includes/creator-campaign-deliverables-view.php'
      - 'assets/css/creator-campaign-deliverables.css'
      - 'assets/js/merchant-creator-campaign-deliverables.js'
      - 'assets/js/creator-campaign-deliverables.js'
      - 'scripts/validate_creator_campaign_deliverables_v4.php'
      - 'scripts/validate_creator_campaign_deliverables_v4_mysql.php'
      - 'tests/phpunit/CreatorCampaignDeliverablesV4ContractTest.php'
      - 'docs/creator-campaigns/CREATOR_CAMPAIGN_PHASE4_DELIVERABLES.md'
      - '.github/workflows/creator-campaign-deliverables-v4.yml'
      - '.github/workflows/creator-campaign-participation-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-campaign-deliverables-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy: {fail-fast: false, matrix: {php: ['8.2','8.3']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/deliverable-definitions.php
          php -l includes/creator-campaigns/deliverable-context.php
          php -l includes/creator-campaigns/deliverable-repository.php
          php -l includes/creator-campaigns/deliverable-notification.php
          php -l includes/creator-campaigns/deliverable-service.php
          php -l includes/creator-campaigns/submission-service.php
          php -l includes/creator-campaigns/deliverable-query.php
          php -l includes/creator-campaigns/bootstrap.php
          php -l api/merchant/creator-campaign-deliverables.php
          php -l api/creator/campaign-deliverables.php
          php -l merchant-creator-deliverables.php
          php -l creator-campaign-deliverables.php
          php -l includes/merchant-creator-campaign-deliverables-view.php
          php -l includes/creator-campaign-deliverables-view.php
          php -l scripts/validate_creator_campaign_participation_v3_mysql.php
          php -l scripts/validate_creator_campaign_deliverables_v4.php
          php -l scripts/validate_creator_campaign_deliverables_v4_mysql.php
          php -l tests/phpunit/CreatorCampaignDeliverablesV4ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-creator-campaign-deliverables.js
          node --check assets/js/creator-campaign-deliverables.js
      - name: Phase 2 compatibility
        run: |
          php scripts/validate_creator_campaign_merchant_builder_v2.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignMerchantBuilderV2ContractTest.php
      - name: Phase 3 compatibility
        run: |
          php scripts/validate_creator_campaign_participation_v3.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignParticipationV3ContractTest.php
      - name: Phase 4 scored validation
        run: php scripts/validate_creator_campaign_deliverables_v4.php
      - name: Phase 4 PHPUnit contract
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignDeliverablesV4ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php

  mysql-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: creator-campaign-deliverables-v4-validation
      MG_PAYMENT_PROVIDER: stripe
      MG_PAYMENT_MODE: test
      MG_STRIPE_TEST_STUB: '1'
      MG_STRIPE_STUB_ACCOUNT_ACTIVE: '1'
      MG_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_creator_campaign_deliverables
      MG_STRIPE_SECRET_KEY_TEST: sk_test_creator_campaign_deliverables
      MG_STRIPE_WEBHOOK_SECRET_TEST: whsec_creator_campaign_deliverables
      MG_MEDIA_STORAGE_DRIVER: persistent_local
      MG_MEDIA_STORAGE_ROOT: /tmp/microgifter-creator-campaign-deliverables-storage
      MG_MEDIA_PUBLIC_ENDPOINT: /api/public/media.php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0
            sleep 1
          done
          exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Verify Phase 4 schema contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='microgifter' AND table_name IN ('creator_campaign_deliverables','creator_campaign_participant_deliverables','creator_campaign_submissions','creator_campaign_submission_revisions','creator_campaign_assets');")" = "5"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM permissions WHERE slug IN ('merchant.creator_deliverables.view','merchant.creator_deliverables.manage','merchant.creator_submissions.view','merchant.creator_submissions.review','creator.campaign_deliverables.view_own','creator.campaign_submissions.manage_own');")" = "6"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='microgifter' AND table_name IN ('creator_campaign_tracking_sources','creator_campaign_tracking_events','creator_campaign_attributions','creator_campaign_compensation_rules','creator_campaign_earning_events','creator_campaign_budget_ledger','creator_campaign_payouts','creator_campaign_disputes');")" = "0"
      - name: Verify Phase 3 remains compatible
        run: php scripts/validate_creator_campaign_participation_v3_mysql.php
      - name: Execute Phase 4 schema lifecycle
        run: php scripts/validate_creator_campaign_deliverables_v4_mysql.php
