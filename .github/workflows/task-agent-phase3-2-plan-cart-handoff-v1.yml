name: Task Agent Phase 3.2 Plan Cart Handoff v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'agent.php'
      - 'api/agents/runtime.php'
      - 'includes/multi-agent-runtime.php'
      - 'includes/task-agent-plan-selection.php'
      - 'includes/task-agent-plan-selection-guard.php'
      - 'includes/task-agent-plan-selection-router.php'
      - 'assets/js/task-agent-shortlist-runtime.js'
      - 'assets/css/task-agent-shortlist-v1.css'
      - 'tests/phpunit/TaskAgentPhase32PlanCartHandoffV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php'
      - 'tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php'
      - 'tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php'
      - '.github/workflows/task-agent-phase3-2-plan-cart-handoff-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l agent.php
          php -l api/agents/runtime.php
          php -l includes/multi-agent-runtime.php
          php -l includes/task-agent-plan-selection.php
          php -l includes/task-agent-plan-selection-guard.php
          php -l includes/task-agent-plan-selection-router.php
          php -l tests/phpunit/TaskAgentPhase32PlanCartHandoffV1ContractTest.php
          php -l tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php
          php -l tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
          php -l tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
          php -l tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/task-agent-shortlist-runtime.js
      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Phase 3.2 contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase32PlanCartHandoffV1ContractTest.php
      - name: Phase 3.1 regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase31DiscoveryShortlistV1ContractTest.php
      - name: Contextual routing regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentContextualChatActionCardsV1ContractTest.php
      - name: Runtime memory regression
        run: vendor/bin/phpunit tests/phpunit/MultiAgentRuntimeMemoryV1ContractTest.php
      - name: Phase 2 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
