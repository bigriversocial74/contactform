name: Apply Public Donations Phase 2 Patch

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'scripts/apply_public_donations_phase2_patch.php'
      - 'scripts/fix_public_donations_phase2_patch.php'
      - '.github/workflows/apply-public-donations-phase2-patch.yml'
      - 'includes/public-donations-campaign-type.php'
      - 'includes/public-donations-feature.php'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: public-donations-phase2-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'feature/public-donations-campaign-foundation-v1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-donations-campaign-foundation-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct patch assertions
        run: |
          rm -f phase2-patch-error.txt
          php scripts/fix_public_donations_phase2_patch.php
      - name: Apply assertion-checked patches
        shell: bash
        run: |
          set +e
          php scripts/apply_public_donations_phase2_patch.php > /tmp/phase2-patch.log 2>&1
          code=$?
          cat /tmp/phase2-patch.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/phase2-patch.log phase2-patch-error.txt
            git config user.name 'Microgifter Phase Builder'
            git config user.email 'actions@users.noreply.github.com'
            git add phase2-patch-error.txt
            git commit -m 'Capture Phase 2 patch assertion failure'
            git push origin HEAD:feature/public-donations-campaign-foundation-v1
            exit "$code"
          fi
      - name: Validate patched syntax
        run: |
          php -l includes/campaign-types.php
          php -l api/merchant/campaigns-core.php
          php -l api/merchant/campaigns.php
          php -l includes/merchant-campaigns-view.php
          php -l includes/public-campaign-page.php
          php -l api/public/campaigns/detail.php
          php -l includes/market/merchant-market-engine.php
          node --check assets/js/public-profile-investment.js
      - name: Commit patched source
        run: |
          rm -f scripts/fix_public_donations_phase2_patch.php phase2-patch-error.txt
          git config user.name 'Microgifter Phase Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Wire Public Donations campaign foundation [phase2-patched]'
          git push origin HEAD:feature/public-donations-campaign-foundation-v1
