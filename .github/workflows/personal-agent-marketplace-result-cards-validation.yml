name: Personal Agent Marketplace Result Cards Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'api/user-agent/chat.php'
      - 'includes/personal-gifting-agent.php'
      - 'includes/personal-agent/marketplace-result-cards.php'
      - 'includes/personal-agent/marketplace-response.php'
      - 'assets/js/personal-agent-marketplace-cards.js'
      - 'assets/css/personal-agent-marketplace-cards.css'
      - 'scripts/validate_personal_agent_marketplace_result_cards.php'
      - 'scripts/validate_personal_agent_account_marketplace_context.php'
      - 'scripts/validate_personal_agent_runtime_nav.php'
      - '.github/workflows/personal-agent-marketplace-result-cards-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_mysql
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l agent.php
          php -l api/user-agent/chat.php
          php -l includes/personal-gifting-agent.php
          php -l includes/personal-agent/marketplace-result-cards.php
          php -l includes/personal-agent/marketplace-response.php
          php -l scripts/validate_personal_agent_marketplace_result_cards.php
          php -l scripts/validate_personal_agent_account_marketplace_context.php
          php -l scripts/validate_personal_agent_runtime_nav.php
      - name: JavaScript syntax
        run: node --check assets/js/personal-agent-marketplace-cards.js
      - name: Marketplace result-card contract
        run: php scripts/validate_personal_agent_marketplace_result_cards.php
      - name: Permission-safe context regression
        run: php scripts/validate_personal_agent_account_marketplace_context.php
      - name: Phase 2 regression
        run: php scripts/validate_personal_gifting_agent_phase2.php
      - name: Phase 3 regression
        run: php scripts/validate_personal_gifting_workflows_phase3.php
      - name: Runtime and navigation regression
        run: php scripts/validate_personal_agent_runtime_nav.php
