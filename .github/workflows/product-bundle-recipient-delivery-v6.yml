name: Product Bundle Recipient Delivery v6

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'api/bundles/delivery.php'
      - 'bundle-order.php'
      - 'assets/js/bundle-delivery-v6.js'
      - 'assets/css/bundle-delivery-v6.css'
      - 'tests/phpunit/ProductBundleRecipientDeliveryV6ContractTest.php'
      - '.github/workflows/product-bundle-recipient-delivery-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l api/bundles/delivery.php
          php -l bundle-order.php
          php -l tests/phpunit/ProductBundleRecipientDeliveryV6ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/bundle-delivery-v6.js
      - name: Contract test
        run: vendor/bin/phpunit tests/phpunit/ProductBundleRecipientDeliveryV6ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: No settlement execution
        run: |
          ! grep -R "stripe_transfers\|transfer_data\|settlement_release" api/bundles/delivery.php assets/js/bundle-delivery-v6.js
