name: Apply Auth Hardening Source

on:
  push:
    branches:
      - feature/auth-session-identity-hardening-v1-20260715
    paths:
      - scripts/auth-hardening-source.part03

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-session-identity-hardening-v1-20260715
          fetch-depth: 0
      - name: Apply reviewed source package
        run: |
          cat scripts/auth-hardening-source.part00 scripts/auth-hardening-source.part01 scripts/auth-hardening-source.part02 scripts/auth-hardening-source.part03 > /tmp/auth-hardening-source.tar.gz.b64
          base64 --decode /tmp/auth-hardening-source.tar.gz.b64 > /tmp/auth-hardening-source.tar.gz
          tar -xzf /tmp/auth-hardening-source.tar.gz -C .
          rm -f scripts/auth-hardening-source.part00 scripts/auth-hardening-source.part01 scripts/auth-hardening-source.part02 scripts/auth-hardening-source.part03
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Auth Session and Identity Production Hardening v1"
          git push origin HEAD:feature/auth-session-identity-hardening-v1-20260715
