name: World Canvas Runtime v2 Validation

on:
  pull_request:
    paths:
      - 'world-canvas.php'
      - 'merchant-canvas.php'
      - 'api/world-canvas/**'
      - 'api/store/_presence.php'
      - 'api/store/enter.php'
      - 'api/store/session-status.php'
      - 'api/merchant-canvas/presence.php'
      - 'assets/js/world-canvas-runtime-v2.js'
      - 'assets/js/merchant-canvas-presence.js'
      - 'assets/css/world-canvas-runtime-v2.css'
      - 'database/stage_33_world_canvas_persona_presence.sql'
      - 'tests/phpunit/WorldCanvasRuntimeV2ContractTest.php'
      - 'scripts/validate_world_canvas_runtime_v2.php'
      - '.github/workflows/world-canvas-runtime-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l world-canvas.php
          php -l merchant-canvas.php
          php -l api/world-canvas/_runtime_v2.php
          php -l api/world-canvas/activity.php
          php -l api/world-canvas/persona.php
          php -l api/world-canvas/location-presence.php
          php -l api/store/_presence.php
          php -l api/store/enter.php
          php -l api/store/session-status.php
          php -l api/merchant-canvas/presence.php
          php -l tests/phpunit/WorldCanvasRuntimeV2ContractTest.php
          php -l scripts/validate_world_canvas_runtime_v2.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/world-canvas-runtime-v2.js
          node --check assets/js/merchant-canvas-presence.js
      - name: Runtime contract validation
        run: php scripts/validate_world_canvas_runtime_v2.php
      - name: PHPUnit contract
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/WorldCanvasRuntimeV2ContractTest.php
          else
            echo 'PHPUnit vendor binary is not installed; standalone contract validation completed.'
          fi
