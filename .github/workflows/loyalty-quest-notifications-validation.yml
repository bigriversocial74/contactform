name: Loyalty Quest Notifications Validation

on:
  pull_request:
    paths:
      - 'api/communications/_delivery.php'
      - 'api/communications/_loyalty_quest_notifications.php'
      - 'api/communications/_loyalty_quest_worker.php'
      - 'api/communications/loyalty-quest-worker.php'
      - 'api/communications/preferences.php'
      - 'api/merchant/loyalty-quest-invitations.php'
      - 'api/merchant/loyalty-quest-deliveries.php'
      - 'api/merchant/loyalty-quest-reviews.php'
      - 'api/public/loyalty-quest/start.php'
      - 'api/public/loyalty-quest/submit.php'
      - 'api/public/loyalty-quest/_reward.php'
      - 'merchant-loyalty-quest-delivery.php'
      - 'includes/merchant-loyalty-quest-delivery-view.php'
      - 'includes/merchant-workspace.php'
      - 'includes/merchant-view.php'
      - 'assets/css/loyalty-quest-delivery.css'
      - 'assets/js/loyalty-quest-delivery.js'
      - 'scripts/run_loyalty_quest_notifications.php'
      - 'scripts/validate_loyalty_quest_notifications_v1.php'
      - 'database/loyalty_quest_notifications_transactional_delivery_v1.sql'
      - 'config/migrations.php'
      - 'docs/deployment/loyalty_quest_notifications_v1.md'
      - '.github/workflows/loyalty-quest-notifications-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Loyalty Quest Notifications (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l api/communications/_delivery.php
          php -l api/communications/_loyalty_quest_notifications.php
          php -l api/communications/_loyalty_quest_worker.php
          php -l api/communications/loyalty-quest-worker.php
          php -l api/communications/preferences.php
          php -l api/merchant/loyalty-quest-invitations.php
          php -l api/merchant/loyalty-quest-deliveries.php
          php -l api/merchant/loyalty-quest-reviews.php
          php -l api/public/loyalty-quest/start.php
          php -l api/public/loyalty-quest/submit.php
          php -l api/public/loyalty-quest/_reward.php
          php -l merchant-loyalty-quest-delivery.php
          php -l includes/merchant-loyalty-quest-delivery-view.php
          php -l includes/merchant-workspace.php
          php -l includes/merchant-view.php
          php -l scripts/run_loyalty_quest_notifications.php
          php -l scripts/validate_loyalty_quest_notifications_v1.php
          php -l config/migrations.php
      - name: JavaScript syntax
        run: node --check assets/js/loyalty-quest-delivery.js
      - name: Loyalty Quest Notifications 10/10 contract
        run: php scripts/validate_loyalty_quest_notifications_v1.php
      - name: Shared delivery regression
        run: php scripts/validate_delivery_behavior.php
      - name: Migration manifest regression
        run: php scripts/validate_migration_manifest.php
      - name: Loyalty Quest campaign regression
        run: php scripts/validate_loyalty_quest_campaign_type_v1.php
      - name: Participant quest regression
        run: php scripts/validate_participant_quest_experience_v1.php
      - name: Merchant quest regression
        run: php scripts/validate_merchant_quest_management_v1.php
      - name: Public marketplace regression
        run: php scripts/validate_public_loyalty_quest_marketplace_v1.php
