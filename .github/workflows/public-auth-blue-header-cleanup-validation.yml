name: Public Auth Blue Header Cleanup Validation

on:
  pull_request:
    paths:
      - 'includes/header-components/public-header.php'
      - 'assets/css/auth-page.css'
      - 'includes/page.php'
      - 'signin.php'
      - 'tests/phpunit/PublicHeaderRoutesTest.php'
      - 'tests/phpunit/AuthPageAssetManifestTest.php'
      - 'scripts/validate_public_auth_blue_header_cleanup.php'
      - '.github/workflows/public-auth-blue-header-cleanup-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l includes/header-components/public-header.php
          php -l includes/page.php
          php -l signin.php
          php -l tests/phpunit/PublicHeaderRoutesTest.php
          php -l tests/phpunit/AuthPageAssetManifestTest.php
          php -l scripts/validate_public_auth_blue_header_cleanup.php

      - name: Public auth blue and header cleanup contract
        run: php scripts/validate_public_auth_blue_header_cleanup.php
