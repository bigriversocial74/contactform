name: Customer Inbox Sidebar Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'merchant-agent-chat.php'
      - 'includes/agent-sidebar.php'
      - 'includes/personal-agent-sidebar.php'
      - 'includes/agent-quick-actions.php'
      - 'includes/gift-center-sidebar.php'
      - 'includes/gift-action-center.php'
      - 'includes/account-sidebar.php'
      - 'assets/css/personal-agent-chat-history.css'
      - 'assets/js/agent-sidebar-tools.js'
      - 'assets/js/personal-agent-chat-history.js'
      - 'assets/js/personal-agent-design-studio.js'
      - 'my-quests.php'
      - 'account-subscriptions.php'
      - 'notifications.php'
      - 'feed.php'
      - 'loyalty-cards.php'
      - 'lists.php'
      - 'account.php'
      - 'scripts/validate_customer_inbox_sidebar.php'
      - 'scripts/validate_inbox_sidebar_crm_quest_nav_cleanup.php'
      - 'tests/phpunit/CustomerInboxSidebarContractTest.php'
      - '.github/workflows/customer-inbox-sidebar-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l agent.php
          php -l merchant-agent-chat.php
          php -l includes/agent-sidebar.php
          php -l includes/personal-agent-sidebar.php
          php -l includes/agent-quick-actions.php
          php -l includes/gift-center-sidebar.php
          php -l includes/gift-action-center.php
          php -l includes/account-sidebar.php
          php -l my-quests.php
          php -l account-subscriptions.php
          php -l notifications.php
          php -l feed.php
          php -l loyalty-cards.php
          php -l lists.php
          php -l account.php
          php -l scripts/validate_customer_inbox_sidebar.php
          php -l scripts/validate_inbox_sidebar_crm_quest_nav_cleanup.php
          php -l tests/phpunit/CustomerInboxSidebarContractTest.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/agent-sidebar-tools.js
          node --check assets/js/personal-agent-chat-history.js
          node --check assets/js/personal-agent-design-studio.js

      - name: Customer inbox sidebar contract
        run: php scripts/validate_customer_inbox_sidebar.php

      - name: Existing inbox and merchant navigation regression
        run: php scripts/validate_inbox_sidebar_crm_quest_nav_cleanup.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/CustomerInboxSidebarContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contracts completed.'
          fi
