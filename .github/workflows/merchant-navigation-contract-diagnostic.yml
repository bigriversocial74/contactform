name: Merchant Navigation Contract Diagnostic

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - '.github/workflows/merchant-navigation-contract-diagnostic.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate navigation contracts
        shell: bash
        run: |
          {
            echo '=== WORKFLOW MATCHES ==='
            grep -RIn "Merchant Navigation Groups" .github/workflows || true
            echo '=== NAVIGATION VALIDATORS ==='
            grep -RIn "Products & Engagement\|Insights & Records\|Storefront & Distribution\|Business Operations" scripts tests .github/workflows | head -300 || true
          } > merchant-navigation-contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-navigation-contract-diagnostic
          path: merchant-navigation-contract.txt
          if-no-files-found: error
