name: One-time Loyalty Quest Admin Operations Integration

on:
  push:
    branches:
      - feature/loyalty-quest-admin-operations-v1-20260711

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/loyalty-quest-admin-operations-v1-20260711
          fetch-depth: 0
      - name: Patch helper and admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          helper = Path('api/admin/_loyalty_quest_operations.php')
          text = helper.read_text()
          old = "$eventType='quest.admin_'.$action.'d';"
          new = "$eventType=['pause'=>'quest.admin_paused','resume'=>'quest.admin_resumed','end'=>'quest.admin_ended'][$action];"
          if old not in text and new not in text:
              raise SystemExit('Expected admin event expression was not found.')
          text = text.replace(old, new)
          helper.write_text(text)

          sidebar = Path('includes/admin-sidebar.php')
          text = sidebar.read_text()
          if 'loyalty_quest_operations' not in text:
              lines = text.splitlines(keepends=True)
              index = next((i for i,line in enumerate(lines) if 'operations_command' in line), None)
              if index is None:
                  raise SystemExit('Operations Command navigation item was not found.')

              start = index
              while start > 0 and '[' not in lines[start]:
                  start -= 1
              depth = 0
              end = start
              opened = False
              for i in range(start, min(len(lines), start + 30)):
                  line = lines[i]
                  depth += line.count('[') - line.count(']')
                  opened = opened or '[' in line
                  end = i
                  if opened and depth <= 0:
                      break
              block = ''.join(lines[start:end + 1])
              if 'operations_command' not in block:
                  block = lines[index]
                  start = end = index
              clone = block
              clone = clone.replace('operations_command', 'loyalty_quest_operations')
              clone = clone.replace('Operations Command', 'Loyalty Quests')
              clone = clone.replace('/admin/operations-command.php', '/admin/loyalty-quests.php')
              clone = re.sub(r"('(?:description|detail|subtitle)'\s*=>\s*)'[^']*'", r"\1'Campaign control and recovery'", clone)
              clone = re.sub(r'("(?:description|detail|subtitle)"\s*=>\s*)"[^"]*"', r'\1"Campaign control and recovery"', clone)
              if 'loyalty_quest_operations' not in clone or '/admin/loyalty-quests.php' not in clone:
                  raise SystemExit('Unable to construct Loyalty Quest navigation item.')
              lines.insert(end + 1, clone)
              sidebar.write_text(''.join(lines))

          workflow = Path('.github/workflows/patch-loyalty-quest-admin-operations-once.yml')
          workflow.unlink()
          PY
      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin/_loyalty_quest_operations.php includes/admin-sidebar.php .github/workflows/patch-loyalty-quest-admin-operations-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Loyalty Quest admin operations"
          git push origin HEAD:feature/loyalty-quest-admin-operations-v1-20260711
