name: Open Public Donations Phase 5 PR

on:
  push:
    branches:
      - feature/public-donations-recall-controls-v1
    paths:
      - '.github/workflows/open-public-donations-phase5-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Open pull request
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feature/public-donations-recall-controls-v1 --base integration-from-repair-20260628 --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists."
            exit 0
          fi
          cat > /tmp/phase5-pr.md <<'BODY'
          ## Summary

          Implements partial recall controls for untouched Public Donations rewards that remain owned by the original Community recipient.

          - Preview counts for original, recallable, regifted, claimed, redeemed, expired, cancelled, and already-recalled units.
          - Quantity, reason, and merchant-scoped idempotency requirements.
          - Eligibility recalculated inside an all-or-nothing transaction.
          - Individual eligible reward selection in deterministic order.
          - Canonical Wallet cancellation, PPPM cancellation/event, Microgift lifecycle cancellation, and Inbox revoked projection.
          - Immutable donation attribution history and child-batch recall totals/status.
          - Campaign and reward-template inventory restoration.
          - Campaign event, lifecycle event, audit/security logging, and one recipient notification.
          - Downstream recipients are never affected.

          ## Audit fixes

          1. Corrected the recall-operation SQL placeholder count before execution.
          2. Fixed a JavaScript syntax defect in the preview renderer.
          3. Aligned the focused validator with the ternary recallability implementation.
          4. Normalized unexpected API failures through the standard JSON failure envelope.
          5. Removed all temporary patch and validation files from the production diff.

          ## Final score

          **10/10**

          ## Validation

          - JavaScript syntax: passed.
          - PHP 8.2 and PHP 8.3 syntax: passed.
          - Focused contracts: passed.
          - PHPUnit: 7 tests, 35 assertions passed on PHP 8.2 and PHP 8.3.
          - MySQL 8 lifecycle: passed on PHP 8.2 and PHP 8.3.
          - MySQL coverage verifies classification, partial selection, canonical terminal states, idempotent replay, hash conflict rejection, inventory restoration, downstream-owner protection, notification/event counts, and full rollback after a simulated child lifecycle failure.
          - Final production diff: nine scoped production/test files after this temporary PR opener is removed.

          ## SQL

          **No additional Phase 5 SQL.** Uses the Phase 1 installer David will import with the final SQL batch:

          `database/20260724_public_donations_community_v1_single_install.sql`

          Closes #1320
          BODY
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base integration-from-repair-20260628 \
            --head feature/public-donations-recall-controls-v1 \
            --title "Public Donations Phase 5 recall controls" \
            --body-file /tmp/phase5-pr.md
