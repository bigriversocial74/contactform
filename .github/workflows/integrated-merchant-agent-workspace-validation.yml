name: Integrated Merchant Agent Workspace Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'merchant-agent-chat.php'
      - 'includes/agent-workspace.php'
      - 'includes/personal-agent/workspace-dashboard.php'
      - 'includes/personal-agent-sidebar.php'
      - 'includes/merchant-agent-chat-view.php'
      - 'includes/ai/merchant-agent-snapshot.php'
      - 'api/ai/merchant-agent-chat.php'
      - 'assets/css/personal-agent-chat-history.css'
      - 'assets/css/personal-agent-full-canvas.css'
      - 'assets/css/merchant-agent-integrated-workspace.css'
      - 'assets/css/merchant-agent-integrated-compat.css'
      - 'assets/css/merchant-agent-snapshot.css'
      - 'assets/js/agent-merchant-handoff.js'
      - 'assets/js/merchant-agent-handoff-receiver.js'
      - 'assets/js/merchant-agent-sidebar-history.js'
      - 'assets/js/merchant-agent-chat-mobile.js'
      - 'assets/js/merchant-agent-chat.js'
      - 'scripts/validate_integrated_merchant_agent_workspace_v1.php'
      - 'tests/phpunit/IntegratedMerchantAgentWorkspaceV1Test.php'
      - '.github/workflows/integrated-merchant-agent-workspace-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l agent.php
          php -l merchant-agent-chat.php
          php -l includes/agent-workspace.php
          php -l includes/personal-agent/workspace-dashboard.php
          php -l includes/personal-agent-sidebar.php
          php -l includes/merchant-agent-chat-view.php
          php -l includes/ai/merchant-agent-snapshot.php
          php -l api/ai/merchant-agent-chat.php
          php -l scripts/validate_integrated_merchant_agent_workspace_v1.php
          php -l tests/phpunit/IntegratedMerchantAgentWorkspaceV1Test.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/agent-merchant-handoff.js
          node --check assets/js/merchant-agent-handoff-receiver.js
          node --check assets/js/merchant-agent-sidebar-history.js
          node --check assets/js/merchant-agent-chat-mobile.js
          node --check assets/js/merchant-agent-chat.js

      - name: Integrated Agent contract
        run: php scripts/validate_integrated_merchant_agent_workspace_v1.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/IntegratedMerchantAgentWorkspaceV1Test.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contract completed.'
          fi
