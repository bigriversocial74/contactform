name: Logged-out Header Merchant Link Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'includes/header-components/public-header.php'
      - 'scripts/validate_logged_out_header_merchant_link.php'
      - '.github/workflows/logged-out-header-merchant-link-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/header-components/public-header.php
          php -l scripts/validate_logged_out_header_merchant_link.php
      - name: Logged-out header contract
        run: php scripts/validate_logged_out_header_merchant_link.php
