name: Creator Campaign Participation v3

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'database/20260721_creator_campaign_participation_v3.sql'
      - 'config/migrations.php'
      - 'includes/creator-campaigns/**'
      - 'api/creator/campaigns.php'
      - 'api/merchant/creator-campaign-participation.php'
      - 'creator-campaigns.php'
      - 'merchant-creator-participation.php'
      - 'merchant-creator-campaign-builder.php'
      - 'includes/creator-campaigns-participation-view.php'
      - 'includes/merchant-creator-campaign-participation-view.php'
      - 'assets/css/creator-campaign-participation.css'
      - 'assets/js/creator-campaign-builder-phase3.js'
      - 'assets/js/creator-campaign-participation.js'
      - 'assets/js/merchant-creator-campaign-participation.js'
      - 'scripts/validate_creator_campaign_participation_v3.php'
      - 'scripts/validate_creator_campaign_participation_v3_mysql.php'
      - 'tests/phpunit/CreatorCampaignParticipationV3ContractTest.php'
      - 'docs/creator-campaigns/CREATOR_CAMPAIGN_PHASE3_PARTICIPATION.md'
      - '.github/workflows/creator-campaign-participation-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-campaign-participation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy: {fail-fast: false, matrix: {php: ['8.2','8.3']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/creator-campaigns/participation-definitions.php
          php -l includes/creator-campaigns/participation-context.php
          php -l includes/creator-campaigns/participation-repository.php
          php -l includes/creator-campaigns/participant-service.php
          php -l includes/creator-campaigns/eligibility-evaluator.php
          php -l includes/creator-campaigns/application-answers.php
          php -l includes/creator-campaigns/application-creator.php
          php -l includes/creator-campaigns/application-merchant.php
          php -l includes/creator-campaigns/application-service.php
          php -l includes/creator-campaigns/invitation-creator.php
          php -l includes/creator-campaigns/invitation-directory.php
          php -l includes/creator-campaigns/invitation-merchant.php
          php -l includes/creator-campaigns/invitation-service.php
          php -l includes/creator-campaigns/agreement-service.php
          php -l includes/creator-campaigns/participation-query.php
          php -l includes/creator-campaigns/bootstrap.php
          php -l api/creator/campaigns.php
          php -l api/merchant/creator-campaign-participation.php
          php -l creator-campaigns.php
          php -l merchant-creator-participation.php
          php -l merchant-creator-campaign-builder.php
          php -l includes/creator-campaigns-participation-view.php
          php -l includes/merchant-creator-campaign-participation-view.php
          php -l scripts/validate_creator_campaign_participation_v3.php
          php -l scripts/validate_creator_campaign_participation_v3_mysql.php
          php -l tests/phpunit/CreatorCampaignParticipationV3ContractTest.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/creator-campaign-builder-phase3.js
          node --check assets/js/creator-campaign-participation.js
          node --check assets/js/merchant-creator-campaign-participation.js
      - name: Phase 2 compatibility validation
        run: |
          php scripts/validate_creator_campaign_merchant_builder_v2.php
          vendor/bin/phpunit tests/phpunit/CreatorCampaignMerchantBuilderV2ContractTest.php
      - name: Phase 3 scored validation
        run: php scripts/validate_creator_campaign_participation_v3.php
      - name: Phase 3 PHPUnit contract
        run: vendor/bin/phpunit tests/phpunit/CreatorCampaignParticipationV3ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php

  mysql-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: testing
      MG_DEBUG: '0'
      MG_APP_URL: http://127.0.0.1:8080
      MG_BASE_URL: http://127.0.0.1:8080
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_PORT: '3306'
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: creator-campaign-participation-v3-validation
      MG_PAYMENT_PROVIDER: stripe
      MG_PAYMENT_MODE: test
      MG_STRIPE_TEST_STUB: '1'
      MG_STRIPE_STUB_ACCOUNT_ACTIVE: '1'
      MG_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_creator_campaign_participation
      MG_STRIPE_SECRET_KEY_TEST: sk_test_creator_campaign_participation
      MG_STRIPE_WEBHOOK_SECRET_TEST: whsec_creator_campaign_participation
      MG_MEDIA_STORAGE_DRIVER: persistent_local
      MG_MEDIA_STORAGE_ROOT: /tmp/microgifter-creator-campaign-participation-storage
      MG_MEDIA_PUBLIC_ENDPOINT: /api/public/media.php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json,mbstring,pdo,pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -umicrogifter -pmicrogifter --silent && exit 0
            sleep 1
          done
          exit 1
      - name: Apply canonical migration chain
        run: composer migrate
      - name: Verify Phase 3 schema contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='microgifter' AND table_name IN ('creator_campaign_applications','creator_campaign_application_answers','creator_campaign_invitations','creator_campaign_participants','creator_campaign_participation_events','creator_campaign_agreements','creator_campaign_agreement_versions','creator_campaign_agreement_acceptances');")" = "8"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM permissions WHERE slug IN ('merchant.creator_applications.view','merchant.creator_applications.manage','merchant.creator_invitations.manage','merchant.creator_participants.view','merchant.creator_participants.manage','merchant.creator_agreements.view','merchant.creator_agreements.manage','creator.campaigns.discover','creator.campaign_applications.manage_own','creator.campaign_invitations.respond_own','creator.campaign_participants.view_own','creator.campaign_agreements.view_own','creator.campaign_agreements.respond_own');")" = "13"
          test "$(mysql -N -B -h 127.0.0.1 -umicrogifter -pmicrogifter microgifter -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='microgifter' AND table_name IN ('creator_campaign_tracking_sources','creator_campaign_tracking_events','creator_campaign_attributions','creator_campaign_compensation_rules','creator_campaign_earning_events','creator_campaign_budget_ledger','creator_campaign_payouts','creator_campaign_disputes');")" = "0"
      - name: Execute clean-database participation lifecycle
        run: php scripts/validate_creator_campaign_participation_v3_mysql.php
