name: MCP External Agent Authorization Phase 2A

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - '.well-known/oauth-authorization-server/**'
      - 'oauth/**'
      - 'account-ai-connections.php'
      - 'admin/mcp-oauth-clients.php'
      - 'api/internal/_mcp_oauth_bridge.php'
      - 'api/internal/mcp-bridge.php'
      - 'assets/css/mcp-oauth.css'
      - 'includes/mcp-oauth.php'
      - 'includes/mcp-oauth/**'
      - 'database/20260720_mcp_external_agent_authorization_phase2a_v1.sql'
      - 'config/migrations.php'
      - 'config/mcp_external_agent_authorization_phase2a_release.php'
      - 'services/mcp/**'
      - 'deploy/vps/mcp.env.example'
      - 'deploy/vps/php-oauth.env.example'
      - 'deploy/vps/nginx/mcp.microgifter.com.conf.template'
      - '.htaccess'
      - 'scripts/test_mcp_external_agent_authorization_phase2a.php'
      - 'scripts/validate_mcp_external_agent_authorization_phase2a_v1.php'
      - 'tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php'
      - 'docs/MICROGIFTER_MCP_EXTERNAL_AGENT_AUTHORIZATION_PHASE2A.md'
      - '.github/workflows/mcp-external-agent-authorization-phase2a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-oauth-resource-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install locked dependencies
        working-directory: services/mcp
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        working-directory: services/mcp
        run: npm audit --audit-level=high
      - name: Build and test MCP service
        working-directory: services/mcp
        run: npm run check
      - name: Validate production OAuth environment
        working-directory: services/mcp
        env:
          MICROGIFTER_MCP_ENV: production
          MICROGIFTER_MCP_RELEASE: ci-phase2a
          MICROGIFTER_MCP_ENABLED: 'true'
          MICROGIFTER_MCP_INTERNAL_HTTP_ENABLED: 'true'
          MICROGIFTER_MCP_INTERNAL_HOST: 127.0.0.1
          MICROGIFTER_MCP_INTERNAL_PORT: '8787'
          MICROGIFTER_MCP_PUBLIC_BASE_URL: https://mcp.microgifter.test
          MICROGIFTER_MCP_ALLOWED_HOSTS: mcp.microgifter.test
          MICROGIFTER_MCP_INTERNAL_TOKEN_SHA256: 0c9e56f32df85f6c5f606d0a57b6f4baeea649f3cc5c72a945f1fb2f874b62b5
          MICROGIFTER_MCP_INTERNAL_CONNECTION_ID: 9eb6e4b1-5c50-4e7a-9b5e-d68828b62822
          MICROGIFTER_MCP_INTERNAL_CLIENT_KEY: ci-phase2a-client
          MICROGIFTER_MCP_INTERNAL_USER_ID: '42'
          MICROGIFTER_MCP_EXTERNAL_OAUTH_ENABLED: 'true'
          MICROGIFTER_MCP_RESOURCE_URI: https://mcp.microgifter.test/mcp
          MICROGIFTER_MCP_AUTHORIZATION_SERVER: https://microgifter.test
          MICROGIFTER_MCP_PROTECTED_RESOURCE_METADATA_URL: https://mcp.microgifter.test/.well-known/oauth-protected-resource
          MICROGIFTER_MCP_ALLOW_INTERNAL_BEARER: 'true'
          MICROGIFTER_MCP_BRIDGE_ENABLED: 'true'
          MICROGIFTER_MCP_BRIDGE_URL: https://microgifter.test/api/internal/mcp-bridge.php
          MICROGIFTER_MCP_BRIDGE_SECRET: ci-phase2a-bridge-secret-0123456789abcdef
          MICROGIFTER_MCP_LOG_LEVEL: silent
        run: npm run validate:env

  php-oauth-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: php-oauth-authority (${{ matrix.php }})
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: ci-phase2a-pepper
      MG_MCP_BRIDGE_ENABLED: 'true'
      MG_MCP_BRIDGE_SECRET: ci-phase2a-bridge-secret-0123456789abcdef
      MG_MCP_OAUTH_ENABLED: 'true'
      MG_MCP_OAUTH_ISSUER: https://microgifter.test
      MG_MCP_OAUTH_RESOURCE_URI: https://mcp.microgifter.test/mcp
      MG_MCP_OAUTH_DYNAMIC_REGISTRATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find includes/mcp-oauth oauth .well-known/oauth-authorization-server -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l includes/mcp-oauth.php
          php -l account-ai-connections.php
          php -l admin/mcp-oauth-clients.php
          php -l api/internal/_mcp_oauth_bridge.php
          php -l api/internal/mcp-bridge.php
          php -l config/mcp_external_agent_authorization_phase2a_release.php
          php -l scripts/test_mcp_external_agent_authorization_phase2a.php
          php -l scripts/validate_mcp_external_agent_authorization_phase2a_v1.php
          php -l tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php
      - name: Static Phase 2A contract
        run: php scripts/validate_mcp_external_agent_authorization_phase2a_v1.php
      - name: Phase 2A and MCP regression contracts
        run: |
          vendor/bin/phpunit \
            tests/phpunit/McpExternalAgentAuthorizationPhase2aV1ContractTest.php \
            tests/phpunit/McpProductionVpsDeploymentV1ContractTest.php \
            tests/phpunit/McpPhase1ProvisioningConsoleV1ContractTest.php \
            tests/phpunit/McpPhase1CanonicalBridgeV1ContractTest.php \
            tests/phpunit/McpPhase1ProtocolV1ContractTest.php \
            tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Build clean MySQL database
        shell: bash
        run: |
          set -o pipefail
          php scripts/run_migrations.php 2>&1 | tee /tmp/mcp-phase2a-migrations.log
      - name: Verify OAuth tables
        run: |
          php -r '
          $config = require "api/config.php";
          $db = $config["db"];
          $pdo = new PDO(
              sprintf("mysql:host=%s;dbname=%s;charset=%s", $db["host"], $db["name"], $db["charset"]),
              getenv("MG_MIGRATION_DB_USER"),
              getenv("MG_MIGRATION_DB_PASS"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $expected = [
              "mcp_oauth_authorization_codes",
              "mcp_oauth_authorization_requests",
              "mcp_oauth_client_registrations",
              "mcp_oauth_consents",
              "mcp_oauth_tokens"
          ];
          $placeholders = implode(",", array_fill(0, count($expected), "?"));
          $stmt = $pdo->prepare("SELECT table_name FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (" . $placeholders . ") ORDER BY table_name");
          $stmt->execute($expected);
          $actual = $stmt->fetchAll(PDO::FETCH_COLUMN);
          sort($expected);
          if ($actual !== $expected) {
              fwrite(STDERR, "OAuth table mismatch. Expected: " . json_encode($expected) . " Actual: " . json_encode($actual) . PHP_EOL);
              exit(1);
          }
          echo "MCP OAuth Phase 2A tables verified." . PHP_EOL;
          '
      - name: Execute OAuth authorization, rotation, and replay flow
        run: php scripts/test_mcp_external_agent_authorization_phase2a.php
      - name: Task Agent and Approval Center regressions
        run: |
          vendor/bin/phpunit \
            tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php \
            tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php \
            tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php
      - name: Repository production-quality audit
        run: composer audit-repository-quality
      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-phase2a-migration-log-php-${{ matrix.php }}
          path: /tmp/mcp-phase2a-migrations.log
          if-no-files-found: ignore

  proxy-discovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Nginx validator
        run: sudo apt-get update && sudo apt-get install -y nginx-light openssl
      - name: Validate OAuth discovery proxy
        shell: bash
        run: |
          set -euo pipefail
          domain=mcp.microgifter.test
          sudo mkdir -p "/etc/letsencrypt/live/$domain"
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=mcp.microgifter.test' \
            -keyout "/etc/letsencrypt/live/$domain/privkey.pem" \
            -out "/etc/letsencrypt/live/$domain/fullchain.pem" >/dev/null 2>&1
          sed "s/__MCP_DOMAIN__/$domain/g" deploy/vps/nginx/mcp.microgifter.com.conf.template > /tmp/mcp-site.conf
          cat >/tmp/mcp-nginx.conf <<NGINX
          events {}
          http {
            include /etc/nginx/mime.types;
            include /tmp/mcp-site.conf;
          }
          NGINX
          sudo nginx -t -c /tmp/mcp-nginx.conf
          grep -F 'location = /.well-known/oauth-protected-resource' /tmp/mcp-site.conf
          grep -F 'location = /mcp' /tmp/mcp-site.conf
