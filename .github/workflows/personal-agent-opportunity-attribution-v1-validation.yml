name: Personal Agent Opportunity Attribution v1 Validation
on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'agent.php'
      - 'lists.php'
      - 'checkout-success.php'
      - 'includes/footer.php'
      - 'includes/personal-gifting-agent.php'
      - 'includes/personal-agent/**'
      - 'includes/merchant-agent-roi-view.php'
      - 'api/user-agent/**'
      - 'api/merchant/personal-agent-attribution.php'
      - 'api/commerce/cart-items.php'
      - 'api/commerce/cart-checkout.php'
      - 'assets/css/personal-agent-opportunity-actions.css'
      - 'assets/js/personal-agent-opportunity-actions.js'
      - 'assets/js/personal-agent-attribution-runtime.js'
      - 'assets/js/saved-opportunities.js'
      - 'assets/js/customer-commerce.js'
      - 'assets/js/merchant-agent-roi.js'
      - 'database/stage_18ak_personal_agent_opportunity_attribution_v1.sql'
      - 'scripts/validate_personal_agent_opportunity_attribution_v1.php'
      - '.github/workflows/personal-agent-opportunity-attribution-v1-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          for file in agent.php lists.php checkout-success.php includes/footer.php includes/personal-gifting-agent.php includes/personal-agent/opportunity-attribution.php includes/personal-agent/opportunity-response.php includes/personal-agent/credit-response.php includes/merchant-agent-roi-view.php api/user-agent/opportunities.php api/user-agent/opportunity-action.php api/merchant/personal-agent-attribution.php api/commerce/cart-items.php api/commerce/cart-checkout.php scripts/validate_personal_agent_opportunity_attribution_v1.php; do php -l "$file"; done
      - name: JavaScript syntax
        run: |
          for file in assets/js/personal-agent-opportunity-actions.js assets/js/personal-agent-attribution-runtime.js assets/js/saved-opportunities.js assets/js/customer-commerce.js assets/js/merchant-agent-roi.js; do node --check "$file"; done
      - name: Contract
        run: php scripts/validate_personal_agent_opportunity_attribution_v1.php
