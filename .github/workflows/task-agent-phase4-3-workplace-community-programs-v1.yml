name: Task Agent Phase 4.3 Workplace Community Programs v1

on:
  pull_request:
    paths:
      - 'includes/task-agent-program-coordination.php'
      - 'includes/task-agent-program-coordination-router.php'
      - 'includes/multi-agent-workspace-data.php'
      - 'api/agents/runtime.php'
      - 'agent.php'
      - 'assets/js/task-agent-program-coordination-runtime.js'
      - 'config/migrations.php'
      - 'scripts/validate_migration_manifest.php'
      - 'tests/phpunit/TaskAgentPhase43WorkplaceCommunityProgramsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php'
      - 'tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php'
      - '.github/workflows/task-agent-phase4-3-workplace-community-programs-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    name: validate (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l includes/task-agent-program-coordination.php
          php -l includes/task-agent-program-coordination-router.php
          php -l includes/multi-agent-workspace-data.php
          php -l api/agents/runtime.php
          php -l agent.php
          php -l tests/phpunit/TaskAgentPhase43WorkplaceCommunityProgramsV1ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/task-agent-program-coordination-runtime.js
      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: Phase 4.3 contract
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase43WorkplaceCommunityProgramsV1ContractTest.php
      - name: Phase 4.2 group gifting regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase42GroupGiftingV1ContractTest.php
      - name: Phase 4.1 recurring regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase41RecurringProgramsV1ContractTest.php
      - name: Phase 3 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase36ProductionQaV1ContractTest.php tests/phpunit/TaskAgentPhase36SafetyBoundaryV1ContractTest.php
      - name: Phase 2 production regression
        run: vendor/bin/phpunit tests/phpunit/TaskAgentPhase2ProductionQaV1ContractTest.php
