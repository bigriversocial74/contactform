name: Product Bundles Foundation Builder v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'api/bundles/**'
      - 'api/merchant/bundles.php'
      - 'merchant-bundles.php'
      - 'merchant-bundle-invitations.php'
      - 'includes/merchant-bundles-view.php'
      - 'includes/merchant-bundle-invitations-view.php'
      - 'includes/merchant-navigation.php'
      - 'includes/merchant-view.php'
      - 'assets/js/merchant-bundles.js'
      - 'assets/css/merchant-bundles.css'
      - 'database/20260719_product_bundles_foundation_builder_v1.sql'
      - 'config/migrations.php'
      - 'tests/phpunit/ProductBundlesFoundationBuilderV1ContractTest.php'
      - '.github/workflows/product-bundles-foundation-builder-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, json, curl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l api/bundles/_bundles.php
          php -l api/merchant/bundles.php
          php -l merchant-bundles.php
          php -l merchant-bundle-invitations.php
          php -l includes/merchant-bundles-view.php
          php -l includes/merchant-bundle-invitations-view.php
          php -l includes/merchant-navigation.php
          php -l includes/merchant-view.php
          php -l tests/phpunit/ProductBundlesFoundationBuilderV1ContractTest.php
      - name: JavaScript syntax
        run: node --check assets/js/merchant-bundles.js
      - name: Product Bundles contract
        run: vendor/bin/phpunit tests/phpunit/ProductBundlesFoundationBuilderV1ContractTest.php
      - name: Migration manifest
        run: php scripts/validate_migration_manifest.php
