name: Social Design Center v2

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'design-studio.php'
      - 'api/merchant/product.php'
      - 'includes/personal-agent/social-design-center.php'
      - 'assets/js/personal-agent-design-studio-social.js'
      - 'assets/css/personal-agent-design-studio-social.css'
      - 'assets/css/personal-agent-design-studio-social-v2.css'
      - 'assets/js/design-studio-creative-save.js'
      - 'scripts/validate_social_design_center_v2.php'
      - '.github/workflows/social-design-center-v2.yml'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: social-design-center-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: 'json,mbstring,pdo,pdo_mysql'
          coverage: none
          tools: 'composer:v2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l design-studio.php
          php -l api/merchant/product.php
          php -l includes/personal-agent/social-design-center.php
          php -l scripts/validate_social_design_center_v2.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/personal-agent-design-studio-social.js
          node --check assets/js/design-studio-creative-save.js
      - name: Social Design Center contract
        run: php scripts/validate_social_design_center_v2.php
      - name: Repository production quality
        run: composer audit-repository-quality
