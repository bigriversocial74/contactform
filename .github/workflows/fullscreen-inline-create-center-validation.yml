name: Fullscreen Inline Create Center Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'includes/header-templates/create-menu.php'
      - 'includes/header-components/post-composer-modal.php'
      - 'includes/header-components/create-list-extension.php'
      - 'includes/social-feed-composer.php'
      - 'assets/css/create-center-inline.css'
      - 'assets/css/create-center-mobile-post-unified.css'
      - 'assets/css/create-center-post-professional.css'
      - 'assets/css/create-center-manage-actions.css'
      - 'assets/js/create-menu.js'
      - 'assets/js/create-center-inline.js'
      - 'assets/js/create-center-storefront-preserve.js'
      - 'assets/js/create-center-post-inline.js'
      - 'assets/js/create-center-post-trigger-fix.js'
      - 'assets/js/create-post-modal-visible-fallback.js'
      - 'assets/js/create-center-manage-actions.js'
      - 'scripts/validate_fullscreen_inline_create_center.php'
      - 'scripts/validate_create_menu_ui_v1.php'
      - 'tests/phpunit/FullscreenInlineCreateCenterContractTest.php'
      - 'tests/phpunit/CreateCenterPostModalContractTest.php'
      - '.github/workflows/fullscreen-inline-create-center-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l includes/header-templates/create-menu.php
          php -l includes/header-components/post-composer-modal.php
          php -l includes/header-components/create-list-extension.php
          php -l includes/social-feed-composer.php
          php -l scripts/validate_fullscreen_inline_create_center.php
          php -l scripts/validate_create_menu_ui_v1.php
          php -l tests/phpunit/FullscreenInlineCreateCenterContractTest.php
          php -l tests/phpunit/CreateCenterPostModalContractTest.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/create-menu.js
          node --check assets/js/create-center-inline.js
          node --check assets/js/create-center-storefront-preserve.js
          node --check assets/js/create-center-post-inline.js
          node --check assets/js/create-center-post-trigger-fix.js
          node --check assets/js/create-post-modal-visible-fallback.js
          node --check assets/js/create-center-manage-actions.js

      - name: Fullscreen inline create center contract
        run: php scripts/validate_fullscreen_inline_create_center.php

      - name: Create menu consistency contract
        run: php scripts/validate_create_menu_ui_v1.php

      - name: PHPUnit contract when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/FullscreenInlineCreateCenterContractTest.php tests/phpunit/CreateCenterPostModalContractTest.php
          else
            echo 'PHPUnit is not installed in this checkout; standalone contracts completed.'
          fi
