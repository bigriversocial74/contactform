name: Personal Agent Contact Intelligence v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'agent.php'
      - 'api/user-agent/**'
      - 'includes/personal-agent/**'
      - 'includes/personal-gifting-agent.php'
      - 'includes/user-contact-lists.php'
      - 'assets/js/personal-agent-contact-intelligence.js'
      - 'assets/css/personal-agent-contact-intelligence.css'
      - 'database/stage_18am_personal_agent_contact_intelligence_v1.sql'
      - 'config/migrations.php'
      - 'scripts/validate_personal_agent_contact_intelligence_v1.php'
      - '.github/workflows/personal-agent-contact-intelligence-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, pdo, pdo_mysql, openssl

      - name: PHP syntax
        run: |
          php -l agent.php
          php -l api/user-agent/action-confirm.php
          php -l api/user-agent/signals.php
          php -l api/user-agent/dashboard.php
          php -l includes/personal-agent/contact-intelligence.php
          php -l includes/personal-agent/contact-intelligence-dashboard.php
          php -l includes/personal-agent/credit-response.php
          php -l includes/personal-gifting-agent.php
          php -l includes/personal-agent/workspace-dashboard.php
          php -l scripts/validate_personal_agent_contact_intelligence_v1.php
          php -l config/migrations.php

      - name: JavaScript syntax
        run: node --check assets/js/personal-agent-contact-intelligence.js

      - name: Contact intelligence contract
        run: php scripts/validate_personal_agent_contact_intelligence_v1.php

      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
