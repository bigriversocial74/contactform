name: One-use VP3 authority UI

on:
  pull_request:
    branches:
      - integration-from-repair-20260628

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/vp3-homeserver-authority-separation-v1-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-homeserver-authority-separation-v1-20260729
          fetch-depth: 0

      - name: Rewrite HomeServer status authority UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('assets/js/homeserver-status-indicator.js')
          source = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              source = source.replace(old, new, 1)

          def replace_regex(pattern: str, replacement: str) -> None:
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one regex match, found {count}: {pattern!r}')

          replace_once(
              "    upgrade_url: '/account-subscriptions.php?homeserver=upgrade'",
              "    upgrade_url: '/account-subscriptions.php?homeserver=provider-access',\n"
              "    software_authority: 'vp3',\n"
              "    vp3_account_url: 'https://vp3.me'"
          )

          replace_regex(
              r"  function hasUpdateAvailable\(\) \{.*?\n  \}\n\n  function statusSummary",
              "  function hasUpdateAvailable() {\n"
              "    return false;\n"
              "  }\n\n"
              "  function statusSummary"
          )
          replace_once(
              "return { tone: 'muted', online: false, label: 'HomeServer not included', detail: entitlement.message || 'Upgrade to a paid Microgifter package to install and connect HomeServer.' };",
              "return { tone: 'muted', online: false, label: 'Microgifter not connected', detail: entitlement.message || 'Enable Microgifter provider access after licensing HomeServer through VP3.' };"
          )
          replace_once(
              "return { tone: 'ready', online: false, label: 'Ready to install', detail: 'HomeServer is included. Download the installer and connect it with a one-time Sync Code.' };",
              "return { tone: 'ready', online: false, label: 'Ready to connect', detail: 'License and install HomeServer through VP3, then connect Microgifter with a one-time Sync Code.' };"
          )

          replace_regex(
              r"  function releaseSummary\(\) \{.*?\n  \}\n\n  function createTrigger",
              "  function releaseSummary() {\n"
              "    return { label: 'Managed by VP3', className: ' is-current' };\n"
              "  }\n\n"
              "  function createTrigger"
          )

          replace_regex(
              r"  function releaseMarkup\(\) \{.*?\n  \}\n\n  function allowanceLabel",
              "  function releaseMarkup() {\n"
              "    return [\n"
              "      '<div class=\"mg-homeserver-release-card\">',\n"
              "      '  <div class=\"mg-homeserver-release-info\">',\n"
              "      '    <div class=\"mg-homeserver-release-title\"><strong>VP3 HomeServer</strong><span class=\"mg-homeserver-release-state is-current\">Software authority</span></div>',\n"
              "      '    <p>VP3 manages the HomeServer license, registered device, Windows installer, signed release channels, and software updates.</p>',\n"
              "      '  </div>',\n"
              "      '  <a class=\"mg-homeserver-release-download\" href=\"https://vp3.me\" rel=\"noopener\">Open VP3</a>',\n"
              "      '</div>'\n"
              "    ].join('');\n"
              "  }\n\n"
              "  function allowanceLabel"
          )

          replace_once("'    <span>Cloud connection</span>',", "'    <span>Microgifter connection</span>',")
          replace_once("'    <span>Package access</span>',", "'    <span>Microgifter access</span>',")
          replace_once("'    <div><p>Windows installer</p><h3>Download HomeServer</h3></div>',", "'    <div><p>Software authority</p><h3>VP3 HomeServer</h3></div>',")
          replace_once(
              "(entitlement.can_manage ? '  <a href=\"/account-homeserver.php\">Manage HomeServer</a>' : '  <a href=\"' + escapeHtml(entitlement.upgrade_url || '/account-subscriptions.php?homeserver=upgrade') + '\">Upgrade for HomeServer</a>'),",
              "'  <a class=\"is-secondary\" href=\"https://vp3.me\" rel=\"noopener\">Open VP3</a>',\n"
              "      (entitlement.can_manage ? '  <a href=\"/account-homeserver.php\">Manage Microgifter Connection</a>' : '  <a href=\"' + escapeHtml(entitlement.upgrade_url || '/account-subscriptions.php?homeserver=provider-access') + '\">Enable Microgifter Access</a>'),"
          )

          replace_regex(
              r"  async function loadRelease\(\) \{.*?\n  \}\n\n  async function loadAll",
              "  async function loadRelease() {\n"
              "    latestRelease = null;\n"
              "    releaseSchemaReady = false;\n"
              "    canManageReleases = false;\n"
              "    releaseAdminUrl = null;\n"
              "    releaseLoadFailed = false;\n"
              "  }\n\n"
              "  async function loadAll"
          )

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/one-use-vp3-authority-ui.yml').unlink()

      - name: Validate changed authority files
        run: |
          node --check assets/js/homeserver-status-indicator.js
          php -l includes/homeserver-entitlements.php
          php -l includes/account/homeserver-subscription-card.php
          php -l includes/account/homeserver-view.php
          php -l api/homeserver/latest-release.php
          php -l api/homeserver/download.php
          php -l api/homeserver/v1/_contract-entitlement.php
          php -l api/homeserver/v1/update-authorize.php
          php -l api/homeserver/v1/update-receipts.php
          php -l tests/phpunit/HomeServerPaidEntitlementAccessContractTest.php
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit tests/phpunit/HomeServerPaidEntitlementAccessContractTest.php

      - name: Commit authority UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify VP3 software authority in Microgifter UI"
          git push origin HEAD:feature/vp3-homeserver-authority-separation-v1-20260729
