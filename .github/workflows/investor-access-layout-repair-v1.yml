name: Investor Access Layout Repair v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'investor-access.php'
      - 'scripts/validate_investor_access_layout_repair_v1.php'
      - '.github/workflows/investor-access-layout-repair-v1.yml'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: investor-access-layout-repair-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: 'json,mbstring,pdo,pdo_mysql'
          coverage: none
          tools: 'composer:v2'
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l investor-access.php
          php -l scripts/validate_investor_access_layout_repair_v1.php
      - name: Investor Access layout contract
        run: php scripts/validate_investor_access_layout_repair_v1.php
      - name: Repository production quality
        run: composer audit-repository-quality
