name: Design Calendar Row Layout v1 Validation

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'design-calendar.php'
      - 'includes/personal-agent/workspace-design-calendar.php'
      - 'assets/css/design-calendar-row-layout-v1.css'
      - 'assets/js/design-calendar-row-layout-v1.js'
      - 'assets/js/personal-agent-design-studio-calendar.js'
      - 'scripts/validate_design_calendar_row_layout_v1.php'
      - '.github/workflows/design-calendar-row-layout-v1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: |
          php -l design-calendar.php
          php -l scripts/validate_design_calendar_row_layout_v1.php

      - name: JavaScript syntax
        run: node --check assets/js/design-calendar-row-layout-v1.js

      - name: Calendar row layout contract
        run: php scripts/validate_design_calendar_row_layout_v1.php
