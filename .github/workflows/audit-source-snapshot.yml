name: Audit Source Snapshot

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - .github/workflows/audit-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'audit/repository-production-hardening-20260717' || github.ref_name == 'audit/repository-production-hardening-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repository-production-hardening-20260717

      - name: Package tracked source
        run: git archive --format=zip --output=/tmp/contactform-audit-source.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: contactform-audit-source
          path: /tmp/contactform-audit-source.zip
          if-no-files-found: error
