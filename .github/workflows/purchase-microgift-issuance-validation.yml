name: Purchase to Microgift Issuance v1 Validation

on:
  pull_request:
    paths:
      - 'api/payments/_capture.php'
      - 'api/payments/_fulfillment.php'
      - 'api/payments/_issuance_reconciliation.php'
      - 'api/payments/_local_confirmation.php'
      - 'api/payments/cash-confirm.php'
      - 'api/payments/sandbox-confirm.php'
      - 'api/payments/webhook.php'
      - 'api/commerce/_order_issuance_summary.php'
      - 'api/commerce/order-confirmation.php'
      - 'api/commerce/order-issuance-reconcile.php'
      - 'assets/js/order-success.js'
      - 'tests/phpunit/PostCheckoutMicrogiftIssuanceContractTest.php'
      - 'tests/phpunit/ProductionCheckoutCaptureBehaviorTest.php'
      - 'scripts/validate_purchase_microgift_issuance_v1.php'
      - '.github/workflows/purchase-microgift-issuance-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate paid order delivery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        run: |
          set -euo pipefail
          php -l api/payments/_capture.php
          php -l api/payments/_fulfillment.php
          php -l api/payments/_issuance_reconciliation.php
          php -l api/payments/_local_confirmation.php
          php -l api/payments/cash-confirm.php
          php -l api/payments/sandbox-confirm.php
          php -l api/payments/webhook.php
          php -l api/commerce/_order_issuance_summary.php
          php -l api/commerce/order-confirmation.php
          php -l api/commerce/order-issuance-reconcile.php
          php -l tests/phpunit/PostCheckoutMicrogiftIssuanceContractTest.php
          php -l tests/phpunit/ProductionCheckoutCaptureBehaviorTest.php
          php -l scripts/validate_purchase_microgift_issuance_v1.php

      - name: JavaScript syntax check
        run: node --check assets/js/order-success.js

      - name: Validate ten-point issuance contract
        run: php scripts/validate_purchase_microgift_issuance_v1.php

      - name: Run focused issuance contracts
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/PostCheckoutMicrogiftIssuanceContractTest.php tests/phpunit/ProductionCheckoutCaptureBehaviorTest.php
          else
            echo 'vendor/bin/phpunit not installed; static contracts completed.'
          fi
