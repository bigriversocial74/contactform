name: Merchant Contact Action Center v1

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'merchant-agent-chat.php'
      - 'includes/merchant-agent-chat-view.php'
      - 'api/ai/merchant-agent-chat.php'
      - 'includes/ai/merchant-agent-contact-action-center.php'
      - 'includes/ai/merchant-agent-crm-contact-context.php'
      - 'includes/ai/merchant-agent-crm-contact-chat.php'
      - 'includes/ai/merchant-agent-thread-delete.php'
      - 'assets/css/merchant-agent-contact-action-center.css'
      - 'assets/js/merchant-agent-contact-action-center.js'
      - 'assets/js/merchant-agent-contact-action-center-select-bridge.js'
      - 'docs/merchant-contact-action-center-v1.md'
      - 'scripts/validate_merchant_contact_action_center_v1.php'
      - 'tests/phpunit/MerchantContactActionCenterV1Test.php'
      - '.github/workflows/merchant-contact-action-center-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l merchant-agent-chat.php
          php -l includes/merchant-agent-chat-view.php
          php -l api/ai/merchant-agent-chat.php
          php -l includes/ai/merchant-agent-contact-action-center.php
          php -l includes/ai/merchant-agent-crm-contact-context.php
          php -l includes/ai/merchant-agent-crm-contact-chat.php
          php -l includes/ai/merchant-agent-thread-delete.php
          php -l scripts/validate_merchant_contact_action_center_v1.php
          php -l tests/phpunit/MerchantContactActionCenterV1Test.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/merchant-agent-contact-action-center.js
          node --check assets/js/merchant-agent-contact-action-center-select-bridge.js
          node --check assets/js/merchant-agent-crm-mention-search.js
          node --check assets/js/merchant-agent-chat.js
      - name: Contact Action Center contract
        run: php scripts/validate_merchant_contact_action_center_v1.php
      - name: PHPUnit when available
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/phpunit/MerchantContactActionCenterV1Test.php
          fi
