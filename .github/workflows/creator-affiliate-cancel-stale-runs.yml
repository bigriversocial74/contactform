name: Cancel Stale Creator Affiliate Runs

on:
  push:
    branches:
      - feature/creator-affiliate-operations-v16-20260730
    paths:
      - .github/workflows/creator-affiliate-cancel-stale-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: creator-affiliate-cancel-stale-runs
  cancel-in-progress: true

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded pull request workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          CURRENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          page=1
          cancelled=0

          while true; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs?branch=${BRANCH_NAME}&event=pull_request&per_page=100&page=${page}")"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            if [[ "${count}" -eq 0 ]]; then
              break
            fi

            mapfile -t run_ids < <(jq -r --arg current "${CURRENT_HEAD}" '
              .workflow_runs[]
              | select(.head_sha != $current)
              | select(
                  .status == "queued"
                  or .status == "pending"
                  or .status == "waiting"
                  or .status == "requested"
                  or .status == "in_progress"
                )
              | .id
            ' <<<"${response}")

            for run_id in "${run_ids[@]}"; do
              echo "Cancelling superseded run ${run_id}"
              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel" \
                >/dev/null || true
              cancelled=$((cancelled + 1))
            done

            if [[ "${count}" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Cancelled ${cancelled} superseded workflow runs."
          echo "Preserved current PR head ${CURRENT_HEAD}."
