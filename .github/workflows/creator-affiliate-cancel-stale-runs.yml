name: Repair Creator Affiliate Workflow Fanout

on:
  push:
    branches:
      - feature/creator-affiliate-operations-v16-20260730
    paths:
      - .github/workflows/creator-affiliate-cancel-stale-runs.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: creator-affiliate-fanout-repair
  cancel-in-progress: true

jobs:
  repair-fanout:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-affiliate-operations-v16-20260730
          fetch-depth: 0

      - name: Remove broad workflow triggers
        run: |
          python3 <<'PY'
          from pathlib import Path

          migration = Path('config/migrations.php')
          text = migration.read_text()
          marker = "        '20260730_creator_affiliate_operations_experience_v16.sql' => 'Manual Creator affiliate payout policy, reconciliation, merchant operations, and Creator finance experience migration; apply after the Creator Campaign Phase 8 payout schema and Phases 1–15 audit repair.',\n"
          if marker not in text:
              raise SystemExit('Expected v16 manual migration entry was not found.')
          migration.write_text(text.replace(marker, '', 1))

          workflow = Path('.github/workflows/creator-affiliate-operations-v16.yml')
          text = workflow.read_text()
          for marker in (
              "      - 'config/migrations.php'\n",
              "          php -l config/migrations.php\n",
          ):
              if marker not in text:
                  raise SystemExit(f'Expected workflow marker was not found: {marker!r}')
              text = text.replace(marker, '', 1)
          workflow.write_text(text)

          validator = Path('scripts/validate_creator_affiliate_operations_v16.php')
          text = validator.read_text()
          for marker in (
              "$manifest='config/migrations.php';\n",
              "$add('Manual migration registration', $contains($manifest,\"'20260730_creator_affiliate_operations_experience_v16.sql' => 'Manual Creator affiliate\"));\n",
          ):
              if marker not in text:
                  raise SystemExit(f'Expected validator marker was not found: {marker!r}')
              text = text.replace(marker, '', 1)
          validator.write_text(text)

          Path('.github/workflows/creator-affiliate-cancel-stale-runs.yml').unlink()
          PY

          git diff --check

      - name: Commit repaired workflow scope
        run: |
          git config user.name "Microgifter CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prevent Creator affiliate workflow fanout"
          git push origin HEAD:feature/creator-affiliate-operations-v16-20260730
          echo "REPAIRED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cancel obsolete and unrelated PR runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: feature/creator-affiliate-operations-v16-20260730
        run: |
          sleep 10
          python3 <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH_NAME']
          repaired_head = os.environ['REPAIRED_HEAD']
          active = {'queued', 'pending', 'waiting', 'requested', 'in_progress'}
          preserve = {
              'Creator Affiliate Operations v16',
              'Creator Campaign Phases 1-15 Production Audit v1',
              'Repository Production Quality',
              'Merchant Navigation Groups v1',
          }
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          cancelled = 0
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repository}/actions/runs?branch={branch}&event=pull_request&per_page=100&page={page}'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response)['workflow_runs']
              if not runs:
                  break
              for run in runs:
                  if run['status'] not in active:
                      continue
                  keep = run['head_sha'] == repaired_head and run['name'] in preserve
                  if keep:
                      continue
                  cancel_url = f"https://api.github.com/repos/{repository}/actions/runs/{run['id']}/cancel"
                  cancel_request = urllib.request.Request(cancel_url, method='POST', headers=headers)
                  try:
                      urllib.request.urlopen(cancel_request).read()
                      cancelled += 1
                      print(f"Cancelled {run['name']} #{run['id']} at {run['head_sha']}")
                  except Exception as exc:
                      print(f"Cancellation skipped for {run['id']}: {exc}")
              if len(runs) < 100:
                  break
              page += 1
          print(f'Cancelled {cancelled} obsolete or unrelated runs.')
          print(f'Preserved retained certification for {repaired_head}.')
          PY
