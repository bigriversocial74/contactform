name: MCP Phase 1 Foundation v1

on:
  pull_request:
    branches: [integration-from-repair-20260628]
    paths:
      - 'services/mcp/**'
      - 'database/20260720_microgifter_mcp_automation_foundation_v1.sql'
      - 'config/migrations.php'
      - 'config/mcp_phase1_foundation_release.php'
      - 'docs/MICROGIFTER_MCP_PHASE1_FOUNDATION_RUNBOOK.md'
      - 'scripts/validate_mcp_phase1_foundation.php'
      - 'tests/phpunit/McpPhase1FoundationV1ContractTest.php'
      - '.github/workflows/mcp-phase1-foundation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and test
        run: npm run check

  php-and-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: php-and-migration (${{ matrix.php }})
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: microgifter
          MYSQL_USER: microgifter
          MYSQL_PASSWORD: microgifter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MG_APP_ENV: test
      MG_RUNTIME_PROFILE: local
      MG_DB_HOST: 127.0.0.1
      MG_DB_NAME: microgifter
      MG_DB_USER: microgifter
      MG_DB_PASS: microgifter
      MG_MIGRATION_DB_USER: root
      MG_MIGRATION_DB_PASS: root
      MG_DB_CHARSET: utf8mb4
      MG_CLAIM_CODE_PEPPER: ci-mcp-phase1-foundation-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l config/mcp_phase1_foundation_release.php
          php -l config/migrations.php
          php -l scripts/validate_mcp_phase1_foundation.php
          php -l tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Canonical migration manifest
        run: php scripts/validate_migration_manifest.php
      - name: MCP Phase 1 executable contract
        run: php scripts/validate_mcp_phase1_foundation.php
      - name: MCP Phase 1 PHPUnit contract
        run: vendor/bin/phpunit tests/phpunit/McpPhase1FoundationV1ContractTest.php
      - name: Build clean MySQL database
        shell: bash
        run: |
          set -o pipefail
          php scripts/run_migrations.php 2>&1 | tee /tmp/mcp-phase1-migrations.log
      - name: Verify exact MCP foundation tables
        run: |
          php -r '
          $config = require "api/config.php";
          $db = $config["db"];
          $pdo = new PDO(
              sprintf("mysql:host=%s;dbname=%s;charset=%s", $db["host"], $db["name"], $db["charset"]),
              getenv("MG_MIGRATION_DB_USER"),
              getenv("MG_MIGRATION_DB_PASS"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $release = require "config/mcp_phase1_foundation_release.php";
          $expected = $release["control_plane_tables"];
          sort($expected);
          $placeholders = implode(",", array_fill(0, count($expected), "?"));
          $stmt = $pdo->prepare(
              "SELECT table_name FROM information_schema.tables " .
              "WHERE table_schema = DATABASE() AND table_name IN (" . $placeholders . ") ORDER BY table_name"
          );
          $stmt->execute($expected);
          $actual = $stmt->fetchAll(PDO::FETCH_COLUMN);
          if ($actual !== $expected) {
              fwrite(STDERR, "MCP table mismatch. Expected: " . json_encode($expected) . " Actual: " . json_encode($actual) . PHP_EOL);
              exit(1);
          }
          echo "Exact MCP foundation tables verified: " . count($actual) . PHP_EOL;
          '
      - name: Task Agent Phase 4 and Approval Center regressions
        run: |
          vendor/bin/phpunit \
            tests/phpunit/TaskAgentPhase46ProductionQaV1ContractTest.php \
            tests/phpunit/TaskAgentPhase46SafetyBoundaryV1ContractTest.php \
            tests/phpunit/ProductionAgentPlanReviewApprovalCenterSection2Test.php
      - name: Repository production-quality audit
        run: composer audit-repository-quality
      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-phase1-migration-log-php-${{ matrix.php }}
          path: /tmp/mcp-phase1-migrations.log
          if-no-files-found: ignore
