name: Gift Action Center Pagination Validation

on:
  pull_request:
    paths:
      - 'includes/gift-action-center.php'
      - 'assets/css/gift-action-center-pagination.css'
      - 'assets/js/gift-action-center-runtime-v4.js'
      - 'scripts/validate_gift_action_center_pagination.php'
      - '.github/workflows/gift-action-center-pagination-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-php-82:
    name: validate (8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: php -l includes/gift-action-center.php && php -l scripts/validate_gift_action_center_pagination.php
      - name: JavaScript syntax
        run: node --check assets/js/gift-action-center-runtime-v4.js
      - name: Pagination contract
        run: php scripts/validate_gift_action_center_pagination.php

  validate-php-83:
    name: validate (8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: php -l includes/gift-action-center.php && php -l scripts/validate_gift_action_center_pagination.php
      - name: JavaScript syntax
        run: node --check assets/js/gift-action-center-runtime-v4.js
      - name: Pagination contract
        run: php scripts/validate_gift_action_center_pagination.php
