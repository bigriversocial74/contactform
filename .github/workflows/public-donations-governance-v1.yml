name: Public Donations Governance Phase 9

on:
  pull_request:
    branches:
      - integration-from-repair-20260628
    paths:
      - 'includes/public-donations-feature.php'
      - 'includes/public-donations-governance.php'
      - 'includes/public-donations-governance-locks.php'
      - 'includes/public-donations-allocation.php'
      - 'includes/public-donations-recall.php'
      - 'includes/public-profile-community.php'
      - 'includes/merchant-navigation.php'
      - 'api/merchant/public-donations-community.php'
      - 'api/merchant/public-donations-allocation.php'
      - 'api/merchant/public-donations-recall.php'
      - 'api/merchant/community-support.php'
      - 'merchant-community-support.php'
      - 'includes/public-donations-public-view.php'
      - 'database/20260724_public_donations_community_v1_single_install.sql'
      - 'scripts/validate_public_donations_governance_v1.php'
      - 'scripts/test_public_donations_governance_mysql.php'
      - 'tests/phpunit/PublicDonationsGovernanceContractTest.php'
      - '.github/workflows/public-donations-governance-v1.yml'

permissions:
  contents: read

concurrency:
  group: public-donations-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: microgifter_phase9
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: microgifter_phase9
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MG_PUBLIC_DONATIONS_FEATURE_STATE: enabled
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql,mbstring
          tools: phpunit
      - name: PHP 8.2 syntax
        run: |
          php -l includes/public-donations-governance.php
          php -l includes/public-donations-governance-locks.php
          php -l api/merchant/public-donations-community.php
          php -l api/merchant/public-donations-allocation.php
          php -l api/merchant/public-donations-recall.php
          php -l api/merchant/community-support.php
          php -l includes/merchant-navigation.php
          php -l merchant-community-support.php
          php -l scripts/validate_public_donations_governance_v1.php
          php -l scripts/test_public_donations_governance_mysql.php
          php -l tests/phpunit/PublicDonationsGovernanceContractTest.php
      - name: PHP 8.2 focused governance contracts
        run: php scripts/validate_public_donations_governance_v1.php
      - name: PHP 8.2 PHPUnit governance contracts
        run: phpunit tests/phpunit/PublicDonationsGovernanceContractTest.php
      - name: PHP 8.2 governance MySQL lifecycle
        run: php scripts/test_public_donations_governance_mysql.php
      - name: PHP 8.2 Public Donations regression lifecycles
        run: |
          php scripts/test_public_donations_community_assignment_mysql.php
          php scripts/test_public_donations_allocation_mysql.php
          php scripts/test_public_donations_recall_mysql.php
          php scripts/test_merchant_community_support_mysql.php
          php scripts/test_public_profile_community_mysql.php

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql,mbstring
          tools: phpunit
      - name: PHP 8.3 syntax
        run: |
          php -l includes/public-donations-governance.php
          php -l includes/public-donations-governance-locks.php
          php -l api/merchant/public-donations-community.php
          php -l api/merchant/public-donations-allocation.php
          php -l api/merchant/public-donations-recall.php
          php -l api/merchant/community-support.php
          php -l includes/merchant-navigation.php
          php -l merchant-community-support.php
          php -l scripts/validate_public_donations_governance_v1.php
          php -l scripts/test_public_donations_governance_mysql.php
          php -l tests/phpunit/PublicDonationsGovernanceContractTest.php
      - name: PHP 8.3 focused governance contracts
        run: php scripts/validate_public_donations_governance_v1.php
      - name: PHP 8.3 PHPUnit governance contracts
        run: phpunit tests/phpunit/PublicDonationsGovernanceContractTest.php
      - name: PHP 8.3 governance MySQL lifecycle
        run: php scripts/test_public_donations_governance_mysql.php
      - name: PHP 8.3 Public Donations regression lifecycles
        run: |
          php scripts/test_public_donations_community_assignment_mysql.php
          php scripts/test_public_donations_allocation_mysql.php
          php scripts/test_public_donations_recall_mysql.php
          php scripts/test_merchant_community_support_mysql.php
          php scripts/test_public_profile_community_mysql.php
