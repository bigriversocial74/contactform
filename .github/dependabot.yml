version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "integration-from-repair-20260628"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "integration-from-repair-20260628"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
