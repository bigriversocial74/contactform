services:
  microgifter-mcp:
    build:
      context: ../../services/mcp
      dockerfile: Dockerfile
    image: microgifter/mcp-service:phase1-vps
    env_file:
      - ${MICROGIFTER_MCP_ENV_FILE:-/etc/microgifter/mcp.env}
    environment:
      MICROGIFTER_MCP_INTERNAL_HOST: 0.0.0.0
      MICROGIFTER_MCP_ALLOW_NON_LOOPBACK_BIND: "true"
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
